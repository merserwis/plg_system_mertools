; MerTools for Gridbox — plugin settings (fr-FR)

PLG_SYSTEM_MERTOOLS_XML_DESCRIPTION="MerTools for Gridbox (Beta) — un ensemble de corrections et d’optimisations pour Balbooa Gridbox que ses propres réglages ne permettent pas ; chacune est un outil que vous pouvez activer ou désactiver. Les fichiers du cœur de Gridbox ne sont jamais modifiés : les mises à jour de Gridbox s’installent donc sans problème."

PLG_SYSTEM_MERTOOLS_INTRO_LABEL="MerTools for Gridbox (Beta)"
PLG_SYSTEM_MERTOOLS_INTRO_DESC="Corrections et optimisations pour Balbooa Gridbox impossibles à réaliser depuis les propres réglages de Gridbox. Chaque onglet ci-dessous est un outil que l’on peut activer ou désactiver. Les fichiers du cœur de Gridbox ne sont jamais modifiés. <strong>Ceci est une version bêta :</strong> testez chaque outil sur votre site avant de vous y fier, et signalez les problèmes sur GitHub."

PLG_SYSTEM_MERTOOLS_FIELDSET_URL="URL canonique"
PLG_SYSTEM_MERTOOLS_URL_NOTE="Gridbox sert une page quel que soit le nombre de barres obliques dans l’adresse — <code>/oferta</code>, <code>//oferta</code> et <code>//////oferta</code> ouvrent tous la même page avec le statut 200. Les moteurs de recherche voient alors plusieurs adresses pour une seule page (contenu dupliqué). Cet outil redirige chacune de ces adresses vers l’unique adresse propre."

PLG_SYSTEM_MERTOOLS_URL_COLLAPSE_LABEL="Fusionner les barres obliques en double"
PLG_SYSTEM_MERTOOLS_URL_COLLAPSE_DESC="Rediriger toute adresse dont le chemin contient plusieurs barres obliques consécutives vers l’adresse à barres obliques simples (p. ex. <code>//////oferta/mierniki</code> &rarr; <code>/oferta/mierniki</code>). Seul le chemin est modifié ; la chaîne de requête après le <code>?</code> reste telle quelle, et l’adresse reste toujours sur ce site."

PLG_SYSTEM_MERTOOLS_URL_CODE_LABEL="Type de redirection"
PLG_SYSTEM_MERTOOLS_URL_CODE_DESC="301 (permanente) indique aux moteurs de recherche que l’adresse propre est la bonne et lui transfère le classement — recommandé. 302 (temporaire) ne transfère pas le classement ; à n’utiliser que pour les tests."
PLG_SYSTEM_MERTOOLS_URL_CODE_301="301 — permanente (recommandé)"
PLG_SYSTEM_MERTOOLS_URL_CODE_302="302 — temporaire"

PLG_SYSTEM_MERTOOLS_URL_CF_NOTE="<strong>La page s’ouvre toujours avec des barres obliques en double et n’est pas redirigée ?</strong> Votre site se trouve alors derrière Cloudflare (ou un autre CDN/proxy) qui nettoie l’adresse <em>avant</em> qu’elle n’atteigne le serveur &mdash; il fusionne lui-même, sans le signaler, les barres obliques en trop ; ce plugin ne les voit donc jamais et ne peut pas rediriger. La redirection doit alors être configurée chez Cloudflare, le seul endroit qui connaît encore l’adresse d’origine. <details><summary><strong>Configuration dans Cloudflare &mdash; pas à pas</strong></summary><ol><li>Connectez-vous à <code>dash.cloudflare.com</code> et choisissez le domaine.</li><li>Ouvrez <strong>Rules &rarr; Redirect Rules</strong> et cliquez sur <strong>Create rule</strong>.</li><li>Nom de la règle : p. ex. <em>Fusionner les barres obliques en double</em>.</li><li>Sous <strong>When incoming requests match</strong>, passez à <strong>Edit expression</strong> et collez :<br><code>(raw.http.request.uri ne http.request.uri and (http.request.method eq &quot;GET&quot; or http.request.method eq &quot;HEAD&quot;))</code></li><li>Sous <strong>Then</strong>, réglez <strong>Type = Dynamic</strong> et l’<strong>URL expression</strong> :<br><code>concat(&quot;https://&quot;, http.host, http.request.uri)</code></li><li>Code de statut <strong>301</strong> ; <strong>Preserve query string = off</strong>.</li><li>Cliquez sur <strong>Deploy</strong>.</li><li>Si la redirection ne fonctionne toujours pas, ouvrez <strong>Rules &rarr; Settings &rarr; URL Normalization</strong> et activez <em>Normalize incoming URLs</em>.</li></ol>Testez en ouvrant <code>https://your-site/////oferta</code> &mdash; vous devez obtenir une 301 vers l’adresse à barre oblique simple. Aucune offre payante n’est nécessaire : la règle n’utilise pas d’expressions régulières. Laissez aussi l’outil de ce plugin activé &mdash; il traite toujours les requêtes qui atteignent directement le serveur.</details>"

; --- Dark mode ---
PLG_SYSTEM_MERTOOLS_FIELDSET_DARK="Mode sombre"
PLG_SYSTEM_MERTOOLS_DARK_NOTE="Un thème sombre élégant pour tout le site, construit à partir des propres variables de couleur de Gridbox — des gris et des bleus sombres et doux, jamais un noir pur agressif, donc reposant pour les yeux. Un bouton de bascule est placé dans l’en-tête ; le choix du visiteur est mémorisé, et <em>Automatique</em> suit le réglage de son système. Les fichiers du cœur de Gridbox ne sont pas modifiés."
PLG_SYSTEM_MERTOOLS_DARK_ENABLED_LABEL="Mode sombre"
PLG_SYSTEM_MERTOOLS_DARK_ENABLED_DESC="Ajouter au site public un thème sombre et un bouton de bascule dans l’en-tête."
PLG_SYSTEM_MERTOOLS_DARK_PALETTE_LABEL="Palette"
PLG_SYSTEM_MERTOOLS_DARK_PALETTE_DESC="L’apparence du thème sombre. Toutes sont douces (pas de noir pur) ; choisissez celle qui convient au site, ou Personnalisée pour définir chaque couleur vous-même."
PLG_SYSTEM_MERTOOLS_DARK_PAL_SLATE="Ardoise — gris-bleu élégant (recommandé)"
PLG_SYSTEM_MERTOOLS_DARK_PAL_CHARCOAL="Anthracite — gris neutre"
PLG_SYSTEM_MERTOOLS_DARK_PAL_MIDNIGHT="Minuit — bleu profond"
PLG_SYSTEM_MERTOOLS_DARK_PAL_WARM="Chaleureux — brun doux, reposant pour les yeux"
PLG_SYSTEM_MERTOOLS_DARK_PAL_DIM="Tamisé — faible contraste, le plus doux"
PLG_SYSTEM_MERTOOLS_DARK_PAL_CUSTOM="Personnalisée — définissez les couleurs ci-dessous"
PLG_SYSTEM_MERTOOLS_DARK_DEFAULT_LABEL="Par défaut pour les nouveaux visiteurs"
PLG_SYSTEM_MERTOOLS_DARK_DEFAULT_DESC="Ce que voit un visiteur qui n’a pas encore choisi. Automatique suit son système d’exploitation (clair ou sombre). Un choix mémorisé l’emporte toujours."
PLG_SYSTEM_MERTOOLS_DARK_DEFAULT_AUTO="Automatique — suivre le système du visiteur"
PLG_SYSTEM_MERTOOLS_DARK_DEFAULT_LIGHT="Clair"
PLG_SYSTEM_MERTOOLS_DARK_DEFAULT_DARK="Sombre"
PLG_SYSTEM_MERTOOLS_DARK_ACCENT_SITE_LABEL="Accent comme dans Gridbox"
PLG_SYSTEM_MERTOOLS_DARK_ACCENT_SITE_DESC="Conserver la couleur d’accent Gridbox du site (la couleur de la marque) en mode sombre. Désactivez pour définir un autre accent pour le mode sombre."
PLG_SYSTEM_MERTOOLS_DARK_ACCENT_LABEL="Accent du mode sombre"
PLG_SYSTEM_MERTOOLS_DARK_ACCENT_DESC="La couleur d’accent utilisée en mode sombre lorsque l’accent Gridbox n’est pas conservé."
PLG_SYSTEM_MERTOOLS_DARK_TOGGLE_LABEL="Bouton de bascule dans l’en-tête"
PLG_SYSTEM_MERTOOLS_DARK_TOGGLE_DESC="Afficher le bouton de bascule clair/sombre dans l’en-tête. Désactivé, le thème suit toujours le réglage par défaut et le choix mémorisé du visiteur, simplement sans bouton."
PLG_SYSTEM_MERTOOLS_DARK_PLACE_LABEL="Position du bouton"
PLG_SYSTEM_MERTOOLS_DARK_PLACE_DESC="Emplacement du bouton dans l’en-tête."
PLG_SYSTEM_MERTOOLS_DARK_PLACE_AUTO="À côté du menu (automatique)"
PLG_SYSTEM_MERTOOLS_DARK_PLACE_START="Début de l’en-tête"
PLG_SYSTEM_MERTOOLS_DARK_PLACE_END="Fin de l’en-tête"
PLG_SYSTEM_MERTOOLS_DARK_PLACE_FLOAT="Bouton flottant (toujours visible, idéal sur mobile)"
PLG_SYSTEM_MERTOOLS_DARK_SELECTOR_LABEL="Élément d’en-tête (avancé)"
PLG_SYSTEM_MERTOOLS_DARK_SELECTOR_DESC="Sélecteur CSS de l’en-tête dans lequel le bouton est placé. Par défaut <code>header.header</code> (l’en-tête Gridbox). Si le bouton n’apparaît pas, le thème utilise peut-être un autre en-tête ; modifiez ce sélecteur. Si rien ne correspond, le bouton flotte dans le coin inférieur."
PLG_SYSTEM_MERTOOLS_DARK_TRANSITION_LABEL="Transition douce"
PLG_SYSTEM_MERTOOLS_DARK_TRANSITION_DESC="Faire un fondu des couleurs lors du passage entre clair et sombre au lieu de les changer instantanément."
PLG_SYSTEM_MERTOOLS_DARK_DIMMEDIA_LABEL="Adoucir les images claires"
PLG_SYSTEM_MERTOOLS_DARK_DIMMEDIA_DESC="Réduire légèrement la luminosité des photos et des vidéos en mode sombre (les logos et icônes SVG restent inchangés). Désactivé par défaut."
PLG_SYSTEM_MERTOOLS_DARK_CUSTOM_NOTE="Palette personnalisée — la valeur sombre de chaque variable de couleur Gridbox. Laissez un champ vide pour utiliser la valeur par défaut affichée."
PLG_SYSTEM_MERTOOLS_DARK_C_BG="Arrière-plan"
PLG_SYSTEM_MERTOOLS_DARK_C_SURFACE="Arrière-plan secondaire (cartes, sections alternées)"
PLG_SYSTEM_MERTOOLS_DARK_C_BGDARK="Arrière-plan le plus sombre (sections déjà sombres)"
PLG_SYSTEM_MERTOOLS_DARK_C_TITLE="Titres"
PLG_SYSTEM_MERTOOLS_DARK_C_TEXT="Texte courant"
PLG_SYSTEM_MERTOOLS_DARK_C_MUTED="Texte atténué"
PLG_SYSTEM_MERTOOLS_DARK_C_MUTED_DESC="Une couleur, p. ex. un blanc translucide comme rgba(232,236,243,.45)."
PLG_SYSTEM_MERTOOLS_DARK_C_BORDER="Bordures"
PLG_SYSTEM_MERTOOLS_DARK_C_HOVER="Arrière-plan au survol"
PLG_SYSTEM_MERTOOLS_DARK_C_SHADOW="Ombre"
PLG_SYSTEM_MERTOOLS_DARK_C_SHADOW_DESC="Une couleur, p. ex. rgba(0,0,0,.5)."
PLG_SYSTEM_MERTOOLS_DARK_TO_DARK="Passer en mode sombre"

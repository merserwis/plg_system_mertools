PLG_SYSTEM_MERTOOLS_XML_DESCRIPTION="MerTools for Gridbox (Beta) — Korrekturen und Optimierungen für Balbooa Gridbox, die mit den eigenen Einstellungen von Gridbox nicht möglich sind (z. B. Adressen mit doppelten Schrägstrichen für die SEO auf eine saubere Adresse umleiten). Die Kerndateien von Gridbox werden nie verändert."

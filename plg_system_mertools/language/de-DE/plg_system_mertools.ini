PLG_SYSTEM_MERTOOLS_DARK_PALETTE_DESC="Das Aussehen des dunklen Designs. Alle sind sanft (kein reines Schwarz); wählen Sie die passende für die Website oder „Eigene“, um jede Farbe selbst festzulegen."

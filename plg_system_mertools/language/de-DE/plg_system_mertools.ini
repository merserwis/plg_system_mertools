PLG_SYSTEM_MERTOOLS_FIELDSET_DARK="Dunkelmodus"
PLG_SYSTEM_MERTOOLS_DARK_NOTE="Ein elegantes dunkles Design für die ganze Website, aufgebaut aus den eigenen Farbvariablen von Gridbox — sanfte dunkle Grau- und Blautöne, nie ein hartes reines Schwarz, daher angenehm für die Augen. Eine Umschalttaste wird in den Kopfbereich gesetzt; die Wahl des Besuchers wird gespeichert, und <em>Automatisch</em> folgt seiner Systemeinstellung. Die Kerndateien von Gridbox werden nicht verändert."
PLG_SYSTEM_MERTOOLS_DARK_ENABLED_LABEL="Dunkelmodus"
PLG_SYSTEM_MERTOOLS_DARK_ENABLED_DESC="Dem Frontend der Website ein dunkles Design und eine Umschalttaste im Kopfbereich hinzufügen."

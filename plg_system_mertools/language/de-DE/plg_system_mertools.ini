; MerTools for Gridbox — plugin settings (de-DE)

PLG_SYSTEM_MERTOOLS_XML_DESCRIPTION="MerTools for Gridbox (Beta) — eine Sammlung von Korrekturen und Optimierungen für Balbooa Gridbox, die mit den eigenen Einstellungen von Gridbox nicht möglich sind; jede ist ein Werkzeug, das Sie ein- oder ausschalten können. Die Kerndateien von Gridbox werden nie verändert, daher lassen sich Gridbox-Updates problemlos installieren."

PLG_SYSTEM_MERTOOLS_INTRO_LABEL="MerTools for Gridbox (Beta)"
PLG_SYSTEM_MERTOOLS_INTRO_DESC="Korrekturen und Optimierungen für Balbooa Gridbox, die sich in den eigenen Einstellungen von Gridbox nicht vornehmen lassen. Jeder Reiter unten ist ein Werkzeug, das ein- oder ausgeschaltet werden kann. Die Kerndateien von Gridbox werden nie verändert. <strong>Dies ist eine Beta-Version:</strong> Testen Sie jedes Werkzeug auf Ihrer Website, bevor Sie sich darauf verlassen, und melden Sie Probleme auf GitHub."

PLG_SYSTEM_MERTOOLS_FIELDSET_URL="Kanonische URL"
PLG_SYSTEM_MERTOOLS_URL_NOTE="Gridbox liefert eine Seite unter beliebig vielen Schrägstrichen in der Adresse aus — <code>/oferta</code>, <code>//oferta</code> und <code>//////oferta</code> öffnen alle dieselbe Seite mit Status 200. Suchmaschinen sehen dann mehrere Adressen für eine Seite (doppelte Inhalte). Dieses Werkzeug leitet jede solche Adresse auf die eine saubere Adresse um."

PLG_SYSTEM_MERTOOLS_URL_COLLAPSE_LABEL="Doppelte Schrägstriche zusammenfassen"
PLG_SYSTEM_MERTOOLS_URL_COLLAPSE_DESC="Jede Adresse, deren Pfad mehrere Schrägstriche hintereinander enthält, auf die Adresse mit einfachen Schrägstrichen umleiten (z. B. <code>//////oferta/mierniki</code> &rarr; <code>/oferta/mierniki</code>). Nur der Pfad wird geändert; die Abfrage nach dem <code>?</code> bleibt unverändert, und die Adresse bleibt immer auf dieser Website."

PLG_SYSTEM_MERTOOLS_URL_CODE_LABEL="Art der Umleitung"
PLG_SYSTEM_MERTOOLS_URL_CODE_DESC="301 (dauerhaft) teilt Suchmaschinen mit, dass die saubere Adresse die richtige ist, und überträgt das Ranking darauf — empfohlen. 302 (vorübergehend) überträgt das Ranking nicht; verwenden Sie es nur zum Testen."
PLG_SYSTEM_MERTOOLS_URL_CODE_301="301 — dauerhaft (empfohlen)"
PLG_SYSTEM_MERTOOLS_URL_CODE_302="302 — vorübergehend"

PLG_SYSTEM_MERTOOLS_URL_CF_NOTE="<strong>Die Seite öffnet sich weiterhin mit doppelten Schrägstrichen und wird nicht umgeleitet?</strong> Dann steht Ihre Website hinter Cloudflare (oder einem anderen CDN/Proxy), das die Adresse bereinigt, <em>bevor</em> sie den Server erreicht &mdash; es fasst die zusätzlichen Schrägstriche stillschweigend selbst zusammen, sodass dieses Plugin sie nie sieht und nicht umleiten kann. Die Umleitung muss dann bei Cloudflare eingerichtet werden, der einzigen Stelle, die die ursprüngliche Adresse noch kennt. <details><summary><strong>Einrichtung in Cloudflare &mdash; Schritt für Schritt</strong></summary><ol><li>Melden Sie sich bei <code>dash.cloudflare.com</code> an und wählen Sie die Domain.</li><li>Öffnen Sie <strong>Rules &rarr; Redirect Rules</strong> und klicken Sie auf <strong>Create rule</strong>.</li><li>Name der Regel: z. B. <em>Doppelte Schrägstriche zusammenfassen</em>.</li><li>Wechseln Sie unter <strong>When incoming requests match</strong> zu <strong>Edit expression</strong> und fügen Sie ein:<br><code>(raw.http.request.uri ne http.request.uri and (http.request.method eq &quot;GET&quot; or http.request.method eq &quot;HEAD&quot;))</code></li><li>Setzen Sie unter <strong>Then</strong> <strong>Type = Dynamic</strong> und die <strong>URL expression</strong>:<br><code>concat(&quot;https://&quot;, http.host, http.request.uri)</code></li><li>Statuscode <strong>301</strong>; <strong>Preserve query string = off</strong>.</li><li>Klicken Sie auf <strong>Deploy</strong>.</li><li>Wenn weiterhin nicht umgeleitet wird, öffnen Sie <strong>Rules &rarr; Settings &rarr; URL Normalization</strong> und aktivieren Sie <em>Normalize incoming URLs</em>.</li></ol>Testen Sie, indem Sie <code>https://your-site/////oferta</code> öffnen &mdash; es sollte eine 301 auf die Adresse mit einfachen Schrägstrichen zurückgeben. Ein kostenpflichtiger Tarif ist nicht nötig: Die Regel verwendet keine regulären Ausdrücke. Lassen Sie das Werkzeug dieses Plugins ebenfalls eingeschaltet &mdash; es behandelt weiterhin jede Anfrage, die den Server direkt erreicht.</details>"


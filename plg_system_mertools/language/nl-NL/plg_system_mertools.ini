PLG_SYSTEM_MERTOOLS_FIELDSET_DARK="Donkere modus"
PLG_SYSTEM_MERTOOLS_DARK_NOTE="Een elegant donker thema voor de hele website, opgebouwd uit de eigen kleurvariabelen van Gridbox — zachte donkere grijs- en blauwtinten, nooit hard puur zwart, dus prettig voor de ogen. In de header komt een schakelknop; de keuze van de bezoeker wordt onthouden, en <em>Automatisch</em> volgt de instelling van zijn systeem. De kernbestanden van Gridbox worden niet gewijzigd."
PLG_SYSTEM_MERTOOLS_DARK_ENABLED_LABEL="Donkere modus"
PLG_SYSTEM_MERTOOLS_DARK_ENABLED_DESC="Een donker thema en een schakelknop in de header toevoegen aan de voorkant van de website."
PLG_SYSTEM_MERTOOLS_DARK_PALETTE_LABEL="Palet"
PLG_SYSTEM_MERTOOLS_DARK_PALETTE_DESC="Het uiterlijk van het donkere thema. Alle zijn zacht (geen puur zwart); kies het palet dat bij de website past, of Eigen om elke kleur zelf in te stellen."
PLG_SYSTEM_MERTOOLS_DARK_PAL_SLATE="Leisteen — elegant blauwgrijs (aanbevolen)"
PLG_SYSTEM_MERTOOLS_DARK_PAL_CHARCOAL="Antraciet — neutraal grijs"
PLG_SYSTEM_MERTOOLS_DARK_PAL_MIDNIGHT="Middernacht — diepblauw"
PLG_SYSTEM_MERTOOLS_DARK_PAL_WARM="Warm — zacht bruin, rustig voor de ogen"
PLG_SYSTEM_MERTOOLS_DARK_PAL_DIM="Gedempt — laag contrast, het zachtst"
PLG_SYSTEM_MERTOOLS_DARK_PAL_CUSTOM="Eigen — stel de kleuren hieronder in"
PLG_SYSTEM_MERTOOLS_DARK_DEFAULT_LABEL="Standaard voor nieuwe bezoekers"
PLG_SYSTEM_MERTOOLS_DARK_DEFAULT_DESC="Wat een bezoeker ziet die nog niet heeft gekozen. Automatisch volgt zijn besturingssysteem (licht of donker). Een onthouden keuze gaat altijd voor."
PLG_SYSTEM_MERTOOLS_DARK_DEFAULT_AUTO="Automatisch — het systeem van de bezoeker volgen"
PLG_SYSTEM_MERTOOLS_DARK_DEFAULT_LIGHT="Licht"
PLG_SYSTEM_MERTOOLS_DARK_DEFAULT_DARK="Donker"
PLG_SYSTEM_MERTOOLS_DARK_ACCENT_SITE_LABEL="Accent zoals in Gridbox"
PLG_SYSTEM_MERTOOLS_DARK_ACCENT_SITE_DESC="De Gridbox-accentkleur van de website (de merkkleur) in de donkere modus behouden. Zet uit om voor de donkere modus een ander accent in te stellen."
PLG_SYSTEM_MERTOOLS_DARK_ACCENT_LABEL="Accent donkere modus"
PLG_SYSTEM_MERTOOLS_DARK_ACCENT_DESC="De accentkleur die in de donkere modus wordt gebruikt als het Gridbox-accent niet wordt behouden."
PLG_SYSTEM_MERTOOLS_DARK_TOGGLE_LABEL="Schakelknop in de header"
PLG_SYSTEM_MERTOOLS_DARK_TOGGLE_DESC="De schakelknop licht/donker in de header tonen. Als dit uit staat, volgt het thema nog steeds de standaard en de onthouden keuze van de bezoeker, alleen zonder knop."
PLG_SYSTEM_MERTOOLS_DARK_PLACE_LABEL="Positie van de knop"
PLG_SYSTEM_MERTOOLS_DARK_PLACE_DESC="Waar de knop in de header staat."
PLG_SYSTEM_MERTOOLS_DARK_PLACE_AUTO="Naast het menu (automatisch)"
PLG_SYSTEM_MERTOOLS_DARK_PLACE_START="Begin van de header"
PLG_SYSTEM_MERTOOLS_DARK_PLACE_END="Einde van de header"
PLG_SYSTEM_MERTOOLS_DARK_PLACE_FLOAT="Zwevende knop (altijd zichtbaar, het best voor mobiel)"
PLG_SYSTEM_MERTOOLS_DARK_SELECTOR_LABEL="Header-element (geavanceerd)"
PLG_SYSTEM_MERTOOLS_DARK_SELECTOR_DESC="CSS-selector van de header waarin de knop wordt geplaatst. Standaard <code>header.header</code> (de Gridbox-header). Verschijnt de knop niet, dan gebruikt het thema misschien een andere header; wijzig dan deze selector. Als niets overeenkomt, zweeft de knop in de onderhoek."
PLG_SYSTEM_MERTOOLS_DARK_TRANSITION_LABEL="Vloeiende overgang"
PLG_SYSTEM_MERTOOLS_DARK_TRANSITION_DESC="De kleuren laten overvloeien bij het wisselen tussen licht en donker, in plaats van ze direct te veranderen."
PLG_SYSTEM_MERTOOLS_DARK_DIMMEDIA_LABEL="Felle afbeeldingen temperen"
PLG_SYSTEM_MERTOOLS_DARK_DIMMEDIA_DESC="De helderheid van foto’s en video’s in de donkere modus iets verlagen (SVG-logo’s en -pictogrammen blijven ongewijzigd). Standaard uit."
PLG_SYSTEM_MERTOOLS_DARK_CUSTOM_NOTE="Eigen palet — de donkere waarde van elke Gridbox-kleurvariabele. Laat een veld leeg om de getoonde standaardwaarde te gebruiken."

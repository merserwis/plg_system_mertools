; MerTools for Gridbox — plugin settings (nl-NL)

PLG_SYSTEM_MERTOOLS_XML_DESCRIPTION="MerTools for Gridbox (Beta) — een verzameling correcties en optimalisaties voor Balbooa Gridbox die de eigen instellingen van Gridbox niet kunnen; elk ervan is een hulpmiddel dat u aan of uit kunt zetten. De kernbestanden van Gridbox worden nooit gewijzigd, zodat Gridbox-updates zonder problemen installeren."

PLG_SYSTEM_MERTOOLS_INTRO_LABEL="MerTools for Gridbox (Beta)"
PLG_SYSTEM_MERTOOLS_INTRO_DESC="Correcties en optimalisaties voor Balbooa Gridbox die niet via de eigen instellingen van Gridbox kunnen. Elk tabblad hieronder is één hulpmiddel dat aan of uit kan worden gezet. De kernbestanden van Gridbox worden nooit gewijzigd. <strong>Dit is een bètaversie:</strong> test elk hulpmiddel op uw website voordat u erop vertrouwt, en meld problemen op GitHub."

PLG_SYSTEM_MERTOOLS_FIELDSET_URL="Canonieke URL"
PLG_SYSTEM_MERTOOLS_URL_NOTE="Gridbox toont een pagina bij elk aantal schuine strepen in het adres — <code>/oferta</code>, <code>//oferta</code> en <code>//////oferta</code> openen allemaal dezelfde pagina met status 200. Zoekmachines zien dan meerdere adressen voor één pagina (dubbele inhoud). Dit hulpmiddel leidt elk zulk adres om naar het ene schone adres."

PLG_SYSTEM_MERTOOLS_URL_COLLAPSE_LABEL="Dubbele schuine strepen samenvoegen"
PLG_SYSTEM_MERTOOLS_URL_COLLAPSE_DESC="Elk adres waarvan het pad meerdere schuine strepen achter elkaar bevat, omleiden naar het adres met enkele schuine strepen (bijv. <code>//////oferta/mierniki</code> &rarr; <code>/oferta/mierniki</code>). Alleen het pad wordt gewijzigd; de querystring na het <code>?</code> blijft zoals hij is, en het adres blijft altijd op deze website."

PLG_SYSTEM_MERTOOLS_URL_CODE_LABEL="Soort omleiding"
PLG_SYSTEM_MERTOOLS_URL_CODE_DESC="301 (permanent) vertelt zoekmachines dat het schone adres het juiste is en draagt de ranking eraan over — aanbevolen. 302 (tijdelijk) draagt de ranking niet over; gebruik dit alleen tijdens het testen."
PLG_SYSTEM_MERTOOLS_URL_CODE_301="301 — permanent (aanbevolen)"
PLG_SYSTEM_MERTOOLS_URL_CODE_302="302 — tijdelijk"

PLG_SYSTEM_MERTOOLS_URL_CF_NOTE="<strong>Opent de pagina nog steeds met dubbele schuine strepen en wordt er niet omgeleid?</strong> Dan staat uw website achter Cloudflare (of een ander CDN/proxy) dat het adres opschoont <em>voordat</em> het de server bereikt &mdash; het voegt de extra schuine strepen ongemerkt zelf samen, zodat deze plugin ze nooit ziet en niet kan omleiden. De omleiding moet dan in Cloudflare worden ingesteld, de enige plek die het oorspronkelijke adres nog kent. <details><summary><strong>Instellen in Cloudflare &mdash; stap voor stap</strong></summary><ol><li>Meld u aan op <code>dash.cloudflare.com</code> en kies het domein.</li><li>Open <strong>Rules &rarr; Redirect Rules</strong> en klik op <strong>Create rule</strong>.</li><li>Naam van de regel: bijv. <em>Dubbele schuine strepen samenvoegen</em>.</li><li>Schakel onder <strong>When incoming requests match</strong> over naar <strong>Edit expression</strong> en plak:<br><code>(raw.http.request.uri ne http.request.uri and (http.request.method eq &quot;GET&quot; or http.request.method eq &quot;HEAD&quot;))</code></li><li>Stel onder <strong>Then</strong> <strong>Type = Dynamic</strong> en de <strong>URL expression</strong> in:<br><code>concat(&quot;https://&quot;, http.host, http.request.uri)</code></li><li>Statuscode <strong>301</strong>; <strong>Preserve query string = off</strong>.</li><li>Klik op <strong>Deploy</strong>.</li><li>Wordt er nog steeds niet omgeleid, open dan <strong>Rules &rarr; Settings &rarr; URL Normalization</strong> en zet <em>Normalize incoming URLs</em> aan.</li></ol>Test door <code>https://your-site/////oferta</code> te openen &mdash; dit moet een 301 naar het adres met een enkele schuine streep geven. Een betaald abonnement is niet nodig: de regel gebruikt geen reguliere expressies. Laat het hulpmiddel van deze plugin ook aan staan &mdash; het behandelt nog steeds elk verzoek dat de server rechtstreeks bereikt.</details>"


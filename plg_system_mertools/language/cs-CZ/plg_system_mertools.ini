; MerTools for Gridbox — plugin settings (cs-CZ)

PLG_SYSTEM_MERTOOLS_XML_DESCRIPTION="MerTools for Gridbox (Beta) — sada oprav a optimalizací pro Balbooa Gridbox, které jeho vlastní nastavení neumí; každá je nástroj, který můžete zapnout nebo vypnout. Soubory jádra Gridboxu se nikdy nemění, takže se aktualizace Gridboxu nainstalují bez problémů."

PLG_SYSTEM_MERTOOLS_INTRO_LABEL="MerTools for Gridbox (Beta)"
PLG_SYSTEM_MERTOOLS_INTRO_DESC="Opravy a optimalizace pro Balbooa Gridbox, které nelze provést ve vlastním nastavení Gridboxu. Každá karta níže je jeden nástroj, který lze zapnout nebo vypnout. Soubory jádra Gridboxu se nikdy nemění. <strong>Toto je beta verze:</strong> než se na některý nástroj spolehnete, vyzkoušejte jej na svém webu a problémy hlaste na GitHubu."

PLG_SYSTEM_MERTOOLS_FIELDSET_URL="Kanonická URL"
PLG_SYSTEM_MERTOOLS_URL_NOTE="Gridbox zobrazí stránku při libovolném počtu lomítek v adrese — <code>/oferta</code>, <code>//oferta</code> i <code>//////oferta</code> otevřou stejnou stránku se stavem 200. Vyhledávače pak vidí pro jednu stránku několik adres (duplicitní obsah). Tento nástroj přesměruje každou takovou adresu na jedinou čistou adresu."

PLG_SYSTEM_MERTOOLS_URL_COLLAPSE_LABEL="Sloučit zdvojená lomítka"
PLG_SYSTEM_MERTOOLS_URL_COLLAPSE_DESC="Přesměrovat každou adresu, jejíž cesta obsahuje více lomítek za sebou, na adresu s jednoduchými lomítky (např. <code>//////oferta/mierniki</code> &rarr; <code>/oferta/mierniki</code>). Mění se pouze cesta; řetězec dotazu za <code>?</code> zůstává beze změny a adresa vždy zůstává na tomto webu."

PLG_SYSTEM_MERTOOLS_URL_CODE_LABEL="Typ přesměrování"
PLG_SYSTEM_MERTOOLS_URL_CODE_DESC="301 (trvalé) sdělí vyhledávačům, že správná je čistá adresa, a přenese na ni hodnocení — doporučeno. 302 (dočasné) hodnocení nepřenáší; používejte jej jen při testování."
PLG_SYSTEM_MERTOOLS_URL_CODE_301="301 — trvalé (doporučeno)"
PLG_SYSTEM_MERTOOLS_URL_CODE_302="302 — dočasné"

PLG_SYSTEM_MERTOOLS_URL_CF_NOTE="<strong>Stránka se stále otevírá se zdvojenými lomítky a nepřesměruje se?</strong> Pak je váš web za Cloudflare (nebo jiným CDN/proxy), který adresu vyčistí <em>dříve</em>, než dorazí na server &mdash; nadbytečná lomítka potichu sloučí sám, takže je tento plugin nikdy neuvidí a nemůže přesměrovat. Přesměrování je pak nutné nastavit v Cloudflare, jediném místě, které původní adresu ještě zná. <details><summary><strong>Nastavení v Cloudflare &mdash; krok za krokem</strong></summary><ol><li>Přihlaste se na <code>dash.cloudflare.com</code> a vyberte doménu.</li><li>Otevřete <strong>Rules &rarr; Redirect Rules</strong> a klikněte na <strong>Create rule</strong>.</li><li>Název pravidla: např. <em>Sloučit zdvojená lomítka</em>.</li><li>V části <strong>When incoming requests match</strong> přepněte na <strong>Edit expression</strong> a vložte:<br><code>(raw.http.request.uri ne http.request.uri and (http.request.method eq &quot;GET&quot; or http.request.method eq &quot;HEAD&quot;))</code></li><li>V části <strong>Then</strong> nastavte <strong>Type = Dynamic</strong> a <strong>URL expression</strong>:<br><code>concat(&quot;https://&quot;, http.host, http.request.uri)</code></li><li>Stavový kód <strong>301</strong>; <strong>Preserve query string = off</strong>.</li><li>Klikněte na <strong>Deploy</strong>.</li><li>Pokud přesměrování stále nefunguje, otevřete <strong>Rules &rarr; Settings &rarr; URL Normalization</strong> a zapněte <em>Normalize incoming URLs</em>.</li></ol>Vyzkoušejte otevřením <code>https://your-site/////oferta</code> &mdash; měla by se vrátit odpověď 301 na adresu s jednoduchým lomítkem. Placený tarif není potřeba: pravidlo nepoužívá regulární výrazy. Nástroj tohoto pluginu nechte také zapnutý &mdash; stále obslouží každý požadavek, který dorazí přímo na server.</details>"


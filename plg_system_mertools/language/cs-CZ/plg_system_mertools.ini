PLG_SYSTEM_MERTOOLS_DARK_TRANSITION_DESC="Při přepínání mezi světlým a tmavým režimem barvy plynule prolnout místo okamžité změny."
PLG_SYSTEM_MERTOOLS_DARK_DIMMEDIA_LABEL="Ztlumit jasné obrázky"
PLG_SYSTEM_MERTOOLS_DARK_DIMMEDIA_DESC="V tmavém režimu mírně snížit jas fotografií a videí (loga a ikony SVG zůstávají beze změny). Ve výchozím stavu vypnuto."

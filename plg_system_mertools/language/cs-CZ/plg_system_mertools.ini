PLG_SYSTEM_MERTOOLS_FIELDSET_DARK="Tmavý režim"
PLG_SYSTEM_MERTOOLS_DARK_NOTE="Elegantní tmavý vzhled pro celý web, sestavený z vlastních barevných proměnných Gridboxu — jemné tmavé šedé a modré odstíny, nikdy ostrá čistá černá, takže je šetrný k očím. Do záhlaví se přidá přepínací tlačítko; volba návštěvníka se zapamatuje a <em>Automaticky</em> se řídí nastavením jeho systému. Soubory jádra Gridboxu se nemění."
PLG_SYSTEM_MERTOOLS_DARK_ENABLED_LABEL="Tmavý režim"
PLG_SYSTEM_MERTOOLS_DARK_ENABLED_DESC="Přidat na veřejnou část webu tmavý vzhled a přepínací tlačítko v záhlaví."
PLG_SYSTEM_MERTOOLS_DARK_PALETTE_LABEL="Paleta"
PLG_SYSTEM_MERTOOLS_DARK_PALETTE_DESC="Vzhled tmavého režimu. Všechny jsou jemné (žádná čistá černá); vyberte tu, která se k webu hodí, nebo Vlastní a nastavte každou barvu sami."
PLG_SYSTEM_MERTOOLS_DARK_PAL_SLATE="Břidlice — elegantní modrošedá (doporučeno)"
PLG_SYSTEM_MERTOOLS_DARK_PAL_CHARCOAL="Antracit — neutrální šedá"
PLG_SYSTEM_MERTOOLS_DARK_PAL_MIDNIGHT="Půlnoc — sytá modrá"
PLG_SYSTEM_MERTOOLS_DARK_PAL_WARM="Teplá — jemná hnědá, šetrná k očím"
PLG_SYSTEM_MERTOOLS_DARK_PAL_DIM="Tlumená — nízký kontrast, nejjemnější"
PLG_SYSTEM_MERTOOLS_DARK_PAL_CUSTOM="Vlastní — barvy nastavte níže"
PLG_SYSTEM_MERTOOLS_DARK_DEFAULT_LABEL="Výchozí pro nové návštěvníky"
PLG_SYSTEM_MERTOOLS_DARK_DEFAULT_DESC="Co uvidí návštěvník, který ještě nevybral. Automaticky se řídí jeho operačním systémem (světlý nebo tmavý). Zapamatovaná volba má vždy přednost."
PLG_SYSTEM_MERTOOLS_DARK_DEFAULT_AUTO="Automaticky — podle systému návštěvníka"
PLG_SYSTEM_MERTOOLS_DARK_DEFAULT_LIGHT="Světlý"
PLG_SYSTEM_MERTOOLS_DARK_DEFAULT_DARK="Tmavý"
PLG_SYSTEM_MERTOOLS_DARK_ACCENT_SITE_LABEL="Akcent jako v Gridboxu"
PLG_SYSTEM_MERTOOLS_DARK_ACCENT_SITE_DESC="Zachovat v tmavém režimu akcentovou barvu webu z Gridboxu (barvu značky). Vypněte, chcete-li pro tmavý režim nastavit jiný akcent."
PLG_SYSTEM_MERTOOLS_DARK_ACCENT_LABEL="Akcent tmavého režimu"
PLG_SYSTEM_MERTOOLS_DARK_ACCENT_DESC="Akcentová barva v tmavém režimu, pokud se akcent z Gridboxu nezachovává."
PLG_SYSTEM_MERTOOLS_DARK_TOGGLE_LABEL="Přepínací tlačítko v záhlaví"
PLG_SYSTEM_MERTOOLS_DARK_TOGGLE_DESC="Zobrazit v záhlaví tlačítko pro přepínání světlý/tmavý. Když je vypnuto, vzhled se dál řídí výchozím nastavením a zapamatovanou volbou návštěvníka, jen bez tlačítka."
PLG_SYSTEM_MERTOOLS_DARK_PLACE_LABEL="Umístění tlačítka"
PLG_SYSTEM_MERTOOLS_DARK_PLACE_DESC="Kde v záhlaví tlačítko bude."

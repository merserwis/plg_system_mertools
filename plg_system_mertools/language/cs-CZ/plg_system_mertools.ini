PLG_SYSTEM_MERTOOLS_DARK_SELECTOR_LABEL="Prvek záhlaví (pokročilé)"
PLG_SYSTEM_MERTOOLS_DARK_SELECTOR_DESC="CSS selektor záhlaví, do kterého se tlačítko vloží. Výchozí <code>header.header</code> (záhlaví Gridboxu). Pokud se tlačítko nezobrazí, šablona možná používá jiné záhlaví; změňte tento selektor. Pokud nic neodpovídá, tlačítko plave v dolním rohu."

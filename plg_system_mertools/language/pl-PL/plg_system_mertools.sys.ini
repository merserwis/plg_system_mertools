PLG_SYSTEM_MERTOOLS="System - MerTools for Gridbox"
PLG_SYSTEM_MERTOOLS_XML_DESCRIPTION="MerTools for Gridbox — poprawki i optymalizacje dla Balbooa Gridbox, których nie da się zrobić z samych ustawień (np. przekierowanie adresów z powielonymi ukośnikami na jeden czysty adres dla SEO). Pliki rdzenia Gridbox nie są zmieniane."
PLG_SYSTEM_MERTOOLS_INSTALL_CATEGORIES_MOVED="MerTools for Gridbox 1.4.0: ustawienie Strony kategorii (opisy kategorii, wiersze elementu Kategorie Gridboksa) jest teraz w Better Categories for Gridbox. Zainstaluj lub zaktualizuj Better Categories do 1.7.0: sam włączy oba. Do tego czasu strony kategorii pokazują tekst „Category Description” w miejscu opisu."
PLG_SYSTEM_MERTOOLS_INSTALL_CHECK="MerTools for Gridbox: po instalacji, aktualizacji i po włączeniu każdej funkcji sprawdź na swojej stronie, czy działa prawidłowo: jako gość (w oknie prywatnym), na komputerze i na telefonie, na kilku rodzajach stron (strona główna, wpis, produkt, koszyk, formularz). Część narzędzi działa od razu po instalacji; które, pokazuje Panel sterowania MerTools. Każda strona Joomla + Gridbox jest zbudowana inaczej. Jeśli coś działa nie tak, wyłącz tę funkcję w MerTools."
PLG_SYSTEM_MERTOOLS_INSTALL_START="Zacznij od <a href=\"%s\">szybkiej konfiguracji MerTools</a> (Komponenty → MerTools for Gridbox)."

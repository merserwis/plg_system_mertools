; 1.6.2: withdrawn pages answer 410
PLG_SYSTEM_MERTOOLS_NOTFOUND_GONE_LABEL="Wycofane strony"
PLG_SYSTEM_MERTOOLS_NOTFOUND_GONE_DESC="Adres w Gridboksie kończy się aliasem strony. Gdy wszystko, co ma ten alias, jest nieopublikowane, w koszu, po dacie końca publikacji albo usunięte (aliasy usuniętych stron MerTools zapamiętuje od wersji 1.6.2), strona jest wycofana: <strong>410 Gone</strong> mówi wyszukiwarkom, że już nie wróci, więc usuwają ją z wyników szybciej niż po 404 (odwiedzający widzi tę samą stronę błędu). Można też przenieść odwiedzającego do kategorii, w której była strona (301), jeśli ta kategoria nadal istnieje. Działa po przekierowaniu wpisanym w dzienniku i po przeniesionej stronie. Strona wyłączona z publikacji tylko na chwilę też dostanie 410, więc opublikuj ją szybko z powrotem albo wyłącz tę opcję."
PLG_SYSTEM_MERTOOLS_NOTFOUND_GONE_410="410 Gone"
PLG_SYSTEM_MERTOOLS_NOTFOUND_GONE_CATEGORY="Jej kategoria (301), inaczej 410"
PLG_SYSTEM_MERTOOLS_NOTFOUND_GONE_OFF="Jak każda brakująca strona"
PLG_SYSTEM_MERTOOLS_NOTFOUND_GONE_MESSAGE="Ta strona została usunięta"
PLG_SYSTEM_MERTOOLS_NF_UI_R_GONE="Wycofana strona (410)"
PLG_SYSTEM_MERTOOLS_NF_UI_R_CATEGORY="Kategoria wycofanej strony (301)"

; 1.6.3: product data (JSON-LD)
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_LABEL="Dane produktu dla wyszukiwarek (JSON-LD)"
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_DESC="Gridbox wypełnia dane produktu, które czyta Google (schema.org Product), według szablonu. Produkt bez ceny dostaje <code>\"price\": \"0\"</code> i „dostępny”, domyślny szablon podaje produkt jako <em>używany</em> i z pustym opisem, marka z pola typu link staje się adresem <code>index.php?option=com_gridbox…</code>, a znak nowej linii albo cudzysłów we wstępie psuje cały blok, więc Google go pomija. Po włączeniu MerTools buduje ten blok na stronie produktu z danych samego produktu, poprawnie zakodowany: bez oferty, gdy produkt nie ma ceny (cena na zapytanie; zakres cen, gdy ceny mają tylko wersje), jako produkt nowy, ze wstępem (albo meta opisem) jako opisem, marką z pola <em>Producent</em>, wszystkimi zdjęciami z galerii, informacją o VAT według ustawień sklepu (Gridbox → Sklep → Podatek) i numerem producenta (niżej). Pozostałe klucze bloku Gridboksa (np. gtin) zostają, innych bloków (FAQ) MerTools nie rusza."
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_MPN_LABEL="Numer katalogowy producenta (mpn)"
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_MPN_DESC="Numer producenta pomaga Google rozpoznać ten sam produkt w innych sklepach. Brany z SKU: całe SKU albo jego część po ostatnim ukośniku, gdy SKU zaczyna się od kodu sklepu (<code>SONE/WAPRZPN30</code> → <code>WAPRZPN30</code>)."
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_MPN_NONE="Bez numeru"
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_MPN_SKU="SKU"
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_MPN_AFTER_SLASH="SKU po ostatnim /"

; 1.6.4: availability of the product data
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_AVAIL_FIELD_LABEL="Dostępność z pola"
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_AVAIL_FIELD_DESC="Gridbox podaje każdy produkt z pustym stanem jako „dostępny”. Jeśli pole produktu mówi, kiedy można go wysłać (np. <em>Termin dostawy</em> wypełniany przez import), wybierz je tutaj: jego tekst ustala dostępność według reguł poniżej. Nie wybieraj pola z takim samym tekstem w każdym produkcie (np. legendy kolorów), bo wszystkie produkty dostałyby tę samą wartość."
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_AVAIL_FIELD_NONE="Brak"
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_AVAIL_RULES_LABEL="Reguły dostępności"
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_AVAIL_RULES_DESC="Jedna w wierszu: <code>tekst = Wartość</code>. Gdy pole zawiera ten tekst (wielkość liter nie ma znaczenia), produkt dostaje tę wartość. Wygrywa pierwszy pasujący wiersz, więc dłuższe teksty wpisuj wyżej. Wartości: <code>InStock</code> (wysyłka od ręki), <code>BackOrder</code> (brak na stanie, można zamówić, wysyłka później), <code>OutOfStock</code> (nie da się kupić), <code>PreOrder</code> (przed premierą), <code>MadeToOrder</code> (na zamówienie), <code>LimitedAvailability</code> (ograniczona). Np.:<br><code>Brak na magazynie = BackOrder</code><br><code>tygodni = BackOrder</code><br><code>W magazynie = InStock</code>"
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_AVAIL_RULES_HINT="Brak na magazynie = BackOrder"
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_AVAIL_DEFAULT_LABEL="Dostępność bez reguły"
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_AVAIL_DEFAULT_DESC="Dostępność produktu z ceną, którego pole jest puste albo nie pasuje do żadnej reguły. Wartość z Gridboksa („dostępny” przy pustym stanie) pasuje, gdy towar zwykle jest na stanie. Gdy zwykle zamawiacie go u producenta dopiero po sprzedaży, <em>Na zamówienie</em> zgadza się z tym, co słyszy klient. Google może uznać dane niezgodne ze stroną za błąd."
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_AVAIL_KEEP="Jak w Gridboksie"
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_AVAIL_INSTOCK="Dostępny (InStock)"
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_AVAIL_BACKORDER="Na zamówienie (BackOrder)"
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_AVAIL_OUTOFSTOCK="Niedostępny (OutOfStock)"
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_AVAIL_PREORDER="Przedsprzedaż (PreOrder)"
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_AVAIL_MADETOORDER="Wykonywany na zamówienie (MadeToOrder)"
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_AVAIL_LIMITED="Ograniczona (LimitedAvailability)"

; 1.6.5: article data (JSON-LD)
PLG_SYSTEM_MERTOOLS_BLOG_JSONLD_LABEL="Dane artykułu dla wyszukiwarek (JSON-LD)"
PLG_SYSTEM_MERTOOLS_BLOG_JSONLD_DESC="Gridbox wpisuje datę publikacji do schematu wpisu słownie (<code>12 czerwiec 2020</code>), więc wyszukiwarki nie odczytują jej jako daty. Wartości wstawia bez escapowania, a schemat skopiowany ręcznie do wpisu bywa zepsuty. Po włączeniu MerTools buduje blok BlogPosting każdego wpisu aplikacji typu blog z danych samego wpisu, poprawnie zakodowany: daty w ISO 8601 ze strefą czasową (<code>2020-06-12T09:30:00+02:00</code>), data ostatniej zmiany treści (z dat mapy witryny albo historii zmian), autorzy z Gridboksa albo, gdy ich brak, organizacja, wydawca z <code>@id</code> organizacji ze strony głównej (<code>/#organization</code>), język i wstęp jako opis. Pozostałe klucze bloku wpisu zostają, innych bloków (FAQ) MerTools nie rusza. Działa niezależnie od kanałów powyżej."
PLG_SYSTEM_MERTOOLS_BLOG_JSONLD_ORG_LABEL="Nazwa organizacji"
PLG_SYSTEM_MERTOOLS_BLOG_JSONLD_ORG_DESC="Autor (gdy wpis nie ma autora w Gridboksie) i wydawca. Puste: nazwa witryny z Konfiguracji globalnej. Najlepiej ta sama nazwa co w bloku organizacji na stronie głównej."
PLG_SYSTEM_MERTOOLS_BLOG_JSONLD_ORG_HINT="Nazwa witryny"
PLG_SYSTEM_MERTOOLS_BLOG_JSONLD_LOGO_LABEL="Logo wydawcy"
PLG_SYSTEM_MERTOOLS_BLOG_JSONLD_LOGO_DESC="Puste: logo podane w bloku samego wpisu, jeśli jest."

; 1.6.6: pages of the lists
PLG_SYSTEM_MERTOOLS_URL_PAGINATION_LABEL="Strony list (?page=N)"
PLG_SYSTEM_MERTOOLS_URL_PAGINATION_DESC="Gridbox daje każdej stronie listy produktów albo wpisów (kategorii, bloga, tagu: <code>?page=2</code>, <code>?page=3</code>…) adres kanoniczny pierwszej strony oraz ten sam tytuł i opis. Wyszukiwarki uznają więc te strony za kopie strony 1, a produkty z dalszych stron znajdują tylko przez mapę witryny. Strona za ostatnią (<code>?page=999</code>) odpowiada pustą listą z linkami aż do strony 1000, a <code>?page=0</code> albo <code>?page=abc</code> powtarzają stronę 1. Po włączeniu: strony 2 i dalsze dostają własny adres kanoniczny (<code>…?page=2</code>) i dopisek „– strona 2” w tytule i opisie, strona z pustą listą odpowiada błędem 404 (noindex), a numer strony, który nie jest numerem (0, 1, 01, abc), przekierowuje (301) na listę bez niego."
PLG_SYSTEM_MERTOOLS_PAGINATION_TITLE="%1$s – strona %2$d"
PLG_SYSTEM_MERTOOLS_URL_SORT_GUARD_LABEL="Chroń sortowanie list (bezpieczeństwo)"
PLG_SYSTEM_MERTOOLS_URL_SORT_GUARD_DESC="Gridbox do wersji 2.20.4.1 wstawia sortowanie listy z adresu (<code>?sort-by=…</code>) do zapytania do bazy danych bez sprawdzenia, więc adres z inną wartością daje stronę błędu i może sięgnąć do bazy. Zadanie edytora, które wyświetla listę wpisów (<code>editor.getBlogPosts</code>, też z sortowaniem), nie sprawdza uprawnień. Po włączeniu (domyślnie) sortowanie inne niż oferowane przez Gridbox (domyślne, cena rosnąco/malejąco, najnowsze, najwyżej oceniane, najczęściej oceniane, najpopularniejsze) jest usuwane z adresu przekierowaniem 301 (inne żądania: 400), a to zadanie wymaga prawa edycji w Gridboksie (403). Komentarze i opinie sortują według własnej, stałej listy i nie są ruszane. Dla odwiedzających nic się nie zmienia. Gridbox 2.20.4.2 naprawia to sam (zaktualizuj go); strażnik chroni strony ze starszym Gridboxem i nadal usuwa z adresu sortowanie, którego nie ma, więc lista ma jeden adres."

; Site hygiene
PLG_SYSTEM_MERTOOLS_FIELDSET_HYGIENE="Higiena strony"
PLG_SYSTEM_MERTOOLS_HYGIENE_NOTE="Drobiazgi, które wytykają audyty strony: znacznik kampanii w adresie podglądu strony, podwójny kod języka, ciasteczka bez Secure i SameSite, brak prawdziwej polityki Content-Security-Policy. Każdy to osobny przełącznik; działają także na stronach z pamięci podręcznej."
PLG_SYSTEM_MERTOOLS_HYGIENE_OG_URL_LABEL="Bez znaczników kampanii w og:url"
PLG_SYSTEM_MERTOOLS_HYGIENE_OG_URL_DESC="Usuwa <code>?srsltid=</code>, <code>?utm_*</code>, <code>?gclid=</code>, <code>?fbclid=</code> i podobne z <code>og:url</code> i <code>twitter:url</code>. Pamięć stron podaje jedną stronę wszystkim, więc strona zapisana dla osoby z Google Shopping pokazywałaby ten znacznik w adresie wszystkim pozostałym (adres kanoniczny był przez cały czas czysty)."
PLG_SYSTEM_MERTOOLS_HYGIENE_LANG_LABEL="Krótki kod języka strony"
PLG_SYSTEM_MERTOOLS_HYGIENE_LANG_DESC="<code>lang=&quot;pl-pl&quot;</code> znacznika <code>&lt;html&gt;</code> zmienia się w <code>lang=&quot;pl&quot;</code> (tak samo <code>de-de</code>, <code>cs-cz</code> i podobne: region, który powtarza język). <code>en-gb</code> i <code>pt-br</code> zostają. Wyszukiwarki czytają oba zapisy; to tylko zwykły kod języka."
PLG_SYSTEM_MERTOOLS_HYGIENE_COOKIES_LABEL="Secure i SameSite w ciasteczkach"
PLG_SYSTEM_MERTOOLS_HYGIENE_COOKIES_DESC="Dodaje <code>Secure</code> (przy HTTPS) i <code>SameSite=Lax</code> do każdego ciasteczka, które strona ustawia bez nich, także do ciasteczka sesji. Lax to i tak domyślne zachowanie dzisiejszych przeglądarek: ciasteczko nie jedzie z formularzem wysłanym z innej strony. Wyłącz, jeśli bramka płatności lub logowania odsyła osobę metodą POST i sesja się gubi."
PLG_SYSTEM_MERTOOLS_HYGIENE_XSS_LABEL="Bez nagłówka X-XSS-Protection"
PLG_SYSTEM_MERTOOLS_HYGIENE_XSS_DESC="Nagłówek jest przestarzały (przeglądarki nie mają już filtra, który włączał), a w starych sam bywał luką. Usuwany, gdy wysyła go Joomla lub PHP (wtyczka Nagłówki HTTP). Gdy wysyła go serwer WWW albo CDN, usuń go tam."
PLG_SYSTEM_MERTOOLS_HYGIENE_CSP_MODE_LABEL="Content-Security-Policy"
PLG_SYSTEM_MERTOOLS_HYGIENE_CSP_MODE_DESC="Wysyła poniższą politykę z każdą stroną. <strong>Tylko raport</strong> niczego nie blokuje: przeglądarka wypisuje w konsoli, co polityka by zablokowała (zacznij od tego). <strong>Wymuszaj</strong> blokuje. Polityka z wtyczki Nagłówki HTTP Joomli zostaje i działa razem z tą."
PLG_SYSTEM_MERTOOLS_HYGIENE_CSP_OFF="Wyłączona"
PLG_SYSTEM_MERTOOLS_HYGIENE_CSP_REPORT="Tylko raport"
PLG_SYSTEM_MERTOOLS_HYGIENE_CSP_ENFORCE="Wymuszaj"
PLG_SYSTEM_MERTOOLS_HYGIENE_CSP_LABEL="Polityka"
PLG_SYSTEM_MERTOOLS_HYGIENE_CSP_DESC="Dyrektywy rozdzielone średnikami. Domyślna nie zepsuje strony: bez wtyczek przeglądarki (<code>object-src</code>), bez obcego <code>&lt;base&gt;</code>, obrazy i skrypty z <code>http://</code> ładowane przez HTTPS. Ostrzejsza polityka (<code>script-src</code>) musi wymienić każde źródło skryptów strony (Google Tag Manager, Meta Pixel, Elfsight…): najpierw wypróbuj ją w trybie <em>Tylko raport</em>."

; Finished items out of lists
PLG_SYSTEM_MERTOOLS_LIST_HIDE_WORDS_LABEL="Zakończone pozycje poza listami"
PLG_SYSTEM_MERTOOLS_LIST_HIDE_WORDS_DESC="Słowa oznaczające zakończoną pozycję, jedno w wierszu, bez względu na wielkość liter (np. <code>[ZAKOŃCZONE]</code> w tytule skończonej promocji). Karta z listy Gridboxa (najnowsze wpisy, blog, kategoria, produkty) z takim słowem w tytule znika z listy. <strong>Sama strona zostaje</strong>: otwiera się, jest w sitemapie i w wyszukiwarce, więc osoba, która trafi na nią z Google lub ze starego maila, nadal zobaczy warunki. Puste = nic nie jest ukrywane."
PLG_SYSTEM_MERTOOLS_LIST_HIDE_WHERE_LABEL="Gdzie ukrywać zakończone pozycje"
PLG_SYSTEM_MERTOOLS_LIST_HIDE_WHERE_DESC="Tylko na stronie głównej: archiwum (strona promocji, blog) dalej je wypisuje. We wszystkich listach: nie ma ich nigdzie na listach, a znaleźć je można tylko po adresie lub w wyszukiwarce."
PLG_SYSTEM_MERTOOLS_LIST_HIDE_WHERE_HOME="Tylko na stronie głównej"
PLG_SYSTEM_MERTOOLS_LIST_HIDE_WHERE_ALL="We wszystkich listach"

PLG_SYSTEM_MERTOOLS_FIELDSET_SCHEMA="Dane strukturalne"
PLG_SYSTEM_MERTOOLS_SCHEMA_NOTE="Dane o firmie, które czytają wyszukiwarki i asystenci AI: <b>organizacja</b> (adres, godziny, numery, akredytacja) i <b>WebSite</b> z wyszukiwarką na stronie głównej, <b>BreadcrumbList</b> pozostałych stron, <b>Service</b> stron usług. <b>Nic nie jest za Ciebie wypełnione</b>: każde pole jest puste, puste pole jest pomijane (zostaje to, co strona już ma), więc wpisz tylko to, co prawdziwe i zgodne ze stroną (stopka, kontakt). Wynik sprawdzisz w teście wyników rozszerzonych Google lub na validator.schema.org."
PLG_SYSTEM_MERTOOLS_SCHEMA_ON_LABEL="Dane strukturalne strony"
PLG_SYSTEM_MERTOOLS_SCHEMA_ON_DESC="Włącza całą zakładkę. Wyłączone: nic na stronach się nie zmienia. Pamięć stron jest czyszczona po zapisaniu ustawień."
PLG_SYSTEM_MERTOOLS_SCHEMA_SP_BC="Okruszki"
PLG_SYSTEM_MERTOOLS_SCHEMA_BC_LABEL="BreadcrumbList na każdej stronie oprócz głównej"
PLG_SYSTEM_MERTOOLS_SCHEMA_BC_DESC="Lista strony w JSON-LD: najpierw strona główna, adresy bezwzględne, <b>na końcu sama strona</b> (okruszki Gridboxa ją pomijają). Bierze się z okruszków, które Gridbox pisze na stronie, a w razie braku z BreadcrumbList, który strona już ma, albo ze ścieżki Joomli; własna lista strony jest podmieniana. Widoczne okruszki zostają bez zmian."
PLG_SYSTEM_MERTOOLS_SCHEMA_HOME_LABEL="Nazwa strony głównej na liście"
PLG_SYSTEM_MERTOOLS_SCHEMA_HOME_DESC="Puste: tytuł pozycji menu strony głównej."
PLG_SYSTEM_MERTOOLS_SCHEMA_SP_WEB="WebSite (strona główna)"
PLG_SYSTEM_MERTOOLS_SCHEMA_WEB_LABEL="WebSite na stronie głównej"
PLG_SYSTEM_MERTOOLS_SCHEMA_WEB_DESC="Blok WebSite (nazwa, język, organizacja jako wydawca) z wyszukiwarką. Trafia do tego samego bloku co organizacja, gdy ta jest włączona."
PLG_SYSTEM_MERTOOLS_SCHEMA_SITE_NAME_LABEL="Nazwa serwisu"
PLG_SYSTEM_MERTOOLS_SCHEMA_SITE_NAME_DESC="Puste: nazwa organizacji, a w razie braku nazwa witryny z Konfiguracji globalnej."
PLG_SYSTEM_MERTOOLS_SCHEMA_SEARCH_LABEL="Adres wyszukiwarki"
PLG_SYSTEM_MERTOOLS_SCHEMA_SEARCH_DESC="Z <code>{search_term_string}</code> w miejscu frazy, np. <code>/szukaj?query={search_term_string}</code>. Puste: bez wyszukiwarki w danych."
PLG_SYSTEM_MERTOOLS_SCHEMA_SP_ORG="Organizacja"
PLG_SYSTEM_MERTOOLS_SCHEMA_ORG_LABEL="Organizacja strony głównej"
PLG_SYSTEM_MERTOOLS_SCHEMA_ORG_DESC="Jeden blok organizacji z <code>@id</code> <code>/#organization</code> (do niego odsyłają wpisy bloga i produkty), zbudowany z pól poniżej. To, co mówi blok, który strona główna już ma, a pola nie, w nim zostaje (adres, współrzędne, punkty kontaktowe…). Pozostałe strony tylko do niego odsyłają."
PLG_SYSTEM_MERTOOLS_SCHEMA_ORG_PAGES_LABEL="Strony, na których też pełna organizacja"
PLG_SYSTEM_MERTOOLS_SCHEMA_ORG_PAGES_DESC="Jeden adres w wierszu, np. <code>firma/kontakt</code>. Blok organizacji takiej strony (strona kontaktu często ma własny, z innymi telefonami i bez logo) jest podmieniany na ten sam, pełny, żeby dane nie różniły się między stronami."
PLG_SYSTEM_MERTOOLS_SCHEMA_TYPE_LABEL="Typ"
PLG_SYSTEM_MERTOOLS_SCHEMA_TYPE_DESC="<i>LocalBusiness</i> dla firmy z miejscem, do którego przychodzą klienci, lub obsługującej okolicę, <i>ProfessionalService</i> dla firmy usługowej, <i>Store</i> dla sklepu, <i>Organization</i> gdy nie ma miejsca."
PLG_SYSTEM_MERTOOLS_SCHEMA_NAME_LABEL="Nazwa"
PLG_SYSTEM_MERTOOLS_SCHEMA_NAME_DESC="Puste: nazwa ustawiona dla wpisów bloga (zakładka Kanały bloga), a w razie braku to, co ma blok strony głównej."
PLG_SYSTEM_MERTOOLS_SCHEMA_LEGAL_LABEL="Pełna nazwa prawna"
PLG_SYSTEM_MERTOOLS_SCHEMA_LEGAL_DESC="Jak w rejestrze, np. <code>Firma Sp. z o.o. Sp. k.</code>."
PLG_SYSTEM_MERTOOLS_SCHEMA_DESCRIPTION_LABEL="Opis"
PLG_SYSTEM_MERTOOLS_SCHEMA_DESCRIPTION_DESC="Jedno lub dwa zdania o tym, czym zajmuje się firma."
PLG_SYSTEM_MERTOOLS_SCHEMA_LOGO_LABEL="Logo"
PLG_SYSTEM_MERTOOLS_SCHEMA_LOGO_DESC="Puste: logo wydawcy wpisów bloga, a w razie braku to z bloku strony głównej. Sprawdź, czy adres się otwiera (logo starego bloku dawało błąd 403)."
PLG_SYSTEM_MERTOOLS_SCHEMA_IMAGE_LABEL="Zdjęcie firmy"
PLG_SYSTEM_MERTOOLS_SCHEMA_IMAGE_DESC="Zdjęcie budynku lub salonu (Google pokazuje je przy firmach lokalnych)."
PLG_SYSTEM_MERTOOLS_SCHEMA_PHONE_LABEL="Główny telefon"
PLG_SYSTEM_MERTOOLS_SCHEMA_PHONE_DESC="W formie międzynarodowej, np. <code>+48 22 000 00 00</code>. Kolejne numery: Punkty kontaktowe poniżej."
PLG_SYSTEM_MERTOOLS_SCHEMA_EMAIL_LABEL="E-mail"
PLG_SYSTEM_MERTOOLS_SCHEMA_EMAIL_DESC="Publiczny adres firmy."
PLG_SYSTEM_MERTOOLS_SCHEMA_MAP_LABEL="Mapa"
PLG_SYSTEM_MERTOOLS_SCHEMA_MAP_DESC="Adres miejsca firmy na mapie (odnośnik do Map Google)."
PLG_SYSTEM_MERTOOLS_SCHEMA_VAT_LABEL="NIP"
PLG_SYSTEM_MERTOOLS_SCHEMA_VAT_DESC="Jak w stopce, np. <code>PL0000000000</code>."
PLG_SYSTEM_MERTOOLS_SCHEMA_KRS_LABEL="Numer KRS"
PLG_SYSTEM_MERTOOLS_SCHEMA_KRS_DESC="Jak w stopce; zapisywany jako identyfikator rodzaju KRS."
PLG_SYSTEM_MERTOOLS_SCHEMA_FOUNDED_LABEL="Rok założenia"
PLG_SYSTEM_MERTOOLS_SCHEMA_FOUNDED_DESC="Rok lub data: <code>1990</code> albo <code>1990-05-17</code>. Inna postać jest pomijana."
PLG_SYSTEM_MERTOOLS_SCHEMA_STREET_LABEL="Ulica i numer"

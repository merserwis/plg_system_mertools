; 1.0.5: edit lock
PLG_SYSTEM_MERTOOLS_FIELDSET_LOCK="Blokada edycji"
PLG_SYSTEM_MERTOOLS_LOCK_NOTE="Tylko jedna osoba naraz w edytorze Gridboxa danego artykułu, produktu lub strony. Gridbox nie ma własnej blokady, więc dwie osoby mogły edytować tę samą stronę, a późniejszy zapis nadpisywał pracę drugiej. Kto pierwszy otworzy edytor, ten trzyma stronę; pozostali widzą, kto ją edytuje i od kiedy, a na listach Gridboxa strona ma znak 🔒. Otwarty edytor potwierdza blokadę co 30 s; strona jest znów wolna po zamknięciu edytora, 2 minuty po tym, jak edytor przestał odpowiadać (zamknięty laptop), albo po czasie bezczynności ustawionym niżej. Zapis z edytora, który stracił blokadę (ktoś ją przejął), jest odrzucany, więc nic nie zostaje nadpisane."
PLG_SYSTEM_MERTOOLS_LOCK_ENABLED_LABEL="Blokuj edytowane strony"
PLG_SYSTEM_MERTOOLS_LOCK_ENABLED_DESC="Wyłączone: każdy może otworzyć stronę, którą edytuje ktoś inny, tak jak w samym Gridboxie."
PLG_SYSTEM_MERTOOLS_LOCK_TAKEOVER_LABEL="Przejmowanie"
PLG_SYSTEM_MERTOOLS_LOCK_TAKEOVER_DESC="Kto może przejąć stronę edytowaną przez kogoś innego (po potwierdzeniu). Osoba, która ją traci, widzi w edytorze czerwony pasek i nie może już zapisać; niezapisane zmiany zostają w jej edytorze do skopiowania."
PLG_SYSTEM_MERTOOLS_LOCK_TAKEOVER_ALL="Każdy, kto może edytować"
PLG_SYSTEM_MERTOOLS_LOCK_TAKEOVER_ADMINS="Tylko administratorzy"
PLG_SYSTEM_MERTOOLS_LOCK_TAKEOVER_NONE="Nikt (czekać, aż się zwolni)"
PLG_SYSTEM_MERTOOLS_LOCK_IDLE_LABEL="Zwolnij po bezczynności (minuty)"
PLG_SYSTEM_MERTOOLS_LOCK_IDLE_DESC="Edytor zostawiony otwarty bez żadnej czynności zwalnia stronę po tym czasie (jeśli nikt jej w międzyczasie nie wziął, właściciel po prostu pracuje dalej). 0 = tylko po zamknięciu."
PLG_SYSTEM_MERTOOLS_LOCK_TITLE="Ta strona jest teraz edytowana"
PLG_SYSTEM_MERTOOLS_LOCK_WHO="Edytuje: %s"
PLG_SYSTEM_MERTOOLS_LOCK_SINCE="Od %1$s, ostatnia aktywność o %2$s."
PLG_SYSTEM_MERTOOLS_LOCK_EXPLAIN="Możesz ją otworzyć, gdy edytor zostanie zamknięty, albo po %d minutach bez aktywności. Dzięki temu dwie osoby nie nadpiszą sobie zmian."
PLG_SYSTEM_MERTOOLS_LOCK_EXPLAIN_NOIDLE="Możesz ją otworzyć, gdy edytor zostanie zamknięty. Dzięki temu dwie osoby nie nadpiszą sobie zmian."
PLG_SYSTEM_MERTOOLS_LOCK_RETRY="Spróbuj ponownie"
PLG_SYSTEM_MERTOOLS_LOCK_BACK="Wróć"
PLG_SYSTEM_MERTOOLS_LOCK_TAKE="Przejmij edycję"
PLG_SYSTEM_MERTOOLS_LOCK_TAKE_CONFIRM="Tę stronę edytuje: %s. Po przejęciu niezapisanych zmian tej osoby nie da się już zapisać. Przejąć?"
PLG_SYSTEM_MERTOOLS_LOCK_SAVE_REFUSED="Nie zapisano: tę stronę edytuje teraz %s. Skopiuj swoje zmiany i otwórz stronę ponownie."
PLG_SYSTEM_MERTOOLS_LOCK_LOST="Edycję tej strony przejęła inna osoba: %1$s (o %2$s). Twoich zmian nie da się już zapisać — skopiuj, co potrzebujesz, i zamknij edytor."
PLG_SYSTEM_MERTOOLS_LOCK_IDLE="Brak aktywności od %d minut: strona jest znów wolna dla innych. Zrób cokolwiek, aby edytować dalej (jeśli nikt jej nie przejął)."

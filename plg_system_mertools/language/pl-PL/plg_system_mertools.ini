; 1.0.6: Gridbox lists
PLG_SYSTEM_MERTOOLS_FIELDSET_LISTS="Listy Gridboxa"
PLG_SYSTEM_MERTOOLS_LISTS_NOTE="Listy produktów, wpisów i stron w panelu Gridboxa. Kolumny: przycisk „Kolumny” nad listą pokazuje, ukrywa i ustawia kolejność kolumn Gridboxa oraz dodaje inne — cenę promocyjną, minimalną ilość, plakietki produktu, wersje/zestawy (tak/nie), daty publikacji i pola aplikacji (np. producenta). Kolumna „Autor” pokazuje obok autorów Gridboxa użytkownika Joomli, który utworzył stronę, według historii edycji; przy stronach starszych niż historia — szarą kursywą — pierwszą osobę, która ją zmieniła. Listy bez tej kolumny (produkty, strony) mogą ją dodać. Każdy użytkownik układa każdą listę dla siebie; ustawienie jest zapisane na serwerze. Edycja na liście: kliknięcie ceny, ceny promocyjnej, stanu, SKU lub plakietek produktu zmienia je od razu, bez edytora; zmiana trafia do historii edycji. Produktu otwartego w edytorze Gridboxa nie można zmienić na liście (kolejny zapis edytora przywróciłby starą wartość). Pozycje z innych folderów: produkt dopisany do kilku folderów widać też, wyszarzony, w pozostałych folderach (pod ich własnymi pozycjami), z linkiem do folderu głównego, w którym się go edytuje."
PLG_SYSTEM_MERTOOLS_LIST_COLUMNS_LABEL="Wybór kolumn"
PLG_SYSTEM_MERTOOLS_LIST_COLUMNS_DESC="Przycisk „Kolumny” nad listami Gridboxa i dodatkowe kolumny."
PLG_SYSTEM_MERTOOLS_LIST_QUICKEDIT_LABEL="Edycja cen na liście"

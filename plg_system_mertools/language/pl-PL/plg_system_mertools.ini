; Ochrona aplikacji
PLG_SYSTEM_MERTOOLS_FIELDSET_APPS="Ochrona aplikacji"
PLG_SYSTEM_MERTOOLS_APPS_NOTE="Gridbox kasuje aplikację — sklep, blog — jednym kliknięciem w X na jej kafelku w panelu Gridboxa i jednym „Usuń” w pytaniu: aplikację, wszystkie jej produkty lub wpisy, kategorie, pola, dane produktów, tagi, komentarze i recenzje, z pominięciem kosza i na zawsze. MerTools blokuje każdą aplikację przed usunięciem (zamiast X jest kłódka) i zapisuje kopię aplikacji przed każdym dozwolonym usunięciem oraz raz dziennie. Kopię można tu przywrócić: wraca to, czego brakuje, a nic, co istnieje, nie jest zmieniane."
PLG_SYSTEM_MERTOOLS_APPS_PROTECT_LABEL="Blokuj usuwanie aplikacji"
PLG_SYSTEM_MERTOOLS_APPS_PROTECT_DESC="Gridbox nie usunie aplikacji, której nie wybrano niżej, skądkolwiek przyjdzie polecenie (X na kafelku, kosz w folderze aplikacji, Usuń aplikację na pasku narzędzi, ręcznie wysłane żądanie). Wyłączone: aplikacje są usuwane jak w samym Gridboxie."
PLG_SYSTEM_MERTOOLS_APPS_UNLOCKED_LABEL="Aplikacje, które można usunąć"
PLG_SYSTEM_MERTOOLS_APPS_UNLOCKED_DESC="Żeby usunąć aplikację: wybierz ją tutaj, zapisz, usuń ją w Gridboxie (najpierw zapisze się kopia), potem zdejmij ją z tej listy. Każda inna aplikacja zostaje zablokowana, także dodane później."
PLG_SYSTEM_MERTOOLS_APPS_UNLOCKED_HINT="Żadna: wszystkie zablokowane"
PLG_SYSTEM_MERTOOLS_APPS_BACKUP_DELETE_LABEL="Kopia przed usunięciem"
PLG_SYSTEM_MERTOOLS_APPS_BACKUP_DELETE_DESC="Zanim Gridbox usunie aplikację, zapisywana jest kopia wszystkiego, co usuwa razem z nią (na liście niżej jako „Przed usunięciem”)."
PLG_SYSTEM_MERTOOLS_APPS_BACKUP_REQUIRED_LABEL="Bez kopii nie usuwaj"
PLG_SYSTEM_MERTOOLS_APPS_BACKUP_REQUIRED_DESC="Gdy kopii nie da się zapisać (folder bez prawa zapisu, pełny dysk), aplikacja nie jest usuwana, a Gridbox pokazuje powód."
PLG_SYSTEM_MERTOOLS_APPS_BACKUP_AUTO_LABEL="Kopie regularne"
PLG_SYSTEM_MERTOOLS_APPS_BACKUP_AUTO_DESC="Kopia każdej aplikacji raz dziennie albo raz w tygodniu, robiona po wizycie na stronie (tam, gdzie serwer na to pozwala, odwiedzający na nią nie czeka). Aplikacja, która nie zmieniła się od ostatniej kopii, nie dostaje nowej. Chroni przed tym, czego blokada nie obejmuje: produktami usuniętymi po kolei z kosza, nieudanym importem."
PLG_SYSTEM_MERTOOLS_APPS_BACKUP_AUTO_DAILY="Codziennie"
PLG_SYSTEM_MERTOOLS_APPS_BACKUP_AUTO_WEEKLY="Co tydzień"
PLG_SYSTEM_MERTOOLS_APPS_BACKUP_AUTO_OFF="Wyłączone"
PLG_SYSTEM_MERTOOLS_APPS_BACKUP_KEEP_LABEL="Ile kopii regularnych trzymać"
PLG_SYSTEM_MERTOOLS_APPS_BACKUP_KEEP_DESC="Na każdą aplikację; starsze kopie regularne są usuwane. Kopie zrobione przed usunięciem albo ręcznie zostają, dopóki ich tu nie usuniesz."
PLG_SYSTEM_MERTOOLS_APPS_BACKUP_PATH_LABEL="Folder kopii"
PLG_SYSTEM_MERTOOLS_APPS_BACKUP_PATH_DESC="Względem katalogu strony albo ścieżka bezwzględna (najlepiej poza katalogiem publicznym, jeśli serwer pozwala). Puste: administrator/backups/mertools, który MerTools zamyka przed dostępem z sieci (.htaccess, web.config). Kopie ze starego folderu nie są przenoszone."
PLG_SYSTEM_MERTOOLS_APPS_PANEL_LABEL="Kopie aplikacji"
PLG_SYSTEM_MERTOOLS_APPS_PANEL_DESC="Każda kopia zawiera wiersze aplikacji z tabel Gridboxa i pliki, które Gridbox usuwa razem z nią (style stron, pliki pól, załączniki komentarzy i recenzji), jako plik gzip z liniami JSON. Przywracanie odtwarza aplikację, jeśli jej nie ma, oraz brakujące kategorie, pola, tagi i produkty lub wpisy — każdy z danymi produktu, polami, tagami, komentarzami i recenzjami; nic, co istnieje, nie jest zmieniane ani nadpisywane. Wyszukiwanie inteligentne: po przywróceniu zaindeksuj stronę ponownie."
PLG_SYSTEM_MERTOOLS_APPS_REFUSED="Nie usunięto: aplikacja „%s” jest chroniona przez MerTools. Żeby ją usunąć, wybierz ją w „Aplikacje, które można usunąć” (System → Wtyczki → MerTools for Gridbox, zakładka „Ochrona aplikacji”)."
PLG_SYSTEM_MERTOOLS_APPS_BACKUP_FAILED="Nie usunięto: MerTools nie zdołał zapisać kopii aplikacji „%1$s” (%2$s)."
PLG_SYSTEM_MERTOOLS_APPS_JS_REFUSED="Aplikacja „%s” jest chroniona przez MerTools przed usunięciem. Żeby ją usunąć, wybierz ją w MerTools w „Aplikacje, które można usunąć” (zakładka „Ochrona aplikacji”); najpierw zapisze się kopia."
PLG_SYSTEM_MERTOOLS_APPS_JS_TIP="Chronione przez MerTools"
PLG_SYSTEM_MERTOOLS_APPS_UI_APP="Aplikacja"
PLG_SYSTEM_MERTOOLS_APPS_UI_PAGES="Produkty / wpisy"

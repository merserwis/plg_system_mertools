PLG_SYSTEM_MERTOOLS_SPEED_BAD_RESULT="Wynik pomiaru jest niepełny i nie został zapisany."
PLG_SYSTEM_MERTOOLS_SPEED_UI_HELP="Pierwszy pomiar strony staje się punktem odniesienia (stan przed zmianami). Kolejne są porównywane z nim. Punkt odniesienia można zmienić w historii. Wynik zielony: 90–100, pomarańczowy: 50–89, czerwony: poniżej 50."

PLG_SYSTEM_MERTOOLS_SPEED_UI_SERVER="Serwer"
PLG_SYSTEM_MERTOOLS_SPEED_UI_SERVER_HINT="Czas, po którym test Google dostał cały kod HTML strony, czyli głównie czas pracy serwera. Lighthouse podaje osobno własny czas odpowiedzi serwera, ale za Cloudflare bywa on mocno zaniżony. Pomiary sprzed wersji 0.0.23 nie mają tej wartości."
PLG_SYSTEM_MERTOOLS_PCACHE_UI_PAGES="Strony w pamięci"
PLG_SYSTEM_MERTOOLS_PCACHE_UI_DATA="Dane Gridboxa w pamięci"
PLG_SYSTEM_MERTOOLS_PCACHE_UI_SIZE="Zajmują"

PLG_SYSTEM_MERTOOLS_NOTFOUND_REDIRECT_LABEL="Przekieruj brakujące strony"
PLG_SYSTEM_MERTOOLS_NOTFOUND_REDIRECT_DESC="Zamiast strony błędu 404 odwiedzający trafia na wybraną stronę, domyślnie główną. <strong>Niezalecane:</strong> Google i tak traktuje brakującą stronę przekierowaną na stronę główną jak brakującą („soft 404”) i dalej ją odwiedza, a agenci i roboty sprawdzające adresy (<code>/.well-known/…</code>) biorą stronę główną za to, o co pytali. Od wersji 1.6.2 domyślnie wyłączone: brakujący adres dostaje stronę błędu z prawdziwym kodem 404, a dziennik poniżej pokazuje, które adresy warto przekierować pojedynczo. Pierwszeństwo mają przekierowania ustawione dla pojedynczych adresów w komponencie Przekierowania Joomli, przekierowanie wpisane w dzienniku, przeniesiona strona i wycofana strona (wyżej). Przekierowywane są tylko strony: wysłane formularze, zapytania AJAX i JSON dostają zwykły błąd 404."
PLG_SYSTEM_MERTOOLS_NOTFOUND_TARGET_LABEL="Przekieruj na"
PLG_SYSTEM_MERTOOLS_NOTFOUND_TARGET_DESC="Strona, na którą trafia odwiedzający zamiast strony błędu."
PLG_SYSTEM_MERTOOLS_NOTFOUND_TARGET_HOME="Stronę główną"
PLG_SYSTEM_MERTOOLS_NOTFOUND_TARGET_MENU="Pozycję menu"
PLG_SYSTEM_MERTOOLS_NOTFOUND_TARGET_URL="Adres (wpisany ręcznie)"
PLG_SYSTEM_MERTOOLS_NOTFOUND_MENUITEM_LABEL="Pozycja menu"
PLG_SYSTEM_MERTOOLS_NOTFOUND_MENUITEM_DESC="Strona z menu witryny. Jeśli tę pozycję usunięto, odwiedzający trafi na stronę główną."
PLG_SYSTEM_MERTOOLS_NOTFOUND_URL_LABEL="Adres"
PLG_SYSTEM_MERTOOLS_NOTFOUND_URL_DESC="Ścieżka na tej stronie, np. <code>/kontakt</code>, albo pełny adres zaczynający się od <code>https://</code>."
PLG_SYSTEM_MERTOOLS_NOTFOUND_CODE_LABEL="Rodzaj przekierowania"
PLG_SYSTEM_MERTOOLS_NOTFOUND_CODE_DESC="Przekierowanie stałe (301) przeglądarki i wyszukiwarki zapamiętują. Tymczasowe (302) sprawdzają za każdym razem, więc lepiej pasuje, gdy brakujące strony mają wkrótce wrócić."
PLG_SYSTEM_MERTOOLS_NOTFOUND_CODE_301="Stałe (301)"
PLG_SYSTEM_MERTOOLS_NOTFOUND_CODE_302="Tymczasowe (302)"
PLG_SYSTEM_MERTOOLS_NOTFOUND_EXCLUDE_LABEL="Bez przekierowania dla adresów zaczynających się od"
PLG_SYSTEM_MERTOOLS_NOTFOUND_EXCLUDE_DESC="Jeden początek ścieżki w wierszu, np. <code>/api/</code>. Takie adresy dostają zwykły błąd 404 i nie trafiają do dziennika."
PLG_SYSTEM_MERTOOLS_NOTFOUND_MOVED_LABEL="Przenoś na strony o zmienionym adresie"
PLG_SYSTEM_MERTOOLS_NOTFOUND_MOVED_DESC="Adres w Gridboksie kończy się aliasem strony albo kategorii (<code>/oferta/mierniki/sonel-mpi-540</code>). Gdy produkt lub wpis dostanie inny alias albo trafi do innej kategorii, stary adres zwraca 404, a linki do niego w Google, w e-mailach i na innych stronach prowadzą donikąd — Gridbox niczego nie przekierowuje. Po włączeniu taki adres dostaje przekierowanie <strong>301</strong> tam, gdzie strona jest teraz: MerTools pamięta aliasy wszystkich stron i kategorii Gridboksa, zapisuje każdą zmianę (po zapisie w Gridboksie i co godzinę), a dla brakującego adresu szuka strony lub kategorii, której alias — obecny albo wcześniejszy — jest ostatnią częścią adresu. Gdy pasuje kilka, wygrywa ta z tej samej aplikacji i kategorii. Tylko opublikowane strony widoczne dla gości. Na start przejmowane są zmiany aliasów zapisane w historii edycji (od MerTools 1.0.3). Stare aliasy są wymienione pod dziennikiem poniżej."
PLG_SYSTEM_MERTOOLS_NOTFOUND_LOG_LABEL="Zapisuj brakujące adresy"
PLG_SYSTEM_MERTOOLS_NOTFOUND_LOG_DESC="Każdy adres strony, który zwrócił 404, jest zapisywany z liczbą odwiedzin, pierwszą i ostatnią, stroną, z której przyszedł ostatni odwiedzający, i tym, co MerTools z nim zrobił. W dzienniku poniżej każdy adres może dostać własne przekierowanie (301), z podpowiedzią strony o podobnym aliasie. Zapisywane są tylko strony (nie wysłane formularze, AJAX, obrazki ani pliki) i nie adresy wyłączone; bez adresów IP ani innych danych odwiedzających."
PLG_SYSTEM_MERTOOLS_NOTFOUND_LOG_DAYS_LABEL="Przechowuj (dni)"
PLG_SYSTEM_MERTOOLS_NOTFOUND_LOG_DAYS_DESC="Adres nieodwiedzany przez tyle dni znika z dziennika (0 = zostaje). Adresy z własnym przekierowaniem zostają zawsze. Dziennik nigdy nie przekracza 10 000 adresów."
PLG_SYSTEM_MERTOOLS_NOTFOUND_PANEL_LABEL="Brakujące adresy"
PLG_SYSTEM_MERTOOLS_NOTFOUND_PANEL_DESC="Dziennik brakujących adresów i stare aliasy stron o zmienionym adresie."

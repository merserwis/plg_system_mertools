; 1.6.0: sitemap
PLG_SYSTEM_MERTOOLS_FIELDSET_SITEMAP="Mapa witryny"
PLG_SYSTEM_MERTOOLS_SITEMAP_ENABLED_LABEL="Mapa witryny MerTools"
PLG_SYSTEM_MERTOOLS_SITEMAP_ENABLED_DESC="Gridbox zapisuje jeden plik <code>sitemap.xml</code> ze wszystkimi adresami, jakie zna, z jedną datą dla większości z nich (Gridbox daje stronie nową datę za każdym razem, gdy w edytorze zapisze się dowolną stronę) i z tagami, które blokuje robots.txt. Po włączeniu MerTools odpowiada pod <code>/sitemap.xml</code> indeksem i osobną mapą dla każdej aplikacji Gridboksa. Trafiają do nich tylko adresy warte indeksowania, każdy z datą ostatniej zmiany treści. Mapy działają od razu pod <code>/sitemap-…xml</code>, a sam <code>/sitemap.xml</code> dopiero po usunięciu pliku Gridboksa (przycisk <em>Przejmij od Gridboksa</em> niżej), bo serwer wysyła ten plik, zanim uruchomi się Joomla. Wyłączone: nic się nie zmienia."
PLG_SYSTEM_MERTOOLS_SITEMAP_SPLIT_LABEL="Podział"
PLG_SYSTEM_MERTOOLS_SITEMAP_SPLIT_DESC="Osobna mapa dla każdej aplikacji Gridboksa (np. <code>sitemap-products-2.xml</code>, <code>sitemap-blog-4.xml</code>) i <code>sitemap-pages.xml</code> dla pozycji menu i pojedynczych stron, wszystkie w indeksie <code>/sitemap.xml</code>. Search Console pokazuje wtedy osobno indeksowanie sklepu, bloga i stron. Albo wszystkie adresy w samym <code>/sitemap.xml</code> (do 50 000)."
PLG_SYSTEM_MERTOOLS_SITEMAP_SPLIT_APP="Mapa na aplikację, w indeksie"
PLG_SYSTEM_MERTOOLS_SITEMAP_SPLIT_SINGLE="Jeden plik"
PLG_SYSTEM_MERTOOLS_SITEMAP_PART_LIMIT_LABEL="Adresów w jednym pliku"
PLG_SYSTEM_MERTOOLS_SITEMAP_PART_LIMIT_DESC="Większa aplikacja dzieli się na części: <code>sitemap-products-2.xml</code>, <code>sitemap-products-2-p2.xml</code>… (1000–50 000, domyślnie 10 000; 50 000 to limit formatu map witryny)."
PLG_SYSTEM_MERTOOLS_SITEMAP_TYPE_MENU_LABEL="Pozycje menu"
PLG_SYSTEM_MERTOOLS_SITEMAP_TYPE_MENU_DESC="Opublikowane, publiczne pozycje menu witryny (strona główna, strony i aplikacje Gridboksa z własną pozycją menu, inne komponenty)."
PLG_SYSTEM_MERTOOLS_SITEMAP_TYPE_PAGE_LABEL="Strony, produkty i wpisy"
PLG_SYSTEM_MERTOOLS_SITEMAP_TYPE_PAGE_DESC="Strony Gridboksa: pojedyncze strony, produkty, wpisy. Tylko opublikowane, publiczne, już rozpoczęte i jeszcze nie zakończone."
PLG_SYSTEM_MERTOOLS_SITEMAP_TYPE_CATEGORY_LABEL="Kategorie"
PLG_SYSTEM_MERTOOLS_SITEMAP_TYPE_CATEGORY_DESC="Strony kategorii aplikacji Gridboksa. Ich data to najnowsza data ich stron, razem z podkategoriami."
PLG_SYSTEM_MERTOOLS_SITEMAP_TYPE_APP_LABEL="Strony główne aplikacji"
PLG_SYSTEM_MERTOOLS_SITEMAP_TYPE_APP_DESC="Strona główna aplikacji Gridboksa, która nie ma pozycji menu (z pozycją menu trafia do mapy jako pozycja menu)."
PLG_SYSTEM_MERTOOLS_SITEMAP_TYPE_TAG_LABEL="Tagi"
PLG_SYSTEM_MERTOOLS_SITEMAP_TYPE_TAG_DESC="Strony tagów aplikacji. Domyślnie wyłączone: to listy wpisów z samym tytułem, a robots.txt wielu witryn je blokuje."
PLG_SYSTEM_MERTOOLS_SITEMAP_TYPE_AUTHOR_LABEL="Autorzy"
PLG_SYSTEM_MERTOOLS_SITEMAP_TYPE_AUTHOR_DESC="Strony autorów aplikacji. Domyślnie wyłączone, z tego samego powodu co tagi."
PLG_SYSTEM_MERTOOLS_SITEMAP_FLAGS_LABEL="Uwzględniaj ustawienia mapy w Gridboksie"
PLG_SYSTEM_MERTOOLS_SITEMAP_FLAGS_DESC="Element wyłączony we własnych ustawieniach mapy Gridboksa (ustawienia strony, kategorii albo aplikacji → SEO → Sitemap) nie trafia do mapy."
PLG_SYSTEM_MERTOOLS_SITEMAP_NOINDEX_LABEL="Pomijaj strony z noindex"
PLG_SYSTEM_MERTOOLS_SITEMAP_NOINDEX_DESC="Strona, która każe robotom jej nie indeksować, nie powinna być w mapie (Search Console zgłasza to jako błąd). Liczy się robots strony w takiej postaci, w jakiej zapisuje je Gridbox: z pozycji menu, która ją pokazuje, a jeśli tam nic nie ma, z ustawienia samej strony, a na końcu z konfiguracji globalnej. Noindex dodanego przez szablon albo nagłówek nie da się tu zobaczyć: na takie strony służą wykluczone ścieżki."
PLG_SYSTEM_MERTOOLS_SITEMAP_ROBOTS_LABEL="Pomijaj adresy blokowane przez robots.txt"
PLG_SYSTEM_MERTOOLS_SITEMAP_ROBOTS_DESC="Adres, którego robots.txt witryny nie pozwala odwiedzać robotom <code>*</code> albo Googlebotowi, nie trafia do mapy (Search Console zgłasza go jako błąd). Plik jest czytany na nowo po każdej zmianie."
PLG_SYSTEM_MERTOOLS_SITEMAP_APPS_LABEL="Wykluczone aplikacje"
PLG_SYSTEM_MERTOOLS_SITEMAP_APPS_DESC="Aplikacje Gridboksa, których strona główna, kategorie, tagi, autorzy i strony nie trafiają do mapy."
PLG_SYSTEM_MERTOOLS_SITEMAP_APPS_HINT="Żadne"
PLG_SYSTEM_MERTOOLS_SITEMAP_PATHS_LABEL="Wykluczone ścieżki"
PLG_SYSTEM_MERTOOLS_SITEMAP_PATHS_DESC="Jedna w wierszu. Porównywana jest cała ścieżka, <code>*</code> zastępuje dowolne znaki, wielkość liter nie ma znaczenia. Np. <code>/sandbox</code>, <code>/blog/regulamin/*</code>, <code>/promocje/*2025*</code>."
PLG_SYSTEM_MERTOOLS_SITEMAP_PATHS_HINT="/sandbox"
PLG_SYSTEM_MERTOOLS_SITEMAP_TITLES_LABEL="Wykluczone tytuły"
PLG_SYSTEM_MERTOOLS_SITEMAP_TITLES_DESC="Jeden w wierszu: element, którego tytuł zawiera ten tekst, nie trafia do mapy (wielkość liter nie ma znaczenia). Np. <code>[ZAKOŃCZONE]</code> dla zakończonych promocji."
PLG_SYSTEM_MERTOOLS_SITEMAP_TITLES_HINT="[ZAKOŃCZONE]"
PLG_SYSTEM_MERTOOLS_SITEMAP_PRICES_LABEL="Licz zmiany cen i stanów"
PLG_SYSTEM_MERTOOLS_SITEMAP_PRICES_DESC="Data strony to chwila, w której zmieniła się jej treść (teksty, pola, tytuł, adres, zdjęcie), a nie chwila zapisu. Po włączeniu liczy się też zmiana ceny, ceny promocyjnej, stanu, wariantów albo opcji produktu. Domyślnie wyłączone: import cen dałby nową datę każdemu produktowi."
PLG_SYSTEM_MERTOOLS_SITEMAP_UNKNOWN_DATE_LABEL="Gdy data jest nieznana"
PLG_SYSTEM_MERTOOLS_SITEMAP_UNKNOWN_DATE_DESC="Strona, której zmiany MerTools jeszcze nie widział i która nie ma zmiany w historii edycji, nie ma znanej daty. Lepiej bez daty (domyślnie) niż z błędną: Google pomija daty, którym nie wierzy. Druga możliwość to data publikacji."
PLG_SYSTEM_MERTOOLS_SITEMAP_UNKNOWN_DATE_OMIT="Bez daty"
PLG_SYSTEM_MERTOOLS_SITEMAP_UNKNOWN_DATE_CREATED="Data publikacji"
PLG_SYSTEM_MERTOOLS_SITEMAP_TTL_LABEL="Czas odświeżania"
PLG_SYSTEM_MERTOOLS_SITEMAP_TTL_DESC="Mapy są trzymane jako pliki i budowane od nowa po tylu minutach (5–1440, domyślnie 360), a wcześniej po zmianie w Gridboksie, w menu, w robots.txt albo w tych ustawieniach. Żądanie, które trafi na nieaktualne mapy, i tak dostaje je od razu, a nowe budują się po jego odpowiedzi."

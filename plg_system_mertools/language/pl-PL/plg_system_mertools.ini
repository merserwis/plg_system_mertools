PLG_SYSTEM_MERTOOLS_SCHEMA_LNG_DESC="np. <code>21.0122</code>"
PLG_SYSTEM_MERTOOLS_SCHEMA_HOURS_LABEL="Godziny otwarcia"
PLG_SYSTEM_MERTOOLS_SCHEMA_HOURS_DESC="Po jednym w wierszu: dni i godziny, np. <code>Pn-Pt 08:00-16:00</code>. Dni: Mo Tu We Th Fr Sa Su lub Pn Wt Śr Cz Pt So Nd; zakres (<code>Pn-Pt</code>) albo lista (<code>Pn,Śr</code>). Jeśli laboratorium lub serwis ma inne godziny niż salon, wpisz tylko godziny miejsca, którego dotyczy adres."
PLG_SYSTEM_MERTOOLS_SCHEMA_CONTACTS_LABEL="Punkty kontaktowe"
PLG_SYSTEM_MERTOOLS_SCHEMA_CONTACTS_DESC="Po jednym w wierszu: <code>telefon | rodzaj | języki | e-mail</code>, np. <code>+48 22 000 00 00 | customer service | pl,en | biuro@firma.pl</code>. Każdemu numerowi daj osobny rodzaj (<code>sales</code>, <code>technical support</code>, <code>customer service</code>), żeby dwa numery nie były oba „technical support”. Wymagany jest tylko telefon."
PLG_SYSTEM_MERTOOLS_SCHEMA_CREDENTIALS_LABEL="Akredytacje i certyfikaty"
PLG_SYSTEM_MERTOOLS_SCHEMA_CREDENTIALS_DESC="Po jednym w wierszu: <code>nazwa | wydane przez | adres wydawcy</code>. Wpisz tylko to, co prawdziwe i potwierdzone przez jednostkę (zakres i oznaczenie normy, data), np. <code>Akredytacja nr AP 000 (PN-EN ISO/IEC 17025) | Polskie Centrum Akredytacji | https://www.pca.gov.pl/</code>. Po odnowieniu zmień datę tu i na stronach."
PLG_SYSTEM_MERTOOLS_SCHEMA_MEMBERS_LABEL="Członek"
PLG_SYSTEM_MERTOOLS_SCHEMA_MEMBERS_DESC="Po jednym w wierszu: <code>nazwa | adres</code> (adres nieobowiązkowy), np. stowarzyszenie."
PLG_SYSTEM_MERTOOLS_SCHEMA_KNOWS_LABEL="Obszary kompetencji"
PLG_SYSTEM_MERTOOLS_SCHEMA_KNOWS_DESC="Po jednym w wierszu, słowami klientów."
PLG_SYSTEM_MERTOOLS_SCHEMA_SAMEAS_LABEL="Profile firmy"
PLG_SYSTEM_MERTOOLS_SCHEMA_SAMEAS_DESC="Jeden adres w wierszu: Facebook, LinkedIn, YouTube, Wikidata… Zapisywane są tylko pełne adresy (https://…)."
PLG_SYSTEM_MERTOOLS_SCHEMA_SP_SRV="Usługi"
PLG_SYSTEM_MERTOOLS_SCHEMA_SERVICES_LABEL="Strony usług"
PLG_SYSTEM_MERTOOLS_SCHEMA_SERVICES_DESC="Po jednej stronie w wierszu: <code>adres | nazwa | rodzaj usługi | opis</code>, np. <code>wzorcowanie-miernikow | Wzorcowanie mierników | Wzorcowanie przyrządów pomiarowych | Akredytowane wzorcowanie ze świadectwem.</code> Wymagany jest tylko adres: pusta nazwa to nagłówek strony, pusty opis to jej opis meta. Strona dostaje blok Service z organizacją jako wykonawcą. Cena nie jest zapisywana."
PLG_SYSTEM_MERTOOLS_SCHEMA_HUB_LABEL="Strona główna usług"
PLG_SYSTEM_MERTOOLS_SCHEMA_HUB_DESC="Adres strony, która zbiera pozostałe (jednej z wierszy powyżej): jej blok Service dostaje listę pozostałych usług jako katalog ofert."
PLG_SYSTEM_MERTOOLS_SCHEMA_CATALOG_LABEL="Nazwa katalogu"
PLG_SYSTEM_MERTOOLS_SCHEMA_CATALOG_DESC="Puste: nazwa strony głównej usług."
PLG_SYSTEM_MERTOOLS_SCHEMA_STYPE_LABEL="Domyślny rodzaj usługi"
PLG_SYSTEM_MERTOOLS_SCHEMA_STYPE_DESC="Dla wiersza bez rodzaju."
PLG_SYSTEM_MERTOOLS_SCHEMA_AREA_LABEL="Obszar działania"
PLG_SYSTEM_MERTOOLS_SCHEMA_AREA_DESC="Kraj, np. <code>Polska</code>. Puste: nie zapisywane."
PLG_SYSTEM_MERTOOLS_SCHEMA_AUDIENCE_LABEL="Odbiorcy"
PLG_SYSTEM_MERTOOLS_SCHEMA_AUDIENCE_DESC="np. <code>Firmy, laboratoria, służby utrzymania ruchu</code>. Puste: nie zapisywane."

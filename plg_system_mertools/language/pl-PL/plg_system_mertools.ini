PLG_SYSTEM_MERTOOLS_SPEED_UI_FIELD_NONE="Brak danych: pojawią się po pierwszym pomiarze, jeśli Google ma dość wizyt na tej stronie."
PLG_SYSTEM_MERTOOLS_SPEED_UI_FIELD_NOTE="To najważniejsze liczby: tak szybko strona działa u odwiedzających. Test laboratoryjny w tabeli Google robi ze swoich serwerów (zwykle w USA), więc jego czas serwera bywa zupełnie inny niż u klientów w Polsce."

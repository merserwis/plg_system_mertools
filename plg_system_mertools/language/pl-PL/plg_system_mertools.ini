PLG_SYSTEM_MERTOOLS_LIST_UI_EDIT_HINT_BADGES="Kliknij cenę, cenę promocyjną, stan, SKU lub plakietki produktu, aby je zmienić (Enter zapisuje, Esc anuluje)."
PLG_SYSTEM_MERTOOLS_LIST_FIELDS_HIDDEN_LABEL="Ukryte pola aplikacji"
PLG_SYSTEM_MERTOOLS_LIST_FIELDS_HIDDEN_DESC="Pola aplikacji, które nie są proponowane jako kolumny: ich nazwy (lub numery), jedna w wierszu albo po przecinku. Pola bez nazwy (puste albo sama kropka) nie są proponowane nigdy."
PLG_SYSTEM_MERTOOLS_LIST_GHOSTS_LABEL="Pozycje z innych folderów"
PLG_SYSTEM_MERTOOLS_LIST_GHOSTS_DESC="Produkt (lub wpis) dopisany do kilku folderów Gridbox pokazuje tylko w jego folderze głównym. Po włączeniu pozostałe foldery też go pokazują, pod własnymi pozycjami: wyszarzony, bez edycji, z linkiem do folderu głównego."
PLG_SYSTEM_MERTOOLS_LIST_GHOSTS_HEAD="Dopisane także do tego folderu, edycja w ich folderze głównym: %d"
PLG_SYSTEM_MERTOOLS_LIST_GHOSTS_LATER="Dopisane także do tego folderu, edycja w ich folderze głównym: %d (na ostatniej stronie listy)"
PLG_SYSTEM_MERTOOLS_LIST_GHOST_NOTE="Folder główny: %s (tam go edytujesz)"
PLG_SYSTEM_MERTOOLS_LIST_GHOST_TIP="Tylko podgląd: edycja w folderze głównym"
PLG_SYSTEM_MERTOOLS_INTRO_LT_LABEL="Znak „<” we wstępach"
PLG_SYSTEM_MERTOOLS_INTRO_LT_DESC="Wstęp (opis) ze znakiem „<”, który nie zaczyna znacznika („czułość <30 mK”, „RE < 0,5 Ω”), psuje listy Gridboxa na serwerach z libxml starszym niż 2.9.11: tekst jest ucinany na „<”, a kolejne produkty wpadają do tej karty (siatka lub lista się rozjeżdża); ucinany jest też meta opis. Po włączeniu taki „<” jest zapisywany jako &lt; — po każdym zapisie w Gridboxie, przy instalacji MerTools i raz dziennie — więc wszędzie, także w edytorze Gridboxa, widać zwykłe „<”."
PLG_SYSTEM_MERTOOLS_HISTORY_F_BADGES="Plakietki"

; 1.0.8: discount %
PLG_SYSTEM_MERTOOLS_SHOP_DISCOUNT_FIELD_LABEL="Rabat % w edytorze produktu"
PLG_SYSTEM_MERTOOLS_SHOP_DISCOUNT_FIELD_DESC="Obok ceny promocyjnej w edytorze produktu Gridboxa: rabat od ceny regularnej (np. 10) ustawia cenę promocyjną i ceny promocyjne wszystkich wersji/zestawów, każdą od jej własnej ceny. Na listach wpisanie „10%” jako ceny promocyjnej robi to samo dla produktu."
PLG_SYSTEM_MERTOOLS_PRICE_REQUEST_LABEL="Cena na zapytanie"
PLG_SYSTEM_MERTOOLS_PRICE_REQUEST_DESC="Produkt bez ceny (0 lub puste pole w Gridboksie) pokazuje w miejscu ceny tekst, np. „Na zapytanie”, a produkt, którego modele mają ceny, prosi o wybór modelu: na stronie produktu oraz na listach i w sliderach produktów. Gridbox zostawia to miejsce puste. Lista lub slider z cenami wyłączonymi w ustawieniach Gridboksa zostaje bez zmian, więc produkty z cenami nie dostaną tam tego tekstu. Tekst trafia też do list doczytanych później (filtry, kolejne produkty, wyszukiwanie) i na stronę produktu po wybraniu wersji bez ceny. Linia wtyczki Omnibus „najniższa cena z 30 dni” z kwotą 0,00 jest ukrywana. Zastępuje osobny skrypt do tego samego (na merserwis.pl: plugins/system/omnibus/assets/scprice.js): tamten skrypt jest zdejmowany ze stron, nie trzeba niczego kasować na serwerze."
PLG_SYSTEM_MERTOOLS_PRICE_REQUEST_DEFAULT="Na zapytanie"
PLG_SYSTEM_MERTOOLS_PRICE_REQUEST_TEXT_LABEL="Tekst"
PLG_SYSTEM_MERTOOLS_PRICE_REQUEST_TEXT_DESC="Wyświetlany zamiast ceny. Puste: „Na zapytanie” w języku strony."
PLG_SYSTEM_MERTOOLS_PRICE_REQUEST_CHOOSE_DEFAULT="Wybierz model z listy"
PLG_SYSTEM_MERTOOLS_PRICE_REQUEST_CHOOSE_LABEL="Tekst, gdy modele mają ceny"
PLG_SYSTEM_MERTOOLS_PRICE_REQUEST_CHOOSE_DESC="Dla produktu bez własnej ceny, którego wersje/modele z listy opcji Gridboksa mają ceny: wyświetlany, dopóki klient nie wybierze modelu, potem cena tego modelu (albo tekst powyżej, gdy i ten model nie ma ceny). Także na listach i w sliderach. Puste: „Wybierz model z listy” w języku strony."
PLG_SYSTEM_MERTOOLS_PRICE_REQUEST_SIZE_LABEL="Wielkość tekstu (px)"
PLG_SYSTEM_MERTOOLS_PRICE_REQUEST_SIZE_DESC="Wielkość tekstu w pikselach — słowo jest zwykle dłuższe od ceny, a mniejsza czcionka mieści je w jednej linii. 0: wielkość, jaką Gridbox daje cenom w tym elemencie."
PLG_SYSTEM_MERTOOLS_SHOP_OMNIBUS_LABEL="Omnibus: najniższa cena przed obniżką"
PLG_SYSTEM_MERTOOLS_SHOP_OMNIBUS_DESC="Najniższa cena z 30 dni przed obniżką, obok ceny obniżonej, tak jak wymaga prawo (dyrektywa Omnibus; w Polsce art. 4 ustawy o informowaniu o cenach towarów i usług). MerTools prowadzi historię cen regularnych i promocyjnych każdego produktu i każdej wersji (Gridbox jej nie prowadzi): po każdej zmianie wysłanej do Gridboksa i co godzinę. Promocja samego Gridboksa (Gridbox → Discounts) jest obniżką jak każda inna: produkty, które obniża, mają w historii jej cenę jako cenę promocyjną, a ceny są porównywane ponownie w chwili, gdy promocja się zaczyna lub kończy. Gdy cena spada do ceny promocyjnej, najniższa cena obowiązująca w 30 dniach przed obniżką (łącznie z wcześniejszą ceną promocyjną z tych dni; produkt sprzedawany krócej niż 30 dni: od początku sprzedaży) jest zapamiętywana na cały czas tej promocji. Pokazuje się na stronie produktu, dla wybranej wersji, i pod cenami promocyjnymi na listach. Na start promocje trwające w tej chwili dostają cenę odniesienia z osobnej wtyczki Omnibus, gdy dotyczy tej samej promocji, w przeciwnym razie cenę regularną. Linie i skrypt tamtej wtyczki (plugins/system/omnibus/assets/scr_omnibus.js) są zdejmowane ze stron; linia wygląda tak, jak nadawał jej arkusz stylów wtyczki. To, co wtyczka robiła dla stron kategorii: opcja „Strony kategorii” (zakładka Układ strony). Po włączeniu obu i sprawdzeniu listy poniżej wtyczkę można usunąć."
PLG_SYSTEM_MERTOOLS_OMNIBUS_TEXT_DEFAULT="Najniższa cena z 30 dni przed obniżką: {price}"
PLG_SYSTEM_MERTOOLS_OMNIBUS_TEXT_LABEL="Tekst"
PLG_SYSTEM_MERTOOLS_OMNIBUS_TEXT_DESC="Linia pokazywana przy cenie obniżonej; {price} to najniższa cena w formacie sklepu (waluta jak w Gridboksie). Puste: „Najniższa cena z 30 dni przed obniżką: {price}” w języku strony."
PLG_SYSTEM_MERTOOLS_OMNIBUS_LISTS_LABEL="Także na listach"
PLG_SYSTEM_MERTOOLS_OMNIBUS_LISTS_DESC="Ta sama linia, małą czcionką, pod ceną promocyjną produktu na listach i w sliderach, które pokazują ceny. Prawo wymaga jej wszędzie, gdzie pokazana jest obniżona cena."
PLG_SYSTEM_MERTOOLS_OMNIBUS_PANEL_LABEL="Historia cen"
PLG_SYSTEM_MERTOOLS_OMNIBUS_PANEL_DESC="Co zawiera historia, promocje samego Gridboksa i to, czy linia za nimi idzie, a pod liczbami wszystkie produkty i wersje w promocji z pokazywaną najniższą ceną i jej źródłem — warto przejrzeć przed usunięciem osobnej wtyczki Omnibus."

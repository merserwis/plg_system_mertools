PLG_SYSTEM_MERTOOLS_NF_UI_MOVED_CATEGORY="kategoria"
PLG_SYSTEM_MERTOOLS_NF_UI_EDIT="Edytuj w Gridboksie"
PLG_SYSTEM_MERTOOLS_NF_UI_GONE="Tego wpisu nie ma już w dzienniku."
PLG_SYSTEM_MERTOOLS_NF_UI_BAD_TARGET="Z tego adresu nie da się skorzystać: wpisz ścieżkę tej strony (np. /kontakt) albo pełny adres zaczynający się od https://, inny niż sam brakujący adres."
PLG_SYSTEM_MERTOOLS_FIELDSET_LAYOUT="Układ strony"
PLG_SYSTEM_MERTOOLS_LAYOUT_CLIP_LABEL="Bez przesuwania strony w bok na telefonach"
PLG_SYSTEM_MERTOOLS_LAYOUT_CLIP_DESC="Element Gridboksa wystający w prawo (wiersz z animacją wjazdu lub efektem ruchu, menu wysuwane z boku) sprawia, że telefon układa stronę szerzej niż ekran. Gridbox ukrywa tę część, ale hamburger w nagłówku, przycisk ułatwień dostępu i przyciski pływające lądują wtedy poza ekranem. Ta opcja trzyma szerokość strony równą szerokości ekranu; nic widocznego nie zostaje ucięte."
PLG_SYSTEM_MERTOOLS_LAYOUT_CATEGORIES_LABEL="Strony kategorii: teraz w Better Categories"
PLG_SYSTEM_MERTOOLS_LAYOUT_CATEGORIES_MOVED="Opisy kategorii i rozwijanie kliknięciem w cały wiersz elementu Kategorie Gridboksa robi od MerTools 1.4.0 wtyczka <strong>Better Categories for Gridbox</strong> (wersja 1.7.0 lub nowsza), z większą liczbą ustawień: miejsce opisu i pokazywanie tylko jego początku z przyciskiem „Rozwiń opis”. Jej zakładki <em>Opis kategorii</em> oraz <em>Nawigacja i SEO</em>. Gdy ustawienie <em>Strony kategorii</em> było tu włączone, Better Categories włącza oba przy swojej aktualizacji."
PLG_SYSTEM_MERTOOLS_FIELDSET_FEED="Kanały bloga (RSS / Atom)"
PLG_SYSTEM_MERTOOLS_FEED_ENABLED_LABEL="Kanały RSS / Atom blogów"
PLG_SYSTEM_MERTOOLS_FEED_ENABLED_DESC="Gridbox nie ma kanałów. Po włączeniu każdy blog Gridboksa ma kanał RSS 2.0 i Atom 1.0 z najnowszymi wpisami: adres strony bloga z <code>?format=feed&amp;type=rss</code> (albo <code>&amp;type=atom</code>), np. <code>/blog?format=feed&amp;type=rss</code>. Strona kategorii daje wpisy tej kategorii i jej podkategorii, strona tagu albo autora — wpisy tego tagu albo autora. Tylko to, co widzi gość strony: wpisy opublikowane, publiczne, już rozpoczęte i niezakończone, spoza kosza; na stronie wielojęzycznej — w języku strony. Czytniki kanałów, newslettery (np. RSS-to-email) i przeglądarki znajdują kanały po linkach w nagłówku stron bloga."
PLG_SYSTEM_MERTOOLS_FEED_FORMAT_LABEL="Format"
PLG_SYSTEM_MERTOOLS_FEED_FORMAT_DESC="Które kanały są dostępne. RSS 2.0 czyta wszystko; Atom 1.0 to ściślejszy standard, z datą ostatniej zmiany każdego wpisu. Przy obu adres bez <code>type</code> daje RSS; przy jednym — ten jeden, a drugiego nie ma (404)."
PLG_SYSTEM_MERTOOLS_FEED_FORMAT_BOTH="RSS 2.0 i Atom 1.0"
PLG_SYSTEM_MERTOOLS_FEED_FORMAT_RSS="Tylko RSS 2.0"
PLG_SYSTEM_MERTOOLS_FEED_FORMAT_ATOM="Tylko Atom 1.0"
PLG_SYSTEM_MERTOOLS_FEED_APPS_LABEL="Blogi z kanałem"
PLG_SYSTEM_MERTOOLS_FEED_APPS_DESC="Aplikacje Gridboksa, które mają kanał. Bez wyboru: każdy blog (aplikacje typu blog). Można też wybrać inne aplikacje z wpisami (np. portfolio albo sklep); pozostałe nie mają wtedy kanału (404)."
PLG_SYSTEM_MERTOOLS_FEED_APPS_HINT="Każdy blog"
PLG_SYSTEM_MERTOOLS_FEED_LIMIT_LABEL="Wpisów w kanale"
PLG_SYSTEM_MERTOOLS_FEED_LIMIT_DESC="Ile najnowszych wpisów ma kanał (1–100, domyślnie 20)."
PLG_SYSTEM_MERTOOLS_FEED_TEXT_LABEL="Tekst wpisu"
PLG_SYSTEM_MERTOOLS_FEED_TEXT_DESC="Co kanał podaje o każdym wpisie oprócz tytułu i linku. Wstęp (Intro Text w ustawieniach wpisu w Gridboksie) idzie jako HTML, opis meta (ustawienia SEO wpisu) jako zwykły tekst. Gdy wybrany jest pusty, brany jest ten drugi."
PLG_SYSTEM_MERTOOLS_FEED_TEXT_INTRO="Wstęp (a bez niego opis meta)"
PLG_SYSTEM_MERTOOLS_FEED_TEXT_META="Opis meta (a bez niego wstęp)"
PLG_SYSTEM_MERTOOLS_FEED_TEXT_NONE="Tylko tytuł i link"
PLG_SYSTEM_MERTOOLS_FEED_IMAGE_LABEL="Obrazek wstępu"
PLG_SYSTEM_MERTOOLS_FEED_IMAGE_DESC="Obrazek wstępu wpisu nad jego tekstem i jako obrazek pozycji (w RSS enclosure i media:content, w Atom link enclosure) — czytniki i newslettery RSS-to-email pokazują go jako miniaturę."
PLG_SYSTEM_MERTOOLS_FEED_ENCLOSURE_LABEL="Obrazek także jako załącznik"
PLG_SYSTEM_MERTOOLS_FEED_ENCLOSURE_DESC="Obrazek wstępu także jako załącznik pozycji (w RSS enclosure i media:content, w Atom link enclosure). Wyłączone: obrazek jest tylko nad tekstem — niektóre czytniki (np. Feedbro) pokazują załącznik jako dodatkową linię pod tekstem („View enclosure”). Włączone: dla usług, które biorą obrazek pozycji z załącznika (niektóre newslettery RSS-to-email, czytniki w stylu podcastów)."
PLG_SYSTEM_MERTOOLS_FEED_MORE_LABEL="Link do całego artykułu"
PLG_SYSTEM_MERTOOLS_FEED_MORE_DESC="Link w formie przycisku pod tekstem każdej pozycji, otwierający wpis na stronie (np. „Przeczytaj cały artykuł →”). Ma kolor linków czytnika; czytniki, które pomijają style, pokazują go jako zwykły link."
PLG_SYSTEM_MERTOOLS_FEED_MORE_TEXT_LABEL="Tekst linku"
PLG_SYSTEM_MERTOOLS_FEED_MORE_TEXT_DESC="Tekst linku do całego artykułu. Puste: „Przeczytaj cały artykuł” (w języku strony)."
PLG_SYSTEM_MERTOOLS_FEED_MORE_DEFAULT="Przeczytaj cały artykuł"
PLG_SYSTEM_MERTOOLS_FEED_HEAD_LABEL="Linki w nagłówku strony"
PLG_SYSTEM_MERTOOLS_FEED_HEAD_DESC="<code>&lt;link rel=&quot;alternate&quot;&gt;</code> do kanałów w nagłówku stron — po nich kanały znajdują czytniki, rozszerzenia przeglądarek i wyszukiwarki. Strony bloga i jego wpisy: strona bloga linkuje swój kanał (strona kategorii, tagu albo autora — ten kanał i kanał całego bloga), wpis — kanał swojego bloga. Każda strona: dodatkowo kanały wszystkich blogów na każdej stronie serwisu."
PLG_SYSTEM_MERTOOLS_FEED_HEAD_BLOG="Strony bloga i jego wpisy"
PLG_SYSTEM_MERTOOLS_FEED_HEAD_ALL="Każda strona"
PLG_SYSTEM_MERTOOLS_FEED_HEAD_NONE="Brak"
PLG_SYSTEM_MERTOOLS_FEED_TTL_LABEL="Czas odświeżania (minuty)"
PLG_SYSTEM_MERTOOLS_FEED_TTL_DESC="Jak długo czytniki i pamięci podręczne (przeglądarka, Cloudflare) mogą trzymać kanał, zanim zapytają znowu, w minutach (0–1440, domyślnie 60); to też <code>ttl</code> w RSS. Czytnik, który pyta znowu, dostaje „bez zmian” (304), dopóki nic się nie zmieniło. 0: pyta za każdym razem."
PLG_SYSTEM_MERTOOLS_FEED_PANEL_LABEL="Adresy kanałów"
PLG_SYSTEM_MERTOOLS_FEED_PANEL_DESC="Blogi, które mają kanał, z adresami ich kanałów takimi jak na stronie (np. <code>/blog?format=feed&amp;type=rss</code>) — według zapisanych ustawień. Te adresy podaje się czytnikom i usługom newsletterów albo dodaje w Google Search Console jako mapę witryny."
PLG_SYSTEM_MERTOOLS_FEED_UI_BLOG="Blog"
PLG_SYSTEM_MERTOOLS_FEED_UI_ADDRESS="Kanał"
PLG_SYSTEM_MERTOOLS_FEED_UI_EMPTY="Żaden blog nie ma kanału: w Gridboksie nie ma bloga albo żadna z wybranych aplikacji nim nie jest."
PLG_SYSTEM_MERTOOLS_FEED_UI_ERROR="Nie udało się odczytać blogów Gridboksa."
PLG_SYSTEM_MERTOOLS_FEED_UI_HINT="Strona kategorii, tagu albo autora też ma kanał: jej adres z ?format=feed&type=rss (albo atom). Zmiany ustawień działają po zapisaniu."
PLG_SYSTEM_MERTOOLS_FIELDSET_SHOP="Sklep"
PLG_SYSTEM_MERTOOLS_SHOP_OPTION_LINKS_LABEL="Linki do opcji produktu"
PLG_SYSTEM_MERTOOLS_SHOP_OPTION_LINKS_DESC="Po wybraniu opcji lub zestawu produktu Gridbox dopisuje wybór do adresu strony, np. <code>?Zestawy+Metrel+MI+3155=…</code>. Taki link otwierał jednak produkt bez zaznaczonej opcji, gdy nazwa grupy opcji ma spację, kropkę lub nawias kwadratowy, czyli prawie zawsze. Z tą opcją link otwiera produkt z wybraną opcją, jej ceną, kodem SKU i zdjęciami. Działa też, gdy nazwa opcji zawiera symbol zapisany kodem HTML, np. czerwoną kropkę <code>&amp;#128308;</code>. Można więc wysłać klientowi link do konkretnego zestawu lub modelu."
PLG_SYSTEM_MERTOOLS_CART_ENABLED_LABEL="Porządkowanie starych koszyków"
PLG_SYSTEM_MERTOOLS_CART_ENABLED_DESC="Gridbox zapisuje w bazie każdy rozpoczęty koszyk i nigdy go nie usuwa, także koszyki zamówień złożonych dawno temu. MerTools usuwa koszyki, których nikt już nie otworzy. Do koszyka wraca się tylko przez ciasteczko Gridboksa, ważne 7 dni od ostatniej zmiany. Dlatego MerTools notuje, kiedy koszyk był ostatnio używany. Zamówienia i ich dane nie są ruszane, bo mają własne kopie produktów."
PLG_SYSTEM_MERTOOLS_CART_MODE_LABEL="Usuwanie"
PLG_SYSTEM_MERTOOLS_CART_MODE_DESC="Kiedy usuwać stare koszyki. Przycisk „Wyczyść teraz” poniżej działa w każdym trybie."
PLG_SYSTEM_MERTOOLS_CART_MODE_MANUAL="Tylko ręcznie (przycisk niżej)"
PLG_SYSTEM_MERTOOLS_CART_MODE_DAILY="Automatycznie raz dziennie"
PLG_SYSTEM_MERTOOLS_CART_MODE_LIMIT="Automatycznie, gdy koszyków jest więcej niż limit"
PLG_SYSTEM_MERTOOLS_CART_LIMIT_LABEL="Limit koszyków"
PLG_SYSTEM_MERTOOLS_CART_LIMIT_DESC="Gdy w bazie jest więcej koszyków, MerTools usuwa te, które mogą zniknąć (sprawdza co godzinę)."
PLG_SYSTEM_MERTOOLS_CART_DAYS_LABEL="Koszyki z produktami: nieużywane od (dni)"
PLG_SYSTEM_MERTOOLS_CART_DAYS_DESC="Koszyk z produktami jest usuwany, gdy nikt go nie używał przez tyle dni. Najmniej 8, bo ciasteczko koszyka jest ważne 7 dni. MerTools musi obserwować koszyki przez tyle samo dni, zanim usunie pierwszy. Puste koszyki nie czekają."
PLG_SYSTEM_MERTOOLS_CART_EMPTY_LABEL="Usuwaj puste koszyki od razu"
PLG_SYSTEM_MERTOOLS_CART_EMPTY_DESC="Koszyk bez produktów niczego nie przechowuje. Jeśli jego właściciel wróci, Gridbox założy mu nowy koszyk. Pomijane są koszyki użyte w ostatniej godzinie i 100 najnowszych."
PLG_SYSTEM_MERTOOLS_CART_PANEL_LABEL="Koszyki w bazie"
PLG_SYSTEM_MERTOOLS_CART_PANEL_DESC="„Sprawdź” pokazuje, co zostałoby usunięte przy ustawieniach widocznych na ekranie, nawet niezapisanych. „Wyczyść i zoptymalizuj” usuwa to od razu, partiami, bez blokowania sklepu, a potem przebudowuje tabele koszyków, żeby baza naprawdę się zmniejszyła."
PLG_SYSTEM_MERTOOLS_CART_UNSUPPORTED="Ta strona nie ma sklepu Gridbox w bazie MySQL ani MariaDB."
PLG_SYSTEM_MERTOOLS_CART_UI_CARTS="Koszyki"
PLG_SYSTEM_MERTOOLS_CART_UI_WITH_PRODUCTS="Z produktami"
PLG_SYSTEM_MERTOOLS_CART_UI_EMPTY="Puste"
PLG_SYSTEM_MERTOOLS_CART_UI_PRODUCTS="Pozycje w koszykach"
PLG_SYSTEM_MERTOOLS_CART_UI_WATCH_SINCE="Obserwowane od"
PLG_SYSTEM_MERTOOLS_CART_UI_WATCH_NONE="jeszcze nie (zacznie się przy najbliższej wizycie na stronie)"
PLG_SYSTEM_MERTOOLS_CART_UI_ABANDONED_FROM="Koszyki z produktami można usuwać"
PLG_SYSTEM_MERTOOLS_CART_UI_ABANDONED_NOW="już teraz"
PLG_SYSTEM_MERTOOLS_CART_UI_LATER="po rozpoczęciu obserwacji"
PLG_SYSTEM_MERTOOLS_CART_UI_LAST="Ostatnie czyszczenie"
PLG_SYSTEM_MERTOOLS_CART_UI_LAST_NONE="jeszcze nie było"
PLG_SYSTEM_MERTOOLS_CART_UI_BY_AUTO="%1$s, automatycznie: %2$s pustych, %3$s nieużywanych, %4$s pozycji"
PLG_SYSTEM_MERTOOLS_CART_UI_BY_MANUAL="%1$s, ręcznie: %2$s pustych, %3$s nieużywanych, %4$s pozycji"
PLG_SYSTEM_MERTOOLS_CART_UI_NOT_FINISHED="Nie wszystko zmieściło się w czasie, reszta zostanie usunięta przy następnym czyszczeniu (albo kliknij ponownie)."
PLG_SYSTEM_MERTOOLS_CART_UI_SIZE="Rozmiar tabel koszyków"
PLG_SYSTEM_MERTOOLS_CART_UI_OPTIMIZED="Tabele koszyków zoptymalizowane: %1$s → %2$s."
PLG_SYSTEM_MERTOOLS_CART_UI_CHECK="Sprawdź"
PLG_SYSTEM_MERTOOLS_CART_UI_CLEAN="Wyczyść i zoptymalizuj"
PLG_SYSTEM_MERTOOLS_CART_UI_WORKING="Pracuję…"
PLG_SYSTEM_MERTOOLS_CART_UI_CONFIRM="Usunąć teraz koszyki, które mogą zniknąć, i zoptymalizować tabele koszyków? Usunięcia nie da się cofnąć. Zamówienia zostaną bez zmian."
PLG_SYSTEM_MERTOOLS_CART_UI_WOULD="Zostałoby usuniętych: %1$s pustych koszyków i %2$s nieużywanych koszyków z produktami (%3$s pozycji)."
PLG_SYSTEM_MERTOOLS_CART_UI_DID="Usunięto: %1$s pustych koszyków, %2$s nieużywanych koszyków z produktami i %3$s pozycji koszyków."
PLG_SYSTEM_MERTOOLS_CART_UI_NOTHING="Nie ma koszyków do usunięcia."
PLG_SYSTEM_MERTOOLS_CART_UI_ATTACHED="%s koszyków z plikami dołączonymi do produktów zostaje."
PLG_SYSTEM_MERTOOLS_CART_UI_BUSY="Czyszczenie już trwa (np. automatyczne). Spróbuj za kilka minut."
PLG_SYSTEM_MERTOOLS_CART_UI_ERROR="Nie udało się:"
PLG_SYSTEM_MERTOOLS_CART_UI_LOADING="Liczę koszyki…"
PLG_SYSTEM_MERTOOLS_FIELDSET_TEL="Numery telefonów"
PLG_SYSTEM_MERTOOLS_TEL_ENABLED_LABEL="Kliknij, aby zadzwonić"
PLG_SYSTEM_MERTOOLS_TEL_ENABLED_DESC="Numery telefonów zapisane na stronach zwykłym tekstem stają się linkami, które je wybierają (<code>tel:</code>), także tam, gdzie nikt nie wstawił linku. Rozpoznawane są polskie numery w zwykłych zapisach (<code>22 531 00 94</code>, <code>(22) 531-00-94</code>, <code>533 394 222</code>, z +48 lub bez) i numery zagraniczne zaczynające się od +. Istniejące linki, przyciski i pola formularzy zostają bez zmian, podobnie numery, które nie są telefonami (NIP, REGON, KRS, konta bankowe, numery seryjne, ceny). Treść stron w Gridboksie nie jest zmieniana."
PLG_SYSTEM_MERTOOLS_TEL_DEVICES_LABEL="Na urządzeniach"
PLG_SYSTEM_MERTOOLS_TEL_DEVICES_DESC="Na komputerze kliknięcie numeru otwiera aplikację do dzwonienia (np. Teams, Skype, połączony telefon), jeśli jest zainstalowana."
PLG_SYSTEM_MERTOOLS_TEL_DEVICES_ALL="Wszystkie urządzenia"
PLG_SYSTEM_MERTOOLS_TEL_DEVICES_TOUCH="Tylko telefony i tablety (ekrany dotykowe)"
PLG_SYSTEM_MERTOOLS_TEL_STYLE_LABEL="Wygląd"
PLG_SYSTEM_MERTOOLS_TEL_STYLE_DESC="Jak wyglądają numery po zamianie na linki."
PLG_SYSTEM_MERTOOLS_TEL_STYLE_TEXT="Jak tekst obok (podkreślenie po najechaniu)"
PLG_SYSTEM_MERTOOLS_TEL_STYLE_LINK="Jak pozostałe linki na stronie"
PLG_SYSTEM_MERTOOLS_TEL_COUNTRY_LABEL="Numer kierunkowy kraju"
PLG_SYSTEM_MERTOOLS_TEL_COUNTRY_DESC="Dodawany do numerów zapisanych bez niego, żeby dało się je wybrać także z zagranicy. Domyślnie 48 (Polska). Puste: numer jest wybierany tak, jak zapisano."
PLG_SYSTEM_MERTOOLS_TEL_EXCLUDE_LABEL="Pomiń te obszary (selektor CSS)"
PLG_SYSTEM_MERTOOLS_TEL_EXCLUDE_DESC="Części strony, w których numery zostają zwykłym tekstem, np. <code>.kody-produktow, #cennik</code>. Linki, przyciski, formularze i kod są pomijane zawsze."
PLG_SYSTEM_MERTOOLS_FIELDSET_DARK="Tryb ciemny"
PLG_SYSTEM_MERTOOLS_DARK_NOTE="Elegancki ciemny motyw całej strony, zbudowany na własnych zmiennych kolorów Gridbox — miękkie ciemne szarości i granaty, nigdy ostra czerń, więc nie męczy oczu. Przycisk przełączania trafia do nagłówka; wybór odwiedzającego jest zapamiętywany, a tryb <em>Automatyczny</em> dostosowuje się do ustawień jego systemu. Pliki rdzenia Gridbox nie są zmieniane."
PLG_SYSTEM_MERTOOLS_DARK_ENABLED_LABEL="Tryb ciemny"
PLG_SYSTEM_MERTOOLS_DARK_ENABLED_DESC="Dodaje do strony ciemny motyw i przycisk przełączania w nagłówku."
PLG_SYSTEM_MERTOOLS_DARK_PALETTE_LABEL="Paleta"
PLG_SYSTEM_MERTOOLS_DARK_PALETTE_DESC="Wygląd ciemnego motywu. Wszystkie są miękkie (nie czysta czerń); wybierz pasującą do strony albo Własna, by ustawić każdy kolor samodzielnie."
PLG_SYSTEM_MERTOOLS_DARK_PALNAME_SLATE="Łupek"
PLG_SYSTEM_MERTOOLS_DARK_PALNAME_CHARCOAL="Węgiel"
PLG_SYSTEM_MERTOOLS_DARK_PALNAME_MIDNIGHT="Północ"
PLG_SYSTEM_MERTOOLS_DARK_PALNAME_WARM="Ciepła"
PLG_SYSTEM_MERTOOLS_DARK_PALNAME_SEPIA="Sepia"
PLG_SYSTEM_MERTOOLS_DARK_PALNAME_DIM="Przygaszona"
PLG_SYSTEM_MERTOOLS_DARK_PALNAME_CUSTOM="Własna"
PLG_SYSTEM_MERTOOLS_DARK_CHOOSE="Kolory trybu ciemnego"
PLG_SYSTEM_MERTOOLS_DARK_PICKER_LABEL="Kropki palet przy przycisku"
PLG_SYSTEM_MERTOOLS_DARK_PICKER_DESC="Po najechaniu na przycisk zmiany trybu (na telefonie po dłuższym przytrzymaniu) wysuwają się kropki w kolorach palet: odwiedzający wybiera np. Sepię zamiast Łupka i tryb ciemny przełącza się na nią. Wybór jest zapamiętywany."
PLG_SYSTEM_MERTOOLS_DARK_PALETTES_LABEL="Palety do wyboru"
PLG_SYSTEM_MERTOOLS_DARK_PALETTES_DESC="Palety, które odwiedzający mogą wybrać kropkami. Paleta ustawiona wyżej jest domyślna i zawsze dostępna; natężenie dotyczy wszystkich."
PLG_SYSTEM_MERTOOLS_DARK_INTENSITY_LABEL="Natężenie"
PLG_SYSTEM_MERTOOLS_DARK_INTENSITY_DESC="Jak głęboki jest tryb ciemny: 50 to paleta w zaprojektowanej postaci, mniej to łagodniejsze, jaśniejsze szarości, więcej to głębsza ciemność (nigdy czysta czerń). Podgląd niżej zmienia się razem z suwakiem."
PLG_SYSTEM_MERTOOLS_DARK_PREVIEW_LABEL="Podgląd"
PLG_SYSTEM_MERTOOLS_DARK_PREVIEW_DARK="Ciemny"
PLG_SYSTEM_MERTOOLS_DARK_PREVIEW_LIGHT="Jasny"
PLG_SYSTEM_MERTOOLS_DARK_PREVIEW_TITLE="Profesjonalna aparatura pomiarowa"
PLG_SYSTEM_MERTOOLS_DARK_PREVIEW_TEXT="Testery, mierniki i analizatory ze świadectwami wzorcowania. Zamów dziś, a wyślemy w ciągu 24 godzin."
PLG_SYSTEM_MERTOOLS_DARK_PREVIEW_LINK="Zobacz ofertę"
PLG_SYSTEM_MERTOOLS_DARK_PREVIEW_BUTTON="Do koszyka"
PLG_SYSTEM_MERTOOLS_DARK_PREVIEW_CARD="Karta"
PLG_SYSTEM_MERTOOLS_DARK_PREVIEW_MUTED="Tekst pomocniczy, daty i podpisy"
PLG_SYSTEM_MERTOOLS_DARK_PREVIEW_INTENSITY="Natężenie: %s"
PLG_SYSTEM_MERTOOLS_DARK_PAL_SLATE="Łupek — elegancki niebieskoszary (zalecane)"
PLG_SYSTEM_MERTOOLS_DARK_PAL_CHARCOAL="Grafit — neutralna szarość"
PLG_SYSTEM_MERTOOLS_DARK_PAL_MIDNIGHT="Północ — głęboki granat"
PLG_SYSTEM_MERTOOLS_DARK_PAL_WARM="Ciepła — miękki brąz, łagodny dla oczu"
PLG_SYSTEM_MERTOOLS_DARK_PAL_DIM="Przygaszona — niski kontrast, najłagodniejsza"
PLG_SYSTEM_MERTOOLS_DARK_PAL_SEPIA="Sepia — ciemnobrązowy papier i kremowy tekst"
PLG_SYSTEM_MERTOOLS_DARK_PAL_CUSTOM="Własna — ustaw kolory poniżej"
PLG_SYSTEM_MERTOOLS_DARK_DEFAULT_LABEL="Domyślnie dla nowych odwiedzających"
PLG_SYSTEM_MERTOOLS_DARK_DEFAULT_DESC="Co widzi odwiedzający, który jeszcze nie dokonał wyboru. Automatyczny dostosowuje się do jego systemu (jasny lub ciemny). Zapamiętany wybór zawsze ma pierwszeństwo."
PLG_SYSTEM_MERTOOLS_DARK_DEFAULT_AUTO="Automatyczny — wg systemu odwiedzającego"
PLG_SYSTEM_MERTOOLS_DARK_DEFAULT_LIGHT="Jasny"
PLG_SYSTEM_MERTOOLS_DARK_DEFAULT_DARK="Ciemny"
PLG_SYSTEM_MERTOOLS_DARK_ACCENT_SITE_LABEL="Akcent jak w Gridbox"
PLG_SYSTEM_MERTOOLS_DARK_ACCENT_SITE_DESC="Zachowuje w trybie ciemnym kolor akcentu z Gridbox (kolor marki). Wyłącz, aby ustawić inny akcent dla trybu ciemnego."
PLG_SYSTEM_MERTOOLS_DARK_ACCENT_LABEL="Akcent trybu ciemnego"
PLG_SYSTEM_MERTOOLS_DARK_ACCENT_DESC="Kolor akcentu używany w trybie ciemnym, gdy akcent z Gridbox nie jest zachowany."
PLG_SYSTEM_MERTOOLS_DARK_TOGGLE_LABEL="Przycisk przełączania w nagłówku"
PLG_SYSTEM_MERTOOLS_DARK_TOGGLE_DESC="Pokazuje w nagłówku przycisk przełączania jasny/ciemny. Gdy jest wyłączony, motyw nadal działa według ustawienia domyślnego i zapamiętanego wyboru, tylko bez przycisku."
PLG_SYSTEM_MERTOOLS_DARK_PLACE_LABEL="Pozycja przycisku"
PLG_SYSTEM_MERTOOLS_DARK_PLACE_DESC="Gdzie stoi przycisk. Na szerokich ekranach w menu; na telefonach, gdzie menu jest schowane pod ikoną hamburgera, przycisk przenosi się obok tej ikony albo pływa w rogu ekranu, więc zawsze jest widoczny."
PLG_SYSTEM_MERTOOLS_DARK_PLACE_AUTO="Na końcu menu (automatycznie)"
PLG_SYSTEM_MERTOOLS_DARK_PLACE_START="Na początku menu"
PLG_SYSTEM_MERTOOLS_DARK_PLACE_END="Na końcu menu"
PLG_SYSTEM_MERTOOLS_DARK_PLACE_FLOAT="Pływający — prawy dolny róg (zawsze widoczny)"
PLG_SYSTEM_MERTOOLS_DARK_PLACE_FLOAT_LEFT="Pływający — lewy dolny róg"
PLG_SYSTEM_MERTOOLS_DARK_PLACE_A11Y_ABOVE="Pływający — nad przyciskiem ułatwień dostępu"
PLG_SYSTEM_MERTOOLS_DARK_PLACE_A11Y_BESIDE="Pływający — obok przycisku ułatwień dostępu"
PLG_SYSTEM_MERTOOLS_DARK_FLOAT_X_LABEL="Odstęp od boku"
PLG_SYSTEM_MERTOOLS_DARK_FLOAT_X_DESC="Liczba pikseli między pływającym przyciskiem a lewą lub prawą krawędzią ekranu."
PLG_SYSTEM_MERTOOLS_DARK_FLOAT_Y_LABEL="Odstęp od dołu"
PLG_SYSTEM_MERTOOLS_DARK_FLOAT_Y_DESC="Liczba pikseli między pływającym przyciskiem a dolną krawędzią ekranu."
PLG_SYSTEM_MERTOOLS_DARK_A11Y_LABEL="Przycisk ułatwień dostępu (zaawansowane)"
PLG_SYSTEM_MERTOOLS_DARK_A11Y_DESC="Selektor CSS przycisku ułatwień dostępu na stronie, nad którym lub obok którego stanie przełącznik. Domyślnie <code>._access-icon</code> (panel ułatwień dostępu po lewej). Jeśli nie zostanie znaleziony albo jest niewidoczny, przełącznik pływa w lewym dolnym rogu."
PLG_SYSTEM_MERTOOLS_DARK_MPLACE_LABEL="Położenie przełącznika na telefonach"
PLG_SYSTEM_MERTOOLS_DARK_MPLACE_DESC="Gdzie stoi przełącznik na wąskich ekranach (do szerokości podanej niżej). <strong>Jak na komputerze</strong> zostawia położenie ustawione wyżej. <strong>W elemencie strony</strong> wstawia przełącznik do elementu wskazanego selektorem CSS, np. kolumny nagłówka w wersji mobilnej."
PLG_SYSTEM_MERTOOLS_DARK_MPLACE_SAME="Jak na komputerze"
PLG_SYSTEM_MERTOOLS_DARK_MPLACE_BURGER="Obok przycisku menu (hamburgera)"
PLG_SYSTEM_MERTOOLS_DARK_MPLACE_SELECTOR="W elemencie strony (selektor CSS)"
PLG_SYSTEM_MERTOOLS_DARK_MPLACE_HIDDEN="Ukryty na telefonach"
PLG_SYSTEM_MERTOOLS_DARK_MBP_LABEL="Szerokość telefonu do (px)"
PLG_SYSTEM_MERTOOLS_DARK_MBP_DESC="Ekrany do tej szerokości używają położenia dla telefonów. Domyślnie 768 (telefony i małe tablety w Gridboksie)."
PLG_SYSTEM_MERTOOLS_DARK_MX_LABEL="Odstęp od boku na telefonach (px)"
PLG_SYSTEM_MERTOOLS_DARK_MY_LABEL="Odstęp od dołu na telefonach (px)"
PLG_SYSTEM_MERTOOLS_DARK_MSEL_LABEL="Element na przełącznik (selektor CSS)"
PLG_SYSTEM_MERTOOLS_DARK_MSEL_DESC="Selektor CSS elementu, do którego trafia przełącznik na telefonach, np. <code>header .ba-item-logo</code> albo <code>#pasek-mobilny</code>. Używany jest pierwszy widoczny pasujący element. Jeśli żaden nie pasuje, przełącznik pływa w prawym dolnym rogu."
PLG_SYSTEM_MERTOOLS_DARK_MINS_LABEL="Miejsce w elemencie"
PLG_SYSTEM_MERTOOLS_DARK_MINS_DESC="Gdzie stanie przełącznik względem wskazanego wyżej elementu."
PLG_SYSTEM_MERTOOLS_DARK_MINS_APPEND="W środku, na końcu"
PLG_SYSTEM_MERTOOLS_DARK_MINS_PREPEND="W środku, na początku"
PLG_SYSTEM_MERTOOLS_DARK_MINS_BEFORE="Przed elementem"
PLG_SYSTEM_MERTOOLS_DARK_MINS_AFTER="Za elementem"
PLG_SYSTEM_MERTOOLS_DARK_SIZE_LABEL="Rozmiar przycisku"
PLG_SYSTEM_MERTOOLS_DARK_SIZE_DESC="Szerokość i wysokość okrągłego przycisku w pikselach (24–96, domyślnie 44). Ikona ma około połowy tej wielkości."
PLG_SYSTEM_MERTOOLS_DARK_BORDER_LABEL="Obrys przycisku"
PLG_SYSTEM_MERTOOLS_DARK_BORDER_DESC="Cienka obwódka wokół przycisku zmiany trybu (i wokół kropek palet)."
PLG_SYSTEM_MERTOOLS_DARK_SHADOW_LABEL="Cień przycisku"
PLG_SYSTEM_MERTOOLS_DARK_SHADOW_DESC="Delikatny cień pod pływającym przyciskiem zmiany trybu i pod kropkami palet."
PLG_SYSTEM_MERTOOLS_DARK_SELECTOR_LABEL="Element nagłówka (zaawansowane)"
PLG_SYSTEM_MERTOOLS_DARK_SELECTOR_DESC="Selektor CSS nagłówka, do którego trafia przycisk. Domyślnie <code>header.header</code> (nagłówek Gridbox). Jeśli przycisk się nie pojawia, motyw może mieć inny nagłówek; zmień selektor. Gdy nic nie pasuje, przycisk pływa w dolnym rogu."
PLG_SYSTEM_MERTOOLS_DARK_TRANSITION_LABEL="Płynne przełączanie"
PLG_SYSTEM_MERTOOLS_DARK_TRANSITION_DESC="Płynne przejście kolorów przy przełączaniu między jasnym a ciemnym zamiast natychmiastowej zmiany."
PLG_SYSTEM_MERTOOLS_DARK_LOGO_LABEL="Logo w trybie ciemnym"
PLG_SYSTEM_MERTOOLS_DARK_LOGO_DESC="Wersja logo na ciemne tło (np. z jasnym napisem), wyświetlana zamiast logo strony w trybie ciemnym. Najlepiej SVG albo PNG/WebP z przezroczystym tłem, w tych samych proporcjach co zwykłe logo. Puste = zostaje zwykłe logo."
PLG_SYSTEM_MERTOOLS_DARK_LOGO_SEL_LABEL="Element logo (zaawansowane)"
PLG_SYSTEM_MERTOOLS_DARK_LOGO_SEL_DESC="Selektor CSS obrazka (lub obrazków) logo do podmiany. Domyślnie <code>header .ba-item-logo img</code> (element Logo Gridboxa w nagłówku). Kolejne dopisz po przecinku, np. <code>header .ba-item-logo img, footer .ba-item-logo img</code>."
PLG_SYSTEM_MERTOOLS_DARK_ADAPTIVE_LABEL="Dopasuj kolory strony"
PLG_SYSTEM_MERTOOLS_DARK_ADAPTIVE_DESC="Gridbox zapisuje część kolorów wprost w stylach sekcji i elementów (teksty, linki, nagłówki, tła nagłówka i akordeonów), więc sama ciemna paleta ich nie zmienia i tekst może stać się nieczytelny. Gdy ta opcja jest włączona, w trybie ciemnym jasne tła są przyciemniane, a zbyt ciemny tekst rozjaśniany tylko na tyle, żeby dało się go wygodnie czytać, z zachowaniem odcienia. Czytelne kolory marki zostają bez zmian, a motyw jasny się nie zmienia."
PLG_SYSTEM_MERTOOLS_DARK_VIVID_LABEL="Jaskrawe przyciski w trybie ciemnym"
PLG_SYSTEM_MERTOOLS_DARK_VIVID_DESC="Przyciski w jaskrawym kolorze marki (np. pomarańczowe „Skorzystaj z promocji”). <em>Obrys</em> rysuje je jak pozostałe dopasowane przyciski: ciemne tło palety i obwódka w ich kolorze. <em>Złagodzone</em> zostawia kolor, lekko przygaszony. <em>Bez zmian</em> zostawia je jak na jasnej stronie. Małe etykiety i duże kolorowe bloki zawsze zachowują swój kolor."
PLG_SYSTEM_MERTOOLS_DARK_VIVID_OUTLINE="Obrys — ciemne z obwódką w kolorze marki"
PLG_SYSTEM_MERTOOLS_DARK_VIVID_SOFT="Złagodzone — przygaszony kolor marki"
PLG_SYSTEM_MERTOOLS_DARK_VIVID_KEEP="Bez zmian"
PLG_SYSTEM_MERTOOLS_DARK_DIMMEDIA_LABEL="Wycisz jasne obrazy"
PLG_SYSTEM_MERTOOLS_DARK_DIMMEDIA_DESC="Lekko obniża jasność zdjęć i filmów w trybie ciemnym (logo i ikony SVG zostają bez zmian). Domyślnie wyłączone."
PLG_SYSTEM_MERTOOLS_DARK_CUSTOM_NOTE="Własna paleta — ciemna wartość każdej zmiennej koloru Gridbox. Puste pole = wartość domyślna pokazana obok."
PLG_SYSTEM_MERTOOLS_DARK_C_BG="Tło"
PLG_SYSTEM_MERTOOLS_DARK_C_SURFACE="Tło drugorzędne (karty, sekcje naprzemienne)"
PLG_SYSTEM_MERTOOLS_DARK_C_BGDARK="Najciemniejsze tło (sekcje już ciemne)"
PLG_SYSTEM_MERTOOLS_DARK_C_TITLE="Nagłówki"
PLG_SYSTEM_MERTOOLS_DARK_C_TEXT="Tekst"
PLG_SYSTEM_MERTOOLS_DARK_C_MUTED="Tekst przygaszony"
PLG_SYSTEM_MERTOOLS_DARK_C_MUTED_DESC="Kolor, np. półprzezroczysta biel rgba(232,236,243,.45)."
PLG_SYSTEM_MERTOOLS_DARK_C_BORDER="Obramowania"
PLG_SYSTEM_MERTOOLS_DARK_C_HOVER="Tło po najechaniu"
PLG_SYSTEM_MERTOOLS_DARK_C_SHADOW="Cień"
PLG_SYSTEM_MERTOOLS_DARK_C_SHADOW_DESC="Kolor, np. rgba(0,0,0,.5)."
PLG_SYSTEM_MERTOOLS_DARK_TO_DARK="Przełącz na tryb ciemny"
PLG_SYSTEM_MERTOOLS_DARK_TO_LIGHT="Przełącz na tryb jasny"

; Database: indexes of Gridbox tables (0.0.26)
PLG_SYSTEM_MERTOOLS_FIELDSET_DB="Baza danych"
PLG_SYSTEM_MERTOOLS_DB_INDEXES_LABEL="Indeksy tabel Gridboxa"
PLG_SYSTEM_MERTOOLS_DB_INDEXES_DESC="Gridbox tworzy swoje tabele tylko z kluczem głównym, więc wyszukiwanie danych produktu, kategorii, tagów i koszyka przegląda za każdym razem całą tabelę. MerTools zakłada 8 zwykłych indeksów (nazwy idx_mt_…) i pilnuje ich: sprawdza je po instalacji lub aktualizacji Gridboxa i MerTools oraz raz na dobę, a brakujące zakłada ponownie. Indeks, który Gridbox kiedyś doda sam na tej samej kolumnie, też się liczy. Indeksy nie zmieniają danych. Na merserwis.pl zapytanie indeksu wyszukiwarki trwało 6 s, z indeksem ok. 0,3 s."
PLG_SYSTEM_MERTOOLS_DB_INDEXES_PANEL_LABEL="Stan indeksów"
PLG_SYSTEM_MERTOOLS_DB_INDEXES_PANEL_DESC="Stan każdego indeksu teraz. Przycisk od razu zakłada brakujące (przy dużych tabelach może to potrwać kilka sekund, strona działa w tym czasie normalnie)."
PLG_SYSTEM_MERTOOLS_DBIDX_UI_TABLE="Tabela"
PLG_SYSTEM_MERTOOLS_DBIDX_UI_COLUMN="Kolumna"
PLG_SYSTEM_MERTOOLS_DBIDX_UI_STATE="Stan"
PLG_SYSTEM_MERTOOLS_DBIDX_UI_OK="jest"
PLG_SYSTEM_MERTOOLS_DBIDX_UI_OK_OTHER="jest (indeks %s)"
PLG_SYSTEM_MERTOOLS_DBIDX_UI_MISSING="brak"
PLG_SYSTEM_MERTOOLS_DBIDX_UI_NO_TABLE="brak tabeli (ta część Gridboxa nie jest używana)"
PLG_SYSTEM_MERTOOLS_DBIDX_UI_FIX="Sprawdź i załóż brakujące"
PLG_SYSTEM_MERTOOLS_DBIDX_UI_FIXED="Założone indeksy: %d."
PLG_SYSTEM_MERTOOLS_DBIDX_UI_NOTHING="Wszystkie indeksy są na miejscu."
PLG_SYSTEM_MERTOOLS_DBIDX_UI_FAILED="Nie udało się założyć:"
PLG_SYSTEM_MERTOOLS_DBIDX_UI_LOADING="Sprawdzanie…"
PLG_SYSTEM_MERTOOLS_DBIDX_UI_ERROR="Nie udało się sprawdzić indeksów."

; Page layout: tabs as expandable sections on phones (0.0.27)
PLG_SYSTEM_MERTOOLS_TABS_LINKS_LABEL="Link do zakładki w adresie"
PLG_SYSTEM_MERTOOLS_TABS_LINKS_DESC="Kliknięcie zakładki opisu (np. „Dane techniczne”) dopisuje jej nazwę do adresu strony: ?dane_techniczne — bez przeładowania strony. Skopiowany adres otwiera stronę od razu na tej zakładce i przewija do niej (na telefonie rozwija tę sekcję). Nazwa powstaje z tytułu zakładki: małe litery bez polskich znaków, spacje jako „_”. Pamięć stron MerTools obsługuje takie adresy jak zwykłą stronę."
PLG_SYSTEM_MERTOOLS_TABS_ACC_LABEL="Zakładki na telefonie jako sekcje rozwijane"
PLG_SYSTEM_MERTOOLS_TABS_ACC_DESC="Na wąskim ekranie pasek zakładek Gridboxa nie mieści się i trzeba go przewijać w bok, a odwiedzający nie widzi, że są kolejne zakładki. Tu na telefonie każda zakładka staje się wierszem z ikoną, nazwą i strzałką, a jej treść rozwija się pod nim. Na komputerze zakładki zostają bez zmian. Dotyczy wszystkich modułów zakładek."
PLG_SYSTEM_MERTOOLS_TABS_ACC_WIDTH_LABEL="Do szerokości ekranu (px)"
PLG_SYSTEM_MERTOOLS_TABS_ACC_WIDTH_DESC="Do tej szerokości ekranu zakładki są pokazywane jako sekcje rozwijane. 768 obejmuje telefony i tablety trzymane pionowo."
PLG_SYSTEM_MERTOOLS_TABS_ACC_FIRST_LABEL="Pierwsza sekcja otwarta"
PLG_SYSTEM_MERTOOLS_TABS_ACC_FIRST_DESC="Nie (domyślnie): na początku widać tylko listę nazw, wszystkie sekcje są zwinięte. Tak: od razu widać treść pierwszej zakładki (jak na komputerze)."
PLG_SYSTEM_MERTOOLS_HELP="Objaśnienie"
PLG_SYSTEM_MERTOOLS_SPEED_WEBP_LABEL="Obrazki w rozmiarze ekranu (WebP)"
PLG_SYSTEM_MERTOOLS_SPEED_WEBP_DESC="Zdjęcia są często dużo większe, niż są pokazywane: zdjęcie 1200 px i 400 KB w kolumnie szerokiej na 400 px na telefonie. MerTools robi lżejsze kopie WebP każdego obrazka JPEG i PNG tej strony w kilku szerokościach (480, 768, 1080, 1440, 1920 px — nigdy szersze od oryginału), a strona je podaje (srcset): każda przeglądarka bierze tę, która pasuje do jej ekranu, zwykle 5–10× lżejszą. Oryginały nie są zmieniane i zostają na zapas. Kopie robi PHP (GD) po wysłaniu strony, po kilka naraz, więc nikt na nie nie czeka; pierwsze wizyty dostają jeszcze oryginały. Kopie leżą w media/mertools-img."
PLG_SYSTEM_MERTOOLS_SPEED_GIF_LABEL="Ciężkie animacje GIF: najpierw pierwsza klatka"
PLG_SYSTEM_MERTOOLS_SPEED_GIF_DESC="Animowany GIF na górze strony (ponad 150 KB) jest zwykle największym elementem i na telefonie wczytuje się wiele sekund — PageSpeed liczy od niego LCP. Tu jego pierwsza klatka pokazuje się od razu jako mały obrazek WebP, a animacja wczytuje się po załadowaniu strony, gdy przeglądarka ma wolną chwilę. Wskazówka: GIF zamieniony na animowany WebP jest zwykle dużo lżejszy — połóż go obok GIF-a pod tą samą nazwą (np. animacja.webp obok animacja.gif), a MerTools użyje go do animacji."
PLG_SYSTEM_MERTOOLS_SPEED_IMAGES_PANEL_LABEL="Kopie obrazków"
PLG_SYSTEM_MERTOOLS_SPEED_IMAGES_PANEL_DESC="Obrazki z kopiami, obrazki czekające na kopie i miejsce, które zajmują kopie. „Zrób kopie teraz” robi czekające od razu (około 20 sekund pracy; kliknij jeszcze raz, jeśli część dalej czeka). „Usuń wszystkie kopie” kasuje je; strony wracają do oryginalnych obrazków, a kopie powstaną na nowo przy kolejnych wizytach."
PLG_SYSTEM_MERTOOLS_SPEED_ICONS_LABEL="Style ikon nie wstrzymują strony"
PLG_SYSTEM_MERTOOLS_SPEED_ICONS_DESC="Arkusze stylów czcionek z ikonami (Font Awesome, Material Icons, biblioteki ikon Gridboxa) wczytują się równolegle ze stroną, a nie przed nią: tekst i obrazki pokazują się szybciej (FCP), ikony chwilę później. Wyłącz, jeśli na Twojej stronie brak ikony przez tę chwilę przeszkadza."
PLG_SYSTEM_MERTOOLS_SPEED_CACHE_PANEL_DESC="Strony i odpowiedzi Gridboxa zapisane w pamięci, miejsce, które zajmują, i kiedy pamięć była ostatnio czyszczona. „Wyczyść pamięć stron” usuwa wszystko; strony zapiszą się na nowo przy kolejnych wizytach."
PLG_SYSTEM_MERTOOLS_SPEED_PANEL_DESC="Wyniki PageSpeed adresów podanych wyżej, dla telefonu i komputera: mierzone z Twojej przeglądarki przez Google PageSpeed Insights (potrzebny klucz API powyżej). Ustaw pomiar jako punkt odniesienia, żeby porównywać z nim kolejne zmiany."
PLG_SYSTEM_MERTOOLS_DARK_PREVIEW_DESC="Jak wybrana paleta i natężenie wyglądają na typowych elementach Gridboxa, jeszcze przed zapisaniem."
PLG_SYSTEM_MERTOOLS_DARK_C_BG_DESC="Główne tło strony w trybie ciemnym (zmienna Gridboxa --bg-primary)."
PLG_SYSTEM_MERTOOLS_DARK_C_SURFACE_DESC="Tło kart, ramek i sekcji naprzemiennych (--bg-secondary)."
PLG_SYSTEM_MERTOOLS_DARK_C_BGDARK_DESC="Tło sekcji, które już w jasnym motywie są ciemne (--bg-dark)."
PLG_SYSTEM_MERTOOLS_DARK_C_TITLE_DESC="Kolor nagłówków (--title)."
PLG_SYSTEM_MERTOOLS_DARK_C_TEXT_DESC="Kolor tekstu (--text)."
PLG_SYSTEM_MERTOOLS_DARK_C_BORDER_DESC="Kolor linii i obramowań (--border)."
PLG_SYSTEM_MERTOOLS_DARK_C_HOVER_DESC="Tło linków i przycisków pod kursorem (--hover)."
PLG_SYSTEM_MERTOOLS_IMG_UI_READY="Obrazki z kopiami"
PLG_SYSTEM_MERTOOLS_IMG_UI_PENDING="Czekają na kopie"
PLG_SYSTEM_MERTOOLS_IMG_UI_SKIPPED="Bez zmian (małe, GIF bez animacji, za duże)"
PLG_SYSTEM_MERTOOLS_IMG_UI_FAILED="Nie dało się odczytać"
PLG_SYSTEM_MERTOOLS_IMG_UI_FILES="Kopie"
PLG_SYSTEM_MERTOOLS_IMG_UI_RUN="Zrób kopie teraz"
PLG_SYSTEM_MERTOOLS_IMG_UI_RUN_DONE="Gotowe: każdy obrazek widziany na stronach ma swoje kopie."
PLG_SYSTEM_MERTOOLS_IMG_UI_RUN_MORE="Część zrobiona; czeka jeszcze %s — kliknij ponownie albo powstaną przy kolejnych wizytach."
PLG_SYSTEM_MERTOOLS_IMG_UI_CLEAR="Usuń wszystkie kopie"
PLG_SYSTEM_MERTOOLS_IMG_UI_CLEAR_CONFIRM="Usunąć wszystkie kopie obrazków? Strony wrócą do oryginalnych obrazków, dopóki nie powstaną nowe kopie."
PLG_SYSTEM_MERTOOLS_IMG_UI_CLEARED="Usunięte. Pamięć stron też została wyczyszczona."
PLG_SYSTEM_MERTOOLS_IMG_UI_NO_GD="PHP na tym serwerze nie ma GD z WebP: kopii nie da się tu zrobić (poproś hosting o włączenie)."
PLG_SYSTEM_MERTOOLS_IMG_UI_LOADING="Wczytywanie…"
PLG_SYSTEM_MERTOOLS_IMG_UI_ERROR="Nie udało się odczytać stanu kopii."
PLG_SYSTEM_MERTOOLS_SPEED_POPUPS_LABEL="Okienka (popupy) po pierwszym ruchu"
PLG_SYSTEM_MERTOOLS_SPEED_POPUPS_DESC="Okienko Gridboxa ustawione do otwarcia po czasie (wyzwalacz „Time delay”) otwiera się w tym czasie, ale nie wcześniej niż po pierwszym ruchu odwiedzającego — przewinięciu, dotknięciu, ruchu myszą albo naciśnięciu klawisza; jeśli czas już minął, otwiera się od razu przy tym ruchu. Duże okienko otwarte, gdy ktoś dopiero ogląda stronę, staje się jej największym elementem i Google liczy od niego czas wczytania (LCP) u prawdziwych odwiedzających; na telefonach Google uznaje też okienko przed jakąkolwiek interakcją za natarczywe. Okienka otwierane przy przewijaniu lub przy opuszczaniu strony oraz informacja o cookies Gridboxa zostają bez zmian."
PLG_SYSTEM_MERTOOLS_LAYOUT_ROWS_LABEL="Slidery postów w kilku rzędach"
PLG_SYSTEM_MERTOOLS_LAYOUT_ROWS_DESC="Gridbox pokazuje posty slidera (Recent posts slider, Related posts slider, Recently viewed products) tylko w jednym rzędzie. Tu slider może mieć 2, 3 lub 4 rzędy: w Gridboxie otwórz ustawienia slidera i wpisz w polu <strong>Class suffix</strong> np. <code>mt-rows-2</code> (dwa rzędy na każdym ekranie). Inna liczba rzędów na mniejszych ekranach: <code>mt-rows-tablet-N</code> (do 1024 px) i <code>mt-rows-phone-N</code> (do 768 px), np. <code>mt-rows-3 mt-rows-tablet-2 mt-rows-phone-1</code>. Posty wypełniają rzędy po kolei (pierwszy rząd 1 2 3, drugi 4 5 6), a slider przesuwa się jak dotąd — strzałki, kropki i autoodtwarzanie działają tak, jak ustawiono w Gridboxie. Slidery bez takiej klasy zostają bez zmian."
PLG_SYSTEM_MERTOOLS_LAYOUT_ROWS_NOTE_LABEL="Jak ustawić rzędy slidera"
PLG_SYSTEM_MERTOOLS_LAYOUT_ROWS_NOTE="<ol class='mb-2'><li>W Gridboxie otwórz stronę ze sliderem i kliknij slider (<em>Recent posts slider</em>, <em>Related posts slider</em> albo <em>Recently viewed products</em>), żeby otworzyć jego ustawienia.</li><li>Przejdź do zakładki <strong>Advanced</strong> (Zaawansowane) i wpisz klasy w polu <strong>Class Suffix</strong> (Przyrostek klasy) — oddzielone spacjami, obok klas, które już tam są.</li><li>Zapisz stronę w Gridboxie. Jeśli pamięć stron MerTools jest włączona (zakładka <em>Szybkość strony</em>), kliknij <em>Wyczyść pamięć stron</em>, żeby odwiedzający od razu zobaczyli nowy układ.</li></ol><table class='table table-sm mb-1'><thead><tr><th>Class Suffix</th><th>Efekt</th></tr></thead><tbody><tr><td><code>mt-rows-2</code></td><td>2 rzędy na każdym ekranie (<code>mt-rows-3</code>, <code>mt-rows-4</code>: 3 lub 4 rzędy)</td></tr><tr><td><code>mt-rows-tablet-N</code></td><td>N rzędów na ekranach do 1024 px</td></tr><tr><td><code>mt-rows-phone-N</code></td><td>N rzędów na ekranach do 768 px</td></tr><tr><td><code>mt-rows-3 mt-rows-tablet-2 mt-rows-phone-1</code></td><td>3 rzędy na komputerze, 2 na tablecie, 1 na telefonie</td></tr></tbody></table><p class='mb-0'>Liczba widocznych kolumn i sposób przesuwania (strzałki, kropki, autoodtwarzanie) zostają takie, jak ustawiono w Gridboxie; posty wypełniają rzędy po kolei — pierwszy rząd 1 2 3, drugi 4 5 6.</p>"
PLG_SYSTEM_MERTOOLS_SPEED_CHECKS_LABEL="Zalecane ustawienia"
PLG_SYSTEM_MERTOOLS_SPEED_CHECKS_DESC="Ustawienia Gridboxa, Joomli, serwera i Cloudflare, przy których MerTools działa najlepiej: jak jest teraz, jak powinno być, dlaczego i gdzie to zmienić. Stan jest odczytywany przy otwarciu tej strony; „Sprawdź ponownie” odczytuje go na nowo po zmianie."

; MerTools for Gridbox — ustawienia wtyczki (pl-PL)

PLG_SYSTEM_MERTOOLS_XML_DESCRIPTION="MerTools for Gridbox — zestaw poprawek i optymalizacji dla Balbooa Gridbox, których nie da się zrobić w samych ustawieniach Gridbox. Każda z nich to osobne narzędzie do włączenia lub wyłączenia. Pliki rdzenia Gridbox nie są zmieniane, więc aktualizacje Gridbox instalują się bez problemu."

PLG_SYSTEM_MERTOOLS_INTRO_LABEL="MerTools for Gridbox"
PLG_SYSTEM_MERTOOLS_INTRO_DESC="Poprawki i optymalizacje dla Balbooa Gridbox, których nie da się zrobić w samych ustawieniach Gridbox. Każda zakładka niżej to jedno narzędzie, które można włączyć lub wyłączyć. Pliki rdzenia Gridbox nie są zmieniane. Problemy zgłaszaj na GitHubie."

PLG_SYSTEM_MERTOOLS_FIELDSET_URL="Kanoniczny adres URL"
PLG_SYSTEM_MERTOOLS_URL_NOTE="Gridbox otwiera stronę niezależnie od liczby ukośników w adresie — <code>/oferta</code>, <code>//oferta</code> i <code>//////oferta</code> pokazują tę samą stronę ze statusem 200. Wyszukiwarki widzą wtedy kilka adresów jednej strony (duplicate content). To narzędzie przekierowuje każdy taki adres na jeden czysty adres."

PLG_SYSTEM_MERTOOLS_URL_COLLAPSE_LABEL="Scalaj powielone ukośniki"
PLG_SYSTEM_MERTOOLS_URL_COLLAPSE_DESC="Przekierowuje każdy adres, który ma w ścieżce więcej niż jeden ukośnik z rzędu, na adres z pojedynczymi ukośnikami (np. <code>//////oferta/mierniki</code> &rarr; <code>/oferta/mierniki</code>). Zmieniana jest tylko ścieżka; część po <code>?</code> zostaje bez zmian, a adres zawsze pozostaje w obrębie tej strony."

PLG_SYSTEM_MERTOOLS_URL_CODE_LABEL="Rodzaj przekierowania"
PLG_SYSTEM_MERTOOLS_URL_CODE_DESC="301 (trwałe) informuje wyszukiwarki, że właściwy jest czysty adres, i przenosi na niego pozycję w wynikach — zalecane. 302 (tymczasowe) nie przenosi pozycji; używaj go tylko podczas testów."
PLG_SYSTEM_MERTOOLS_URL_CODE_301="301 — trwałe (zalecane)"
PLG_SYSTEM_MERTOOLS_URL_CODE_302="302 — tymczasowe"

PLG_SYSTEM_MERTOOLS_URL_CF_NOTE="<strong>Adres wciąż otwiera się z powielonymi ukośnikami i nie przekierowuje?</strong> To znaczy, że strona stoi za Cloudflare (albo innym CDN/proxy), które czyści adres <em>zanim</em> trafi on na serwer &mdash; samo scala nadmiarowe ukośniki, więc ta wtyczka nigdy ich nie widzi i nie ma czego przekierować. Przekierowanie trzeba wtedy ustawić w Cloudflare, bo tylko tam znany jest jeszcze oryginalny adres. <details><summary><strong>Ustawienie w Cloudflare &mdash; krok po kroku</strong></summary><ol><li>Zaloguj się na <code>dash.cloudflare.com</code> i wybierz domenę.</li><li>Wejdź w <strong>Rules &rarr; Redirect Rules</strong> i kliknij <strong>Create rule</strong>.</li><li>Nazwa reguły, np. <em>Scalanie powielonych ukośników</em>.</li><li>W sekcji <strong>When incoming requests match</strong> przełącz na <strong>Edit expression</strong> i wklej:<br><code>(raw.http.request.uri ne http.request.uri and (http.request.method eq &quot;GET&quot; or http.request.method eq &quot;HEAD&quot;))</code></li><li>W sekcji <strong>Then</strong> ustaw <strong>Type = Dynamic</strong> oraz <strong>wyrażenie URL</strong>:<br><code>concat(&quot;https://&quot;, http.host, http.request.uri)</code></li><li>Kod statusu <strong>301</strong>; <strong>Preserve query string = wyłączone</strong>.</li><li>Kliknij <strong>Deploy</strong>.</li><li>Jeśli nadal nie przekierowuje, wejdź w <strong>Rules &rarr; Settings &rarr; URL Normalization</strong> i włącz <em>Normalize incoming URLs</em>.</li></ol>Sprawdź, otwierając <code>https://twoja-strona/////oferta</code> &mdash; powinno zwrócić 301 na adres z pojedynczymi ukośnikami. Nie trzeba płatnego planu: reguła nie używa wyrażeń regularnych. Zostaw też włączone to narzędzie wtyczki &mdash; nadal obsłuży żądania, które trafią wprost na serwer.</details>"

; --- Tryb ciemny ---
PLG_SYSTEM_MERTOOLS_FIELDSET_SPEED="Szybkość strony"
PLG_SYSTEM_MERTOOLS_SPEED_KEY_LABEL="Klucz API PageSpeed Insights"
PLG_SYSTEM_MERTOOLS_SPEED_KEY_DESC="Klucz z Google Cloud Console (Interfejsy API i usługi → Dane logowania → Utwórz dane logowania → Klucz interfejsu API), najlepiej ograniczony do PageSpeed Insights API. Bez klucza Google często odmawia pomiaru, bo wspólny darmowy limit jest wyczerpany. Klucz widzą tylko administratorzy, a pomiar idzie z ich przeglądarki."
PLG_SYSTEM_MERTOOLS_SPEED_URLS_LABEL="Mierzone strony"
PLG_SYSTEM_MERTOOLS_SPEED_URLS_DESC="Jedna strona w wierszu: ścieżka na tej stronie (np. <code>/</code>, <code>/oferta/…</code>) albo pełny adres zaczynający się od <code>https://</code>, także innej strony do porównania. Najwyżej 10. Każda jest mierzona na telefonie i komputerze."
PLG_SYSTEM_MERTOOLS_SPEED_RUNS_LABEL="Pomiary na stronę"
PLG_SYSTEM_MERTOOLS_SPEED_RUNS_DESC="Wynik PageSpeed Insights waha się o kilka punktów między pomiarami. Przy 3 lub 5 pomiarach zapisywana jest mediana, więc porównanie przed i po jest uczciwsze."
PLG_SYSTEM_MERTOOLS_SPEED_TOOLS_NOTE_LABEL="Przyspieszanie strony"
PLG_SYSTEM_MERTOOLS_SPEED_TOOLS_NOTE_DESC="Poniższe narzędzia zmieniają gotowy kod strony, gdy Gridbox go już przygotował. Pliki Gridboxa nie są zmieniane. Każde można wyłączyć. Po zmianie zrób pomiar, a panel pokaże różnicę."
PLG_SYSTEM_MERTOOLS_SPEED_IMAGES_LABEL="Obrazki bez czekania i bez skakania"
PLG_SYSTEM_MERTOOLS_SPEED_IMAGES_DESC="Obrazki pokazują się bez czekania, a strona nie skacze, gdy się wczytują. Każdy obrazek tej strony dostaje proporcje odczytane z pliku, więc miejsce na niego jest zarezerwowane, zanim się wczyta (Gridbox daje obrazkom rozmiar 100×100; wymiary na stronie zostają takie, jakie ustawia Gridbox). Logo, nagłówek i pierwsza sekcja strony (do 4 obrazków) wczytują się od razu, największy z nich w pierwszej kolejności; obrazki niżej przeglądarka wczytuje sama, gdy odwiedzający się do nich zbliża. Gdy w Gridboxie jest włączone leniwe ładowanie, obrazki od razu mają prawdziwy adres zamiast zastępczego wczytywanego skryptem; obrazki w menu wczytuje Gridbox jak dotąd. Piksele śledzące i obrazki z innych stron zostają bez zmian."
PLG_SYSTEM_MERTOOLS_SPEED_SHOW_LABEL="Strona widoczna od razu"
PLG_SYSTEM_MERTOOLS_SPEED_SHOW_DESC="Gdy w Gridboxie jest włączone „Deferred Loading” (Ustawienia → Wydajność), Gridbox przenosi style na koniec strony i ukrywa całą stronę, dopóki nie wykonają się wszystkie jego skrypty. Na telefonie to kilka sekund pustego ekranu i niski wynik PageSpeed (FCP, LCP). Tu style wracają do nagłówka strony i strona jest widoczna od razu, a skrypty dalej ładują się na końcu. Bez „Deferred Loading” nic się nie zmienia."
PLG_SYSTEM_MERTOOLS_SPEED_MAINPHOTO_LABEL="Główne zdjęcie produktu od razu"
PLG_SYSTEM_MERTOOLS_SPEED_MAINPHOTO_DESC="Pierwsze zdjęcie w pokazie slajdów produktu jest widoczne od razu (Gridbox ukrywa je, dopóki nie zadziała jego skrypt), a przeglądarka pobiera je w pierwszej kolejności. To zwykle największy element strony produktu, od którego Google liczy LCP."
PLG_SYSTEM_MERTOOLS_SPEED_SLIDEIMG_LABEL="Zdjęcia produktu dla wyszukiwarek"
PLG_SYSTEM_MERTOOLS_SPEED_SLIDEIMG_DESC="Gridbox pokazuje zdjęcia w pokazie slajdów produktu jako tła CSS: bez znacznika &lt;img&gt; i bez tekstu alternatywnego, więc nie trafiają do Grafiki Google, a przeglądarka odkrywa je późno. W każdy slajd trafia prawdziwy obrazek o tym samym adresie, z nazwą produktu jako tekstem alternatywnym (kolejne: „Nazwa – zdjęcie 2”), położony dokładnie na tle: wygląda tak samo, a kliknięcia, powiększenie i przesuwanie dalej obsługuje Gridbox. Tło zostaje (czyta je powiększenie Gridboxa); po wyborze innego wariantu produktu Gridbox buduje pokaz od nowa, już bez obrazków. Telefony pobierają tę samą lżejszą kopię co dla tła, więc zdjęcie nie pobiera się dwa razy. Tylko pokazy slajdów produktów."
PLG_SYSTEM_MERTOOLS_SPEED_VIDEO_LABEL="Film YouTube w tle po wczytaniu strony"
PLG_SYSTEM_MERTOOLS_SPEED_VIDEO_DESC="Film w tle sekcji (np. na stronie głównej) nadal startuje sam, ale dopiero po pierwszym ruchu myszy, przewinięciu lub dotknięciu albo po podanej liczbie sekund od wczytania strony. Do tego czasu sekcja wygląda tak jak teraz w trakcie ładowania. Strona nie czeka na odtwarzacz YouTube (ok. 1 MB skryptów i kilka MB wideo)."
PLG_SYSTEM_MERTOOLS_SPEED_VIDEO_DELAY_LABEL="Start filmu najpóźniej po (sekundach)"
PLG_SYSTEM_MERTOOLS_SPEED_VIDEO_DELAY_DESC="Liczone od wczytania strony, jeśli odwiedzający wcześniej niczego nie dotknie. 0: zaraz po wczytaniu."
PLG_SYSTEM_MERTOOLS_SPEED_VIDEO_PHONE_LABEL="Na telefonach"
PLG_SYSTEM_MERTOOLS_SPEED_VIDEO_PHONE_DESC="Co zamiast filmu na małych ekranach i przy włączonym oszczędzaniu danych. Bez filmu telefon pobiera ok. 1 MB mniej, a strona szybciej reaguje. Zdjęcie w miejsce filmu staje się największym elementem ekranu, więc Google liczy LCP od chwili jego pojawienia się. Na merserwis.pl w teście LCP pogorszył się wtedy o ok. 1–2 s. Bez filmu LCP się nie zmienia."
PLG_SYSTEM_MERTOOLS_SPEED_VIDEO_PHONE_NONE="Bez filmu, sekcja w kolorze tła (zalecane)"
PLG_SYSTEM_MERTOOLS_SPEED_VIDEO_PHONE_IMAGE="Zdjęcie zamiast filmu"
PLG_SYSTEM_MERTOOLS_SPEED_VIDEO_PHONE_VIDEO="Film tak jak na komputerze"
PLG_SYSTEM_MERTOOLS_SPEED_VIDEO_PHONE_WIDTH_LABEL="Telefon to ekran do (px)"
PLG_SYSTEM_MERTOOLS_SPEED_VIDEO_PHONE_WIDTH_DESC="Szerokość okna przeglądarki, do której stosowane jest ustawienie dla telefonów. Domyślnie 768."
PLG_SYSTEM_MERTOOLS_SPEED_VIDEO_PHONE_COLOR_LABEL="Kolor tła zamiast filmu"
PLG_SYSTEM_MERTOOLS_SPEED_VIDEO_PHONE_COLOR_DESC="Pod filmem Gridbox ma zwykle jasne tło, na którym biały tekst sekcji byłby nieczytelny. Ten kolor leży pod nakładką sekcji (gradientem), tak jak wcześniej film. Ciemny pasuje do jasnego tekstu."
PLG_SYSTEM_MERTOOLS_SPEED_VIDEO_PHONE_PIC_LABEL="Zdjęcie"
PLG_SYSTEM_MERTOOLS_SPEED_VIDEO_PHONE_PIC_DESC="Zdjęcie w tle sekcji zamiast filmu. Puste: klatka filmu z YouTube (miniatura 480×360). Najlepiej lekki plik (WebP lub JPG do ok. 60 KB)."
PLG_SYSTEM_MERTOOLS_SPEED_SCRIPTS_LABEL="Skrypty marketingowe przy pierwszym ruchu"
PLG_SYSTEM_MERTOOLS_SPEED_SCRIPTS_DESC="Google Tag Manager, Analytics, reklamy Google, piksel Facebooka, Clarity i podobne uruchamiają się przy pierwszym ruchu myszy, przewinięciu, dotknięciu lub naciśnięciu klawisza, a nie podczas ładowania strony. Strona szybciej się pokazuje i reaguje. Uwaga: wizyta osoby, która wyjdzie bez żadnego ruchu, nie trafi do statystyk ani reklam."
PLG_SYSTEM_MERTOOLS_SPEED_SCRIPTS_LIST_LABEL="Opóźniaj skrypty zawierające"
PLG_SYSTEM_MERTOOLS_SPEED_SCRIPTS_LIST_DESC="Jeden fragment w wierszu: skrypt, którego adres albo treść zawiera taki fragment, czeka na pierwszy ruch. Kolejność skryptów zostaje zachowana."
PLG_SYSTEM_MERTOOLS_SPEED_SCRIPTS_KEEP_LABEL="Nigdy nie opóźniaj skryptów zawierających"
PLG_SYSTEM_MERTOOLS_SPEED_SCRIPTS_KEEP_DESC="Np. baner zgody na pliki cookie, który musi pojawić się od razu."
PLG_SYSTEM_MERTOOLS_SPEED_SCRIPTS_TIMEOUT_LABEL="Uruchom najpóźniej po (sekundach)"
PLG_SYSTEM_MERTOOLS_SPEED_SCRIPTS_TIMEOUT_DESC="0: tylko przy pierwszym ruchu. Inna wartość: także po tylu sekundach od wczytania strony, nawet bez ruchu (wtedy statystyki obejmą też takie wizyty, ale test Google może je zauważyć)."
PLG_SYSTEM_MERTOOLS_SPEED_CACHE_NOTE_LABEL="Pamięć podręczna stron"
PLG_SYSTEM_MERTOOLS_SPEED_CACHE_NOTE_DESC="Gridbox buduje każdą stronę od nowa przy każdej wizycie. Na merserwis.pl trwa to 2–4 s, zanim przeglądarka dostanie pierwszy bajt. Gość niezalogowany dostaje jednak tę samą stronę co każdy inny gość. Gotowa strona jest więc zapisywana w pliku, a kolejni goście dostają ją od razu. Token formularzy i nonce są podstawiane osobno dla każdego odwiedzającego. Pamięć jest czyszczona przy każdym zapisie w Joomli lub w edytorze Gridboxa, przy nowym zamówieniu, płatności, komentarzu lub opinii oraz po upływie ustawionego czasu."
PLG_SYSTEM_MERTOOLS_SPEED_CACHE_LABEL="Strony z pamięci dla gości"
PLG_SYSTEM_MERTOOLS_SPEED_CACHE_DESC="Nigdy z pamięci: zalogowani, adresy z parametrami (wyszukiwanie, filtry; znaczniki kampanii utm_*, gclid, fbclid nie przeszkadzają), osoby z produktami w koszyku, listą życzeń, inną walutą lub rozpoczętym zamówieniem, strony z formularzem zamówienia, logowania, listy życzeń lub zgłoszenia. Strona produktu z „Ostatnio oglądanymi produktami” trafia z pamięci tylko do osób, które nie oglądały innego produktu. Liczniki odsłon Gridboxa nadal rosną. Odpowiedź z pamięci ma nagłówek X-MerTools-Cache: HIT."
PLG_SYSTEM_MERTOOLS_SPEED_CACHE_DATA_LABEL="Dane Gridboxa z pamięci"
PLG_SYSTEM_MERTOOLS_SPEED_CACHE_DATA_DESC="Przed pokazaniem każdej strony skrypt Gridboxa pobiera z serwera ustawienia jej elementów i swoje teksty. To dwa osobne zapytania do Joomli, po 0,4–0,5 s każde, a strona czeka na nie, zanim cokolwiek pokaże. Ich adresy zawierają czas ostatniej zmiany strony, więc można je bezpiecznie trzymać w pamięci. Działa niezależnie od pamięci stron."
PLG_SYSTEM_MERTOOLS_SPEED_CACHE_TTL_LABEL="Trzymaj najwyżej (minut)"
PLG_SYSTEM_MERTOOLS_SPEED_CACHE_TTL_DESC="Po tym czasie strona jest budowana od nowa, nawet bez żadnej zmiany. Chroni przed zmianami, o których MerTools się nie dowie (np. import cen poza Joomlą). Od 5 do 1440, domyślnie 240."
PLG_SYSTEM_MERTOOLS_SPEED_CACHE_EXCLUDE_LABEL="Nie zapisuj stron, których adres zawiera"
PLG_SYSTEM_MERTOOLS_SPEED_CACHE_EXCLUDE_DESC="Jeden fragment adresu w wierszu, np. <code>/zamowienie</code>. Strony zamówienia, logowania, listy życzeń i zgłoszeń są pomijane same."
PLG_SYSTEM_MERTOOLS_SPEED_CACHE_COOKIES_LABEL="Bez pamięci dla osób z ciasteczkiem"
PLG_SYSTEM_MERTOOLS_SPEED_CACHE_COOKIES_DESC="Jedna nazwa w wierszu. Dodatkowo do ciasteczek koszyka, listy życzeń, waluty, zamówienia i autora komentarza Gridboxa, które są sprawdzane zawsze."
PLG_SYSTEM_MERTOOLS_SPEED_CACHE_MAX_LABEL="Najwięcej zapisanych stron"
PLG_SYSTEM_MERTOOLS_SPEED_CACHE_MAX_DESC="Powyżej tej liczby co godzinę usuwane są najstarsze. Strona zajmuje zwykle 40–80 KB."
PLG_SYSTEM_MERTOOLS_SPEED_WARM_LABEL="Podgrzewaj pamięć stron"
PLG_SYSTEM_MERTOOLS_SPEED_WARM_DESC="Strony z mapy strony, których nie ma w pamięci (jeszcze nie zapisane, wygasłe albo wyczyszczone po zmianie), są w tle odwiedzane jak gość, żeby pierwszy odwiedzający nie czekał na ich zbudowanie. Co minutę, po wysłaniu odpowiedzi odwiedzającemu, tylko tam, gdzie serwer na to pozwala (PHP-FPM, LiteSpeed). Najpierw strona główna i strony główne działów; strony wykluczone z pamięci są pomijane. Adres serwisu nigdy nie jest brany z zapytania odwiedzającego: to live_site z konfiguracji Joomli, domena mapy strony Gridboxa albo adres zapamiętany przy zapisie tych ustawień — po instalacji lub aktualizacji zapisz je raz. Wymaga mapy strony pod /sitemap.xml i dostępu serwera do własnego adresu (reguła Cloudflare lub zapora, która blokuje serwer, wyłącza podgrzewanie: strona, która nie odpowiada 200, jest pomijana na czas ważności pamięci). Odwiedziny podgrzewania nie liczą się do odsłon stron Gridboxa ani do dziennika brakujących stron."
PLG_SYSTEM_MERTOOLS_SPEED_WARM_BATCH_LABEL="Stron na minutę"
PLG_SYSTEM_MERTOOLS_SPEED_WARM_BATCH_DESC="Ile stron podgrzewać w jednej rundzie (co minutę, gdy ktoś odwiedza stronę). Więcej = szybciej, ale większe obciążenie serwera zaraz po wyczyszczeniu pamięci."

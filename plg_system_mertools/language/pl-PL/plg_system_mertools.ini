PLG_SYSTEM_MERTOOLS_NF_UI_R_TYPED_NEXT="Od następnego wejścia: własne przekierowanie"
PLG_SYSTEM_MERTOOLS_NF_UI_HINT="Co dostało ostatnie wejście na każdy adres. Wpisz ścieżkę tej strony (np. /kontakt) albo pełny adres i kliknij Zapisz; puste pole usuwa przekierowanie. Adresy wysyłane do celu ogólnego (np. na stronę główną) warto przekierować na konkretną stronę: wyszukiwarki traktują brakującą stronę przekierowaną na stronę główną jak brakującą („soft 404”)."

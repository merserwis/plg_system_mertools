PLG_SYSTEM_MERTOOLS_APPS_UI_COPY_ALL="Kopia wszystkich aplikacji teraz"
PLG_SYSTEM_MERTOOLS_APPS_UI_WHEN="Kiedy"
PLG_SYSTEM_MERTOOLS_APPS_UI_REASON="Rodzaj"

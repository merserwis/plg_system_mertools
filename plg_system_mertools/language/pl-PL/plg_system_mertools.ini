PLG_SYSTEM_MERTOOLS_NF_UI_MOVED_HINT="Adres kończący się jednym z tych aliasów trafia na stronę lub kategorię pod jej obecnym adresem (301). Usuń wiersz, jeśli stary alias ma znów zwracać 404."

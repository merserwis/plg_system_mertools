PLG_SYSTEM_MERTOOLS_CHK_V_OPC_LIMITS="włączony; %d MB, do %d plików (szczegóły ukryte przez hosting)"
PLG_SYSTEM_MERTOOLS_CHK_V_OPC_STATUS="%d MB, wolne %d%%, trafienia %d%%, %d z %d plików"
PLG_SYSTEM_MERTOOLS_CHK_GB_DEFER="Deferred Loading"
PLG_SYSTEM_MERTOOLS_CHK_GB_DEFER_WHERE="Gridbox → Settings (Ustawienia) → Performance (Wydajność)"
PLG_SYSTEM_MERTOOLS_CHK_GB_DEFER_WANT="Włączone, razem z „Strona widoczna od razu” w MerTools"
PLG_SYSTEM_MERTOOLS_CHK_GB_DEFER_WHY="Bez niego skrypty Gridboxa ładują się w nagłówku i wstrzymują stronę; z nim Gridbox ukrywa stronę, dopóki skrypty się nie wykonają — to usuwa opcja MerTools <em>Strona widoczna od razu</em> (zakładka Szybkość strony). Na merserwis.pl wyłączenie dało skakanie układu (CLS 1,3)."
PLG_SYSTEM_MERTOOLS_CHK_GB_PAGECACHE="Page cache (pamięć stron Gridboxa)"
PLG_SYSTEM_MERTOOLS_CHK_GB_PAGECACHE_WHERE="Gridbox → Settings (Ustawienia) → Performance (Wydajność)"
PLG_SYSTEM_MERTOOLS_CHK_GB_PAGECACHE_WANT="Wyłączone"
PLG_SYSTEM_MERTOOLS_CHK_GB_PAGECACHE_WHY="Pamięć stron Gridboxa zapamiętuje token formularza pierwszego odwiedzającego (zamówienia, opinie i formularze kolejnych mogą nie działać) i nie czyści się po zmianach, gdy Joomla używa Redisa. Zamiast niej używaj pamięci stron MerTools (zakładka Szybkość strony)."
PLG_SYSTEM_MERTOOLS_CHK_GB_LAZY="Lazy load images"
PLG_SYSTEM_MERTOOLS_CHK_GB_LAZY_WHERE="Gridbox → Settings (Ustawienia) → Performance (Wydajność)"
PLG_SYSTEM_MERTOOLS_CHK_GB_LAZY_WANT="Włączone"
PLG_SYSTEM_MERTOOLS_CHK_GB_LAZY_WHY="MerTools wczytuje obrazki u góry od razu, a resztę przy przewijaniu — z tą opcją i bez niej; włączona opóźnia też tła sekcji niżej na stronie, którymi MerTools się nie zajmuje."
PLG_SYSTEM_MERTOOLS_CHK_GB_IMAGES="Compress / Adaptive images"
PLG_SYSTEM_MERTOOLS_CHK_GB_IMAGES_WHERE="Gridbox → Settings (Ustawienia) → Performance (Wydajność)"
PLG_SYSTEM_MERTOOLS_CHK_GB_IMAGES_WANT="Niepotrzebne przy kopiach WebP z MerTools"
PLG_SYSTEM_MERTOOLS_CHK_GB_IMAGES_WHY="MerTools sam robi kopie WebP w rozmiarze ekranu (<em>Obrazki w rozmiarze ekranu</em>). Obrazki, którym Gridbox nada własny srcset, zostawia Gridboxowi, więc obie opcje mogą zostać włączone — to tylko podwójna praca."
PLG_SYSTEM_MERTOOLS_CHK_GB_CSS="Compress CSS"
PLG_SYSTEM_MERTOOLS_CHK_GB_CSS_WHERE="Gridbox → Settings (Ustawienia) → Performance (Wydajność)"
PLG_SYSTEM_MERTOOLS_CHK_GB_CSS_WANT="Warto spróbować"
PLG_SYSTEM_MERTOOLS_CHK_GB_CSS_WHY="Mniej arkuszy stylów wstrzymujących pierwszy widok (strony ładują ich często 10–20). Nie koliduje z MerTools, ale nie było testowane na każdej stronie: po włączeniu obejrzyj kilka podstron."
PLG_SYSTEM_MERTOOLS_CHK_JM_PAGECACHE="Wtyczka System - Pamięć podręczna stron"
PLG_SYSTEM_MERTOOLS_CHK_JM_PAGECACHE_WHERE="System → Zarządzaj: Wtyczki → System - Pamięć podręczna stron"
PLG_SYSTEM_MERTOOLS_CHK_JM_PAGECACHE_WANT="Wyłączona, gdy działa pamięć stron MerTools"
PLG_SYSTEM_MERTOOLS_CHK_JM_PAGECACHE_WHY="Dwie pamięci stron naraz utrudniają odświeżanie stron po zmianach: Joomla podawałaby swoją starą kopię, zanim MerTools w ogóle zadziała."
PLG_SYSTEM_MERTOOLS_CHK_JM_PLATFORM="Platforma pamięci podręcznej"
PLG_SYSTEM_MERTOOLS_CHK_JM_PLATFORM_WHERE="System → Konfiguracja globalna → System → Pamięć podręczna → Platforma pamięci podręcznej (widoczne tylko, gdy Pamięć podręczna ma wartość „Włącz - poziom konserwatywny” albo „Włącz - poziom progresywny”)"
PLG_SYSTEM_MERTOOLS_CHK_JM_PLATFORM_WANT="Wyłączone"
PLG_SYSTEM_MERTOOLS_CHK_JM_PLATFORM_WHY="Z tą opcją telefony mają osobne wpisy w pamięci, których Joomla nie odświeża razem z resztą: na merserwis.pl telefony dostawały stare ustawienia wtyczek i stare wersje skryptów."
PLG_SYSTEM_MERTOOLS_CHK_SRV_PHP="Wersja PHP"
PLG_SYSTEM_MERTOOLS_CHK_SRV_PHP_WHERE="Panel hostingu → ustawienia PHP"
PLG_SYSTEM_MERTOOLS_CHK_SRV_PHP_WANT="8.2 lub nowsza (testowane na 8.5)"
PLG_SYSTEM_MERTOOLS_CHK_SRV_PHP_WHY="MerTools wymaga PHP 8.2; nowsze wersje są szybsze."
PLG_SYSTEM_MERTOOLS_CHK_SRV_WEBP="GD z obsługą WebP"
PLG_SYSTEM_MERTOOLS_CHK_SRV_WEBP_WHERE="Panel hostingu → rozszerzenia PHP (gd)"
PLG_SYSTEM_MERTOOLS_CHK_SRV_WEBP_WANT="Tak"
PLG_SYSTEM_MERTOOLS_CHK_SRV_WEBP_WHY="Potrzebne do lżejszych kopii obrazków WebP i pierwszej klatki ciężkich GIF-ów. Bez tego pozostałe narzędzia działają normalnie."
PLG_SYSTEM_MERTOOLS_CHK_SRV_OPCACHE="OPcache"
PLG_SYSTEM_MERTOOLS_CHK_SRV_OPCACHE_WHERE="Panel hostingu → ustawienia PHP (php.ini)"
PLG_SYSTEM_MERTOOLS_CHK_SRV_OPCACHE_WANT="Włączony; pamięć ≥ 256 MB, max_accelerated_files ≥ 20000"
PLG_SYSTEM_MERTOOLS_CHK_SRV_OPCACHE_WHY="OPcache trzyma skompilowane PHP w pamięci. Gdy jest pełny (Joomla, Gridbox i dodatki to tysiące plików), PHP kompiluje je od nowa przy każdej wizycie i serwer odpowiada w sekundach zamiast w dziesiątkach milisekund — to była główna przyczyna wolnego serwera na merserwis.pl. Warto też ustawić: interned_strings_buffer ≥ 32, revalidate_freq 60."
PLG_SYSTEM_MERTOOLS_CHK_CF_ROCKET="Rocket Loader"
PLG_SYSTEM_MERTOOLS_CHK_CF_ROCKET_WHERE="Cloudflare → Speed → Optimization → Content Optimization"
PLG_SYSTEM_MERTOOLS_CHK_CF_ROCKET_WANT="Wyłączony"
PLG_SYSTEM_MERTOOLS_CHK_CF_ROCKET_WHY="Razem z Deferred Loading Gridboxa daje pustą stronę, aż wczytają się wszystkie skrypty. MerTools sam opóźnia skrypty marketingowe (zakładka Szybkość strony). Sprawdzane na stronie, którą dostaje gość; „wyłączony” także wtedy, gdy strona nie stoi za Cloudflare."
PLG_SYSTEM_MERTOOLS_CHK_V_NOTUSED="bez znaczenia (pamięć podręczna systemu wyłączona)"
PLG_SYSTEM_MERTOOLS_ADMIN_CACHE_BUTTON_LABEL="Przycisk czyszczenia pamięci w górnym pasku"
PLG_SYSTEM_MERTOOLS_ADMIN_CACHE_BUTTON_DESC="Przycisk „Wyczyść pamięć” w górnym pasku panelu administratora, obok wersji Joomli. Jedno kliknięcie usuwa strony zapisane przez MerTools i całą pamięć podręczną Joomli (jak System → Wyczyść pamięć podręczną), bez otwierania ustawień. Widzą go użytkownicy, którzy mogą czyścić pamięć podręczną w Joomli."
PLG_SYSTEM_MERTOOLS_HEADER_LABEL="Wyczyść pamięć"
PLG_SYSTEM_MERTOOLS_HEADER_TITLE="Usuwa strony zapisane przez MerTools i pamięć podręczną Joomli (jak System → Wyczyść pamięć podręczną)"
PLG_SYSTEM_MERTOOLS_HEADER_CLEARED="Pamięć wyczyszczona: grupy pamięci podręcznej Joomli: %d (%s)."
PLG_SYSTEM_MERTOOLS_HEADER_CLEARED_PAGES="Usunięte strony zapisane przez MerTools: %d."
PLG_SYSTEM_MERTOOLS_HEADER_NOT_CLEARED="Nie udało się wyczyścić: %s."
PLG_SYSTEM_MERTOOLS_HEADER_ERROR="Nie udało się wyczyścić pamięci. Odśwież stronę i spróbuj ponownie."
PLG_SYSTEM_MERTOOLS_DARK_BUTTONS_LABEL="Przyciski w trybie ciemnym"
PLG_SYSTEM_MERTOOLS_DARK_BUTTONS_DESC="W trybie ciemnym jasne i szare przyciski Gridboxa dostawały ciemne kolory palety i zlewały się ze stroną. <em>Kolor akcentu</em>: przycisk z tłem dostaje tło w kolorze akcentu (ustawionym wyżej albo z Gridboxa) i tekst w kolorze najlepiej na nim czytelnym, a przycisk rysowany samym obrysem — obrys w kolorze akcentu. <em>Obrys w kolorze akcentu</em>: każdy przycisk zostaje ciemny i dostaje obwódkę w kolorze akcentu. Pole wyszukiwarki w obu wariantach dostaje obrys w kolorze akcentu. <em>Jak dotąd</em>: przyciski i pole wyszukiwarki są dopasowywane jak reszta strony (zob. następną opcję)."
PLG_SYSTEM_MERTOOLS_DARK_BUTTONS_ACCENT="Kolor akcentu — tło w kolorze akcentu"
PLG_SYSTEM_MERTOOLS_DARK_BUTTONS_OUTLINE="Obrys w kolorze akcentu — ciemne z obwódką"
PLG_SYSTEM_MERTOOLS_DARK_BUTTONS_OFF="Jak dotąd"
PLG_SYSTEM_MERTOOLS_TABS_SLIDERS_LABEL="Slidery w sekcjach"
PLG_SYSTEM_MERTOOLS_TABS_SLIDERS_DESC="Slider wpisów lub produktów Gridboxa w zakładce (np. Promocje, Bestsellery) pokazuje na telefonie jeden wpis naraz i nic nie mówi, że jest ich więcej. <em>Strzałki i numer</em> dodaje pod sliderem pasek: poprzedni, pozycja (np. 2 / 12), następny i podpowiedź, że można przesuwać palcem. <em>Jeden pod drugim</em> pokazuje wszystkie wpisy w kolumnie zamiast przewijania. <em>Jak w Gridboxie</em> zostawia slider bez zmian. Działa tylko na ekranach, na których zakładki są sekcjami; komputery mają slider bez zmian."
PLG_SYSTEM_MERTOOLS_TABS_SLIDERS_NAV="Strzałki i numer (2 / 12) z podpowiedzią"
PLG_SYSTEM_MERTOOLS_TABS_SLIDERS_STACK="Jeden pod drugim"
PLG_SYSTEM_MERTOOLS_TABS_SLIDERS_OFF="Jak w Gridboxie"
PLG_SYSTEM_MERTOOLS_TABS_SLIDER_PREV="Poprzednie"
PLG_SYSTEM_MERTOOLS_TABS_SLIDER_NEXT="Następne"
PLG_SYSTEM_MERTOOLS_TABS_SLIDER_HINT="Przesuń w bok lub użyj strzałek, aby zobaczyć więcej"

; 1.0.3: edit history
PLG_SYSTEM_MERTOOLS_FIELDSET_HISTORY="Historia edycji"
PLG_SYSTEM_MERTOOLS_HISTORY_NOTE="Kto i kiedy zmienił artykuł, produkt lub stronę Gridboxa. Gridbox tego nie zapisuje, więc MerTools notuje każdy zapis w edytorze Gridboxa i każdą akcję na listach Gridboxa wykonaną przez zalogowanego użytkownika (publikacja, wycofanie, kosz, przywrócenie, usunięcie, duplikat, przeniesienie, wyróżnienie) wraz z tym, co się zmieniło: tytuł, status, kategoria, adres, treść, opis, pola, cena, SKU, stan i inne. Ostatnia zmiana jest widoczna pod każdym tytułem na listach Gridboxa, kliknięcie otwiera całą historię strony. Zmian sprzed MerTools 1.0.3 i importów z plików CSV nie ma w historii."
PLG_SYSTEM_MERTOOLS_HISTORY_ENABLED_LABEL="Zapisuj zmiany"
PLG_SYSTEM_MERTOOLS_HISTORY_ENABLED_DESC="Wyłączone: nic nowego nie jest zapisywane; dotychczasowa historia zostaje i jest pokazywana."
PLG_SYSTEM_MERTOOLS_HISTORY_LISTS_LABEL="Na listach Gridboxa"
PLG_SYSTEM_MERTOOLS_HISTORY_LISTS_DESC="Pod tytułem każdego artykułu i produktu na listach Gridboxa: data i autor ostatniej zmiany; kliknięcie otwiera historię strony."
PLG_SYSTEM_MERTOOLS_HISTORY_ACTIONLOG_LABEL="Także w dzienniku działań"
PLG_SYSTEM_MERTOOLS_HISTORY_ACTIONLOG_DESC="Każda zmiana trafia też do Joomla: Użytkownicy → Dziennik działań użytkowników, z jego filtrami po użytkowniku, dacie i rozszerzeniu oraz eksportem do CSV."
PLG_SYSTEM_MERTOOLS_HISTORY_DAYS_LABEL="Przechowuj (dni)"
PLG_SYSTEM_MERTOOLS_HISTORY_DAYS_DESC="Starsze wpisy są usuwane raz dziennie. 0 = na zawsze."

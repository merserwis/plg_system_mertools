; 1.0.6: Gridbox lists
PLG_SYSTEM_MERTOOLS_FIELDSET_LISTS="Gridbox lists"
PLG_SYSTEM_MERTOOLS_LISTS_NOTE="The lists of products, posts and pages in the Gridbox panel. Columns: the button “Columns” above a list shows, hides and orders Gridbox’s columns and adds others — sale price, minimum quantity, product badges, versions/sets (yes/no), publishing dates and the fields of the app (e.g. producer). The column “Author” shows, next to Gridbox’s authors, the Joomla user who created the page, from the edit history; for pages older than the history — in grey italics — the first person who changed it. Lists without that column (products, pages) can add it. Each user arranges each list for themselves; it is kept on the server. Editing in the list: a click on a price, sale price, stock, SKU or the badges of a product changes them at once, without the editor; the change goes to the edit history. A product open in the Gridbox editor cannot be changed in the list (the editor’s next save would put the old value back). Items from other folders: a product added to more folders is also listed, greyed out, in its other folders (after their own items), with a link to its main folder, where it is edited."

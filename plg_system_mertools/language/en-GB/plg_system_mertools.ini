PLG_SYSTEM_MERTOOLS_CHK_V_OPC_STATUS="%d MB, %d%% free, %d%% hits, %d of %d files"
PLG_SYSTEM_MERTOOLS_CHK_GB_DEFER="Deferred Loading"
PLG_SYSTEM_MERTOOLS_CHK_GB_DEFER_WHERE="Gridbox → Settings → Performance"
PLG_SYSTEM_MERTOOLS_CHK_GB_DEFER_WANT="On, with “Page shown at once” on in MerTools"
PLG_SYSTEM_MERTOOLS_CHK_GB_DEFER_WHY="Without it Gridbox’s scripts load in the head and hold up the page; with it Gridbox hides the page until its scripts have run — MerTools’ <em>Page shown at once</em> (tab Page speed) removes that. On merserwis.pl turning it off made the layout jump (CLS 1.3)."
PLG_SYSTEM_MERTOOLS_CHK_GB_PAGECACHE="Page cache"
PLG_SYSTEM_MERTOOLS_CHK_GB_PAGECACHE_WHERE="Gridbox → Settings → Performance"
PLG_SYSTEM_MERTOOLS_CHK_GB_PAGECACHE_WANT="Off"
PLG_SYSTEM_MERTOOLS_CHK_GB_PAGECACHE_WHY="Gridbox’s page cache keeps the form token of the first visitor (orders, reviews and forms of later visitors may fail) and is not emptied after changes when Joomla uses Redis. Use the MerTools page cache instead (tab Page speed)."
PLG_SYSTEM_MERTOOLS_CHK_GB_LAZY="Lazy load images"
PLG_SYSTEM_MERTOOLS_CHK_GB_LAZY_WHERE="Gridbox → Settings → Performance"
PLG_SYSTEM_MERTOOLS_CHK_GB_LAZY_WANT="On"
PLG_SYSTEM_MERTOOLS_CHK_GB_LAZY_WHY="MerTools loads the images at the top at once and the rest when scrolled to, with or without it; on, it also delays section backgrounds further down, which MerTools does not handle."
PLG_SYSTEM_MERTOOLS_CHK_GB_IMAGES="Compress / Adaptive images"
PLG_SYSTEM_MERTOOLS_CHK_GB_IMAGES_WHERE="Gridbox → Settings → Performance"
PLG_SYSTEM_MERTOOLS_CHK_GB_IMAGES_WANT="Not needed with MerTools WebP copies"
PLG_SYSTEM_MERTOOLS_CHK_GB_IMAGES_WHY="MerTools makes WebP copies in the size of the screen itself (<em>Images in the size of the screen</em>). Images that get Gridbox’s own srcset are left to Gridbox, so both can stay on — there is just double work."
PLG_SYSTEM_MERTOOLS_CHK_GB_CSS="Compress CSS"
PLG_SYSTEM_MERTOOLS_CHK_GB_CSS_WHERE="Gridbox → Settings → Performance"
PLG_SYSTEM_MERTOOLS_CHK_GB_CSS_WANT="Worth a try"
PLG_SYSTEM_MERTOOLS_CHK_GB_CSS_WHY="Fewer style sheets holding up the first view (sites often load 10–20). It does not conflict with MerTools, but it was not tested on every site: after turning it on, look at a few pages."
PLG_SYSTEM_MERTOOLS_CHK_JM_PAGECACHE="System - Page Cache plugin"
PLG_SYSTEM_MERTOOLS_CHK_JM_PAGECACHE_WHERE="System → Manage: Plugins → System - Page Cache"
PLG_SYSTEM_MERTOOLS_CHK_JM_PAGECACHE_WANT="Off when the MerTools page cache is on"
PLG_SYSTEM_MERTOOLS_CHK_JM_PAGECACHE_WHY="Two page caches at once make pages hard to refresh after changes: Joomla would serve its own old copy before MerTools runs."
PLG_SYSTEM_MERTOOLS_CHK_JM_PLATFORM="Platform specific caching"
PLG_SYSTEM_MERTOOLS_CHK_JM_PLATFORM_WHERE="System → Global Configuration → System → Cache → Platform Specific Caching (shown only while System Cache is “ON - Conservative caching” or “ON - Progressive caching”)"
PLG_SYSTEM_MERTOOLS_CHK_JM_PLATFORM_WANT="Off"
PLG_SYSTEM_MERTOOLS_CHK_JM_PLATFORM_WHY="With it, phones get their own cache keys that Joomla does not refresh with the others: on merserwis.pl phones kept old plugin settings and old script versions."
PLG_SYSTEM_MERTOOLS_CHK_SRV_PHP="PHP version"
PLG_SYSTEM_MERTOOLS_CHK_SRV_PHP_WHERE="Hosting panel → PHP settings"
PLG_SYSTEM_MERTOOLS_CHK_SRV_PHP_WANT="8.2 or newer (tested on 8.5)"
PLG_SYSTEM_MERTOOLS_CHK_SRV_PHP_WHY="MerTools needs PHP 8.2; newer versions are faster."
PLG_SYSTEM_MERTOOLS_CHK_SRV_WEBP="GD with WebP"
PLG_SYSTEM_MERTOOLS_CHK_SRV_WEBP_WHERE="Hosting panel → PHP extensions (gd)"
PLG_SYSTEM_MERTOOLS_CHK_SRV_WEBP_WANT="Yes"
PLG_SYSTEM_MERTOOLS_CHK_SRV_WEBP_WHY="Needed for the lighter WebP copies of images and the first frame of heavy GIFs. Without it the other tools still work."
PLG_SYSTEM_MERTOOLS_CHK_SRV_OPCACHE="OPcache"
PLG_SYSTEM_MERTOOLS_CHK_SRV_OPCACHE_WHERE="Hosting panel → PHP settings (php.ini)"
PLG_SYSTEM_MERTOOLS_CHK_SRV_OPCACHE_WANT="On; memory ≥ 256 MB, max_accelerated_files ≥ 20000"
PLG_SYSTEM_MERTOOLS_CHK_SRV_OPCACHE_WHY="OPcache keeps compiled PHP in memory. When it is full (Joomla, Gridbox and extensions have thousands of files) PHP compiles them again on every visit and the server answers in seconds instead of tens of milliseconds — that was the main cause of the slow server on merserwis.pl. Also worth setting: interned_strings_buffer ≥ 32, revalidate_freq 60."
PLG_SYSTEM_MERTOOLS_CHK_CF_ROCKET="Rocket Loader"
PLG_SYSTEM_MERTOOLS_CHK_CF_ROCKET_WHERE="Cloudflare → Speed → Optimization → Content Optimization"
PLG_SYSTEM_MERTOOLS_CHK_CF_ROCKET_WANT="Off"
PLG_SYSTEM_MERTOOLS_CHK_CF_ROCKET_WHY="Together with Gridbox’s Deferred Loading it leaves the page blank until all scripts have loaded. MerTools delays marketing scripts itself (tab Page speed). Checked in the page a guest gets; “off” also when the site is not behind Cloudflare."
PLG_SYSTEM_MERTOOLS_CHK_V_NOTUSED="not used (System Cache off)"
PLG_SYSTEM_MERTOOLS_ADMIN_CACHE_BUTTON_LABEL="Clear cache button in the top bar"
PLG_SYSTEM_MERTOOLS_ADMIN_CACHE_BUTTON_DESC="A “Clear cache” button in the top bar of the administrator, next to the Joomla version. One click empties the pages kept by MerTools and the whole Joomla cache (as System → Clear Cache), without opening any settings. Shown to users who may clear the cache in Joomla."
PLG_SYSTEM_MERTOOLS_HEADER_LABEL="Clear cache"
PLG_SYSTEM_MERTOOLS_HEADER_TITLE="Empties the pages kept by MerTools and the Joomla cache (as System → Clear Cache)"
PLG_SYSTEM_MERTOOLS_HEADER_CLEARED="Cache cleared: %d Joomla cache groups (%s)."
PLG_SYSTEM_MERTOOLS_HEADER_CLEARED_PAGES="Pages kept by MerTools removed: %d."
PLG_SYSTEM_MERTOOLS_HEADER_NOT_CLEARED="Not cleared: %s."
PLG_SYSTEM_MERTOOLS_HEADER_ERROR="The cache could not be cleared. Reload the page and try again."
PLG_SYSTEM_MERTOOLS_DARK_BUTTONS_LABEL="Buttons in dark mode"
PLG_SYSTEM_MERTOOLS_DARK_BUTTONS_DESC="In dark mode Gridbox's light and grey buttons got the dark colours of the palette and blended into the page. <em>Accent colour</em>: a button with a background takes the accent colour (the one set above, or Gridbox's) with text in the colour that reads best on it, and a button drawn with an outline only gets an outline in the accent colour. <em>Accent outline</em>: every button stays dark and gets an outline in the accent colour. The search field gets an outline in the accent colour in both. <em>As before</em>: buttons and the search field are adapted like the rest of the page (see the next option)."
PLG_SYSTEM_MERTOOLS_DARK_BUTTONS_ACCENT="Accent colour — background in the accent colour"

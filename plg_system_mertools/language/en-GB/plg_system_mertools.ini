; Page layout: tabs as expandable sections on phones (0.0.27)
PLG_SYSTEM_MERTOOLS_TABS_LINKS_LABEL="Link to a tab in the address"
PLG_SYSTEM_MERTOOLS_TABS_LINKS_DESC="Choosing a tab of a description (e.g. “Technical data”) writes its name in the page address: ?technical_data — without reloading the page. The copied address opens the page on that tab and scrolls to it (on phones that row is opened). The name is made from the tab title: lower case without accents, spaces as “_”. The MerTools page cache serves such addresses as the plain page."
PLG_SYSTEM_MERTOOLS_TABS_ACC_LABEL="Tabs as expandable sections on phones"
PLG_SYSTEM_MERTOOLS_TABS_ACC_DESC="On a narrow screen the Gridbox tab bar does not fit and has to be scrolled sideways, and visitors do not see that there are more tabs. Here, on phones, every tab becomes a row with its icon, name and an arrow, and its content opens below it. Computers keep the tabs. Applies to every tabs item."
PLG_SYSTEM_MERTOOLS_TABS_ACC_WIDTH_LABEL="Up to screen width (px)"
PLG_SYSTEM_MERTOOLS_TABS_ACC_WIDTH_DESC="Up to this screen width the tabs are shown as expandable sections. 768 covers phones and tablets held upright."
PLG_SYSTEM_MERTOOLS_TABS_ACC_FIRST_LABEL="First section open"
PLG_SYSTEM_MERTOOLS_TABS_ACC_FIRST_DESC="No (default): only the list of names is shown at first, all sections closed. Yes: the content of the first tab is shown at once (as on a computer)."
PLG_SYSTEM_MERTOOLS_HELP="Explanation"
PLG_SYSTEM_MERTOOLS_SPEED_WEBP_LABEL="Images in the size of the screen (WebP)"
PLG_SYSTEM_MERTOOLS_SPEED_WEBP_DESC="Photos are often much larger than they are shown: a 1200 px photo of 400 KB shown in a 400 px column of a phone. MerTools makes lighter WebP copies of each JPEG and PNG of this site in a few widths (480, 768, 1080, 1440, 1920 px — never wider than the original) and the page offers them (srcset): each browser takes the one that fits its screen, usually 5–10× lighter. The originals are never changed and stay the fallback. The copies are made by PHP (GD) after a page has been sent, a few at a time, so no visitor waits; the first visits still get the originals. The copies are kept in media/mertools-img."
PLG_SYSTEM_MERTOOLS_SPEED_GIF_LABEL="Heavy GIF animations: first frame at once"
PLG_SYSTEM_MERTOOLS_SPEED_GIF_DESC="An animated GIF at the top of a page (over 150 KB) is usually the largest element and on phones takes many seconds to arrive — PageSpeed measures LCP by it. Here its first frame is shown at once as a small WebP image and the animation is loaded after the page, when the browser is idle. Tip: a GIF converted to animated WebP is usually much lighter — put it next to the GIF under the same name (e.g. animation.webp beside animation.gif) and MerTools uses it for the animation."
PLG_SYSTEM_MERTOOLS_SPEED_IMAGES_PANEL_LABEL="Image copies"
PLG_SYSTEM_MERTOOLS_SPEED_IMAGES_PANEL_DESC="Pictures with copies, pictures waiting for them and the space the copies take. “Make copies now” makes the waiting ones at once (about 20 seconds of work; click again if some are still waiting). “Remove all copies” deletes them; the pages go back to the original pictures and copies are made again as pages are visited."
PLG_SYSTEM_MERTOOLS_SPEED_ICONS_LABEL="Icon styles without holding up the page"
PLG_SYSTEM_MERTOOLS_SPEED_ICONS_DESC="The style sheets of icon fonts (Font Awesome, Material Icons, Gridbox’s icon libraries) are loaded alongside the page instead of before it: the text and pictures appear sooner (FCP), the icons a moment later. Turn off if a missing icon for that moment is a problem on your site."
PLG_SYSTEM_MERTOOLS_SPEED_CACHE_PANEL_DESC="Pages and Gridbox requests kept now, the space they take and when the memory was last emptied. “Empty page memory” removes them all; pages are kept again on the next visits."
PLG_SYSTEM_MERTOOLS_SPEED_PANEL_DESC="PageSpeed results of the addresses above, for phones and computers: measured from your browser with Google’s PageSpeed Insights (the API key above is needed). Set a measurement as the reference point to compare later changes with it."
PLG_SYSTEM_MERTOOLS_DARK_PREVIEW_DESC="How the chosen palette and intensity look on typical Gridbox elements, before saving."
PLG_SYSTEM_MERTOOLS_DARK_C_BG_DESC="The main background of the page in dark mode (Gridbox variable --bg-primary)."
PLG_SYSTEM_MERTOOLS_DARK_C_SURFACE_DESC="Background of cards, boxes and alternating sections (--bg-secondary)."
PLG_SYSTEM_MERTOOLS_DARK_C_BGDARK_DESC="Background of sections that are already dark in the light theme (--bg-dark)."
PLG_SYSTEM_MERTOOLS_DARK_C_TITLE_DESC="Colour of headings (--title)."
PLG_SYSTEM_MERTOOLS_DARK_C_TEXT_DESC="Colour of the body text (--text)."
PLG_SYSTEM_MERTOOLS_DARK_C_BORDER_DESC="Colour of lines and frames (--border)."
PLG_SYSTEM_MERTOOLS_DARK_C_HOVER_DESC="Background of links and buttons under the mouse (--hover)."
PLG_SYSTEM_MERTOOLS_IMG_UI_READY="Pictures with copies"
PLG_SYSTEM_MERTOOLS_IMG_UI_PENDING="Waiting for copies"
PLG_SYSTEM_MERTOOLS_IMG_UI_SKIPPED="Left as they are (small, static GIF, too large)"
PLG_SYSTEM_MERTOOLS_IMG_UI_FAILED="Could not be read"
PLG_SYSTEM_MERTOOLS_IMG_UI_FILES="Copies"
PLG_SYSTEM_MERTOOLS_IMG_UI_RUN="Make copies now"
PLG_SYSTEM_MERTOOLS_IMG_UI_RUN_DONE="Done: every picture seen on the pages has its copies."
PLG_SYSTEM_MERTOOLS_IMG_UI_RUN_MORE="Part done; %s still waiting — click again, or they are made with the next page visits."
PLG_SYSTEM_MERTOOLS_IMG_UI_CLEAR="Remove all copies"
PLG_SYSTEM_MERTOOLS_IMG_UI_CLEAR_CONFIRM="Remove all image copies? The pages go back to the original pictures until new copies are made."
PLG_SYSTEM_MERTOOLS_IMG_UI_CLEARED="Removed. Kept pages were emptied as well."
PLG_SYSTEM_MERTOOLS_IMG_UI_NO_GD="This server’s PHP has no GD with WebP: copies cannot be made here (ask the hosting to enable it)."
PLG_SYSTEM_MERTOOLS_IMG_UI_LOADING="Loading…"
PLG_SYSTEM_MERTOOLS_IMG_UI_ERROR="Could not read the state of the copies."
PLG_SYSTEM_MERTOOLS_SPEED_POPUPS_LABEL="Popups after the first interaction"
PLG_SYSTEM_MERTOOLS_SPEED_POPUPS_DESC="A Gridbox popup set to open after a time (trigger “Time delay”) opens at that time, but not before the visitor has first used the page — scrolled, touched, moved the mouse or pressed a key; if the time has passed already, it opens right then. A large popup opened while the visitor is still only looking becomes the largest element of the page, and Google measures the loading time (LCP) of real visitors by it; on phones Google also counts a popup before any interaction as intrusive. Popups that open on scrolling or when leaving the page, and Gridbox’s cookie notice, are not changed."
PLG_SYSTEM_MERTOOLS_LAYOUT_ROWS_LABEL="Post sliders in several rows"
PLG_SYSTEM_MERTOOLS_LAYOUT_ROWS_DESC="Gridbox shows the posts of a slider (Recent posts slider, Related posts slider, Recently viewed products) in one row only. Here a slider can have 2, 3 or 4 rows: in Gridbox, open the slider’s settings and enter in <strong>Class suffix</strong> e.g. <code>mt-rows-2</code> (two rows on every screen). Different rows on smaller screens: <code>mt-rows-tablet-N</code> (up to 1024 px) and <code>mt-rows-phone-N</code> (up to 768 px), e.g. <code>mt-rows-3 mt-rows-tablet-2 mt-rows-phone-1</code>. The posts fill the rows one after the other (first row 1 2 3, second 4 5 6) and the slider moves as before — arrows, dots and autoplay work as set in Gridbox. Sliders without such a class are not changed."
PLG_SYSTEM_MERTOOLS_LAYOUT_ROWS_NOTE_LABEL="How to set the rows of a slider"
PLG_SYSTEM_MERTOOLS_LAYOUT_ROWS_NOTE="<ol class='mb-2'><li>In Gridbox, open the page with the slider and click the slider (<em>Recent posts slider</em>, <em>Related posts slider</em> or <em>Recently viewed products</em>) to open its settings.</li><li>Go to the <strong>Advanced</strong> tab and enter the classes in <strong>Class Suffix</strong> — separated by spaces, next to any class that is already there.</li><li>Save the page in Gridbox. If the MerTools page cache is on (tab <em>Page speed</em>), click <em>Empty page memory</em> so that visitors get the new layout at once.</li></ol><table class='table table-sm mb-1'><thead><tr><th>Class Suffix</th><th>Result</th></tr></thead><tbody><tr><td><code>mt-rows-2</code></td><td>2 rows on every screen (<code>mt-rows-3</code>, <code>mt-rows-4</code>: 3 or 4 rows)</td></tr><tr><td><code>mt-rows-tablet-N</code></td><td>N rows on screens up to 1024 px</td></tr><tr><td><code>mt-rows-phone-N</code></td><td>N rows on screens up to 768 px</td></tr><tr><td><code>mt-rows-3 mt-rows-tablet-2 mt-rows-phone-1</code></td><td>3 rows on computers, 2 on tablets, 1 on phones</td></tr></tbody></table><p class='mb-0'>How many columns are visible and how the slider moves (arrows, dots, autoplay) stays as set in Gridbox; the posts fill the rows in order — first row 1 2 3, second row 4 5 6.</p>"
PLG_SYSTEM_MERTOOLS_SPEED_CHECKS_LABEL="Recommended settings"
PLG_SYSTEM_MERTOOLS_SPEED_CHECKS_DESC="Settings of Gridbox, Joomla, the server and Cloudflare that let MerTools work best: what each one is now, what it should be, why and where to change it. The state is read when this page opens; “Check again” reads it anew after a change."

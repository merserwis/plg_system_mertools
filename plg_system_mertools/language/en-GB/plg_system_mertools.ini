PLG_SYSTEM_MERTOOLS_FIELDSET_DARK="Dark mode"
PLG_SYSTEM_MERTOOLS_DARK_NOTE="An elegant dark theme for the whole site, built from Gridbox's own colour variables — soft dark greys and blues, never a harsh pure black, so it is easy on the eyes. A toggle button is placed in the header; the visitor's choice is remembered, and <em>Automatic</em> follows their system setting. The Gridbox core files are not changed."
PLG_SYSTEM_MERTOOLS_DARK_ENABLED_LABEL="Dark mode"
PLG_SYSTEM_MERTOOLS_DARK_ENABLED_DESC="Add a dark theme and a toggle button in the header to the front-end of the site."
PLG_SYSTEM_MERTOOLS_DARK_PALETTE_LABEL="Palette"
PLG_SYSTEM_MERTOOLS_DARK_PALETTE_DESC="The look of the dark theme. All are soft (not pure black); pick the one that suits the site, or Custom to set every colour yourself."

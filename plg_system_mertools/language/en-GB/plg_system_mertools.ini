PLG_SYSTEM_MERTOOLS_FIELDSET_NOTFOUND="404 pages"
PLG_SYSTEM_MERTOOLS_NOTFOUND_REDIRECT_LABEL="Redirect missing pages"
PLG_SYSTEM_MERTOOLS_NOTFOUND_REDIRECT_DESC="Instead of the 404 error page, the visitor is sent to a chosen page, the home page by default. This replaces adding a redirect to the template’s <code>error.php</code>, which every Gridbox update overwrites. Redirects set for single addresses in Joomla’s Redirects component take precedence. Only pages are redirected: form posts, AJAX and JSON requests get the normal 404 error."
PLG_SYSTEM_MERTOOLS_NOTFOUND_TARGET_LABEL="Redirect to"
PLG_SYSTEM_MERTOOLS_NOTFOUND_TARGET_DESC="The page the visitor is sent to instead of the error page."
PLG_SYSTEM_MERTOOLS_NOTFOUND_TARGET_HOME="The home page"
PLG_SYSTEM_MERTOOLS_NOTFOUND_TARGET_MENU="A menu item"
PLG_SYSTEM_MERTOOLS_NOTFOUND_TARGET_URL="An address (typed in)"
PLG_SYSTEM_MERTOOLS_NOTFOUND_MENUITEM_LABEL="Menu item"
PLG_SYSTEM_MERTOOLS_NOTFOUND_MENUITEM_DESC="A page from the site menu. If the menu item is deleted, the visitor goes to the home page."
PLG_SYSTEM_MERTOOLS_NOTFOUND_URL_LABEL="Address"
PLG_SYSTEM_MERTOOLS_NOTFOUND_URL_DESC="A path on this site, e.g. <code>/kontakt</code>, or a full address starting with <code>https://</code>."
PLG_SYSTEM_MERTOOLS_NOTFOUND_CODE_LABEL="Kind of redirect"
PLG_SYSTEM_MERTOOLS_NOTFOUND_CODE_DESC="Browsers and search engines remember a permanent redirect (301). A temporary one (302) is checked every time, which fits better when the missing pages are coming back soon."
PLG_SYSTEM_MERTOOLS_NOTFOUND_CODE_301="Permanent (301)"
PLG_SYSTEM_MERTOOLS_NOTFOUND_CODE_302="Temporary (302)"
PLG_SYSTEM_MERTOOLS_NOTFOUND_EXCLUDE_LABEL="No redirect for addresses starting with"
PLG_SYSTEM_MERTOOLS_NOTFOUND_EXCLUDE_DESC="One path beginning per line, e.g. <code>/api/</code>. Such addresses get the normal 404 error."
PLG_SYSTEM_MERTOOLS_FIELDSET_LAYOUT="Page layout"
PLG_SYSTEM_MERTOOLS_LAYOUT_CLIP_LABEL="No sideways shift on phones"
PLG_SYSTEM_MERTOOLS_LAYOUT_CLIP_DESC="A Gridbox element that sticks out to the right (a row with a slide-in animation or a motion effect, an off-canvas menu) makes phones lay the page out wider than the screen. Gridbox hides that part, but the hamburger in the header, the accessibility button and floating buttons then end up off-screen. This keeps the page as wide as the screen; nothing visible is cut off."
PLG_SYSTEM_MERTOOLS_LAYOUT_CATEGORIES_LABEL="Category pages (from the Omnibus plugin)"
PLG_SYSTEM_MERTOOLS_LAYOUT_CATEGORIES_DESC="What a separate Omnibus plugin (System - Omnibus on merserwis.pl) did for the category pages of the shop, so that plugin can be removed: the description of the category where the category layout holds the placeholder “Category Description” (its description block was moved out of Gridbox’s category intro, so Gridbox does not fill it — without this the placeholder would show); a category with subcategories in Gridbox’s Categories element opens and closes with a click on its whole row, highlighted on hover; 25 px above the description and clicks through the background overlay of the category pages."
PLG_SYSTEM_MERTOOLS_FIELDSET_SHOP="Shop"
PLG_SYSTEM_MERTOOLS_SHOP_OPTION_LINKS_LABEL="Links to a product option"
PLG_SYSTEM_MERTOOLS_SHOP_OPTION_LINKS_DESC="When an option or set of a product is chosen, Gridbox adds the choice to the page address, e.g. <code>?Zestawy+Metrel+MI+3155=…</code>. But such a link opened the product with no option selected whenever the option group name has a space, a dot or a square bracket, which is nearly always. With this on, the link opens the product with that option selected, with its price, SKU and images, also when the option name has a symbol written as HTML code, such as a red dot <code>&amp;#128308;</code>, so a customer can be sent a link to a specific set or model."
PLG_SYSTEM_MERTOOLS_CART_ENABLED_LABEL="Tidy up old carts"
PLG_SYSTEM_MERTOOLS_CART_ENABLED_DESC="Gridbox keeps every cart ever started in the database and never removes one, also the carts of orders placed long ago. MerTools removes the carts nobody can open any more. A cart is reached only through Gridbox’s cookie, valid for 7 days after the last change, so MerTools notes when each cart was last used. Orders and their data are not touched; they keep their own copies of the products."
PLG_SYSTEM_MERTOOLS_CART_MODE_LABEL="Removal"
PLG_SYSTEM_MERTOOLS_CART_MODE_DESC="When old carts are removed. The “Clean now” button below works in every mode."
PLG_SYSTEM_MERTOOLS_CART_MODE_MANUAL="By hand only (button below)"
PLG_SYSTEM_MERTOOLS_CART_MODE_DAILY="Automatically once a day"
PLG_SYSTEM_MERTOOLS_CART_MODE_LIMIT="Automatically when there are more carts than the limit"
PLG_SYSTEM_MERTOOLS_CART_LIMIT_LABEL="Cart limit"
PLG_SYSTEM_MERTOOLS_CART_LIMIT_DESC="When the database holds more carts, MerTools removes the ones that can go (checked every hour)."
PLG_SYSTEM_MERTOOLS_CART_DAYS_LABEL="Carts with products: unused for (days)"
PLG_SYSTEM_MERTOOLS_CART_DAYS_DESC="A cart with products is removed when nobody has used it for this many days. At least 8, because the cart cookie is valid for 7 days. MerTools has to watch the carts for the same number of days before it removes the first one. Empty carts do not wait."
PLG_SYSTEM_MERTOOLS_CART_EMPTY_LABEL="Remove empty carts at once"
PLG_SYSTEM_MERTOOLS_CART_EMPTY_DESC="A cart without products holds nothing. If its owner comes back, Gridbox starts a new cart. Carts used in the last hour and the 100 newest are skipped."
PLG_SYSTEM_MERTOOLS_CART_PANEL_LABEL="Carts in the database"
PLG_SYSTEM_MERTOOLS_CART_PANEL_DESC="“Check” shows what would be removed with the settings on screen, also unsaved. “Clean and optimise” removes it at once, in batches, without locking the shop, then rebuilds the cart tables so the database really gets smaller."
PLG_SYSTEM_MERTOOLS_CART_UNSUPPORTED="This site has no Gridbox shop in a MySQL or MariaDB database."

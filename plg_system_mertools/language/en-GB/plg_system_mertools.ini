; MerTools for Gridbox — plugin settings (en-GB)

PLG_SYSTEM_MERTOOLS_XML_DESCRIPTION="MerTools for Gridbox — a set of fixes and optimisations for Balbooa Gridbox that its own settings cannot do, each one a tool you can turn on or off. The Gridbox core files are never changed, so Gridbox updates install cleanly."

PLG_SYSTEM_MERTOOLS_INTRO_LABEL="MerTools for Gridbox"
PLG_SYSTEM_MERTOOLS_INTRO_DESC="Fixes and optimisations for Balbooa Gridbox that cannot be done from Gridbox's own settings. Each tab below is one tool that can be turned on or off. The Gridbox core files are never changed."

PLG_SYSTEM_MERTOOLS_FIELDSET_URL="Canonical URL"
PLG_SYSTEM_MERTOOLS_URL_NOTE="Gridbox serves a page under any number of slashes in the address — <code>/oferta</code>, <code>//oferta</code> and <code>//////oferta</code> all open the same page with status 200. Search engines then see several addresses for one page (duplicate content). This tool redirects every such address to the one clean address."

PLG_SYSTEM_MERTOOLS_URL_COLLAPSE_LABEL="Collapse duplicate slashes"
PLG_SYSTEM_MERTOOLS_URL_COLLAPSE_DESC="Redirect any address whose path has more than one slash in a row to the address with single slashes (e.g. <code>//////oferta/mierniki</code> &rarr; <code>/oferta/mierniki</code>). Only the path is changed; the query string after <code>?</code> is left as it is, and the address always stays on this site."

PLG_SYSTEM_MERTOOLS_URL_CODE_LABEL="Redirect type"
PLG_SYSTEM_MERTOOLS_URL_CODE_DESC="301 (permanent) tells search engines the clean address is the right one and moves the ranking to it — recommended. 302 (temporary) does not pass the ranking; use it only while testing."
PLG_SYSTEM_MERTOOLS_URL_CODE_301="301 — permanent (recommended)"
PLG_SYSTEM_MERTOOLS_URL_CODE_302="302 — temporary"

PLG_SYSTEM_MERTOOLS_URL_CF_NOTE="<strong>Still opens with duplicate slashes and does not redirect?</strong> Then your site is behind Cloudflare (or another CDN/proxy) that cleans the address <em>before</em> it reaches the server &mdash; it quietly merges the extra slashes itself, so this plugin never sees them and cannot redirect. The redirect then has to be set at Cloudflare, which is the only place that still knows the original address. <details><summary><strong>Set it up in Cloudflare &mdash; step by step</strong></summary><ol><li>Log in to <code>dash.cloudflare.com</code> and choose the domain.</li><li>Open <strong>Rules &rarr; Redirect Rules</strong> and click <strong>Create rule</strong>.</li><li>Rule name: e.g. <em>Collapse duplicate slashes</em>.</li><li>Under <strong>When incoming requests match</strong> switch to <strong>Edit expression</strong> and paste:<br><code>(raw.http.request.uri ne http.request.uri and (http.request.method eq &quot;GET&quot; or http.request.method eq &quot;HEAD&quot;))</code></li><li>Under <strong>Then</strong> set <strong>Type = Dynamic</strong> and the <strong>URL expression</strong>:<br><code>concat(&quot;https://&quot;, http.host, http.request.uri)</code></li><li>Status code <strong>301</strong>; <strong>Preserve query string = off</strong>.</li><li>Click <strong>Deploy</strong>.</li><li>If it still does not redirect, open <strong>Rules &rarr; Settings &rarr; URL Normalization</strong> and turn on <em>Normalize incoming URLs</em>.</li></ol>Test by opening <code>https://your-site/////oferta</code> &mdash; it should return a 301 to the single-slash address. No paid plan is needed: the rule uses no regular expressions. Leave this plugin's tool on as well &mdash; it still handles any request that reaches the server directly.</details>"

PLG_SYSTEM_MERTOOLS_FIELDSET_HISTORY="Edit history"
PLG_SYSTEM_MERTOOLS_HISTORY_NOTE="Who changed which Gridbox article, product or page, and when. Gridbox does not keep this, so MerTools notes every save in the Gridbox editor and every action of the Gridbox lists by a logged-in user (publish, unpublish, trash, restore, delete, duplicate, move, featured), with what changed: title, status, category, address, content, description, fields, price, SKU, stock and more. The last change is shown under each title in the Gridbox lists, a click opens the whole history of the page. Changes made before MerTools 1.0.3 and imports from CSV files are not in the history."

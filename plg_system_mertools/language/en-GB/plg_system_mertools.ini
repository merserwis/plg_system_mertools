PLG_SYSTEM_MERTOOLS_INTRO_LT_LABEL="“<” in introductions"
PLG_SYSTEM_MERTOOLS_INTRO_LT_DESC="An introduction with “<” that starts no tag (“sensitivity <30 mK”, “RE < 0,5 Ω”) breaks Gridbox's lists on servers with libxml older than 2.9.11: the text is cut at the “<” and the next products fall into this card (the grid or list goes to pieces); the meta description is cut there too. With this on, such a “<” is kept as &lt; — after every save in Gridbox, at the installation of MerTools and once a day — so it is shown as “<” everywhere, also in Gridbox's editor."
PLG_SYSTEM_MERTOOLS_HISTORY_F_BADGES="Badges"

; 1.0.8: discount %
PLG_SYSTEM_MERTOOLS_SHOP_DISCOUNT_FIELD_LABEL="Discount % in the product editor"
PLG_SYSTEM_MERTOOLS_SHOP_DISCOUNT_FIELD_DESC="Next to the sale price in the Gridbox editor of a product: a discount from the regular price (e.g. 10) sets the sale price and the sale prices of all versions/sets, each from its own price. In the lists, “10%” typed as the sale price does the same for the product."
PLG_SYSTEM_MERTOOLS_PRICE_REQUEST_LABEL="Price on request"
PLG_SYSTEM_MERTOOLS_PRICE_REQUEST_DESC="A product without a price (0 or empty in Gridbox) shows a text such as “On request” where its price would be, and one whose models have prices asks to choose a model: on the product page and in the product lists and sliders. Gridbox leaves the place empty. A list or slider whose prices are switched off in the Gridbox settings of that element is left alone, so its priced products do not get the text either. Lists loaded later (filters, more products, search) and a version without a price chosen on the product page get it too. A “lowest price of the last 30 days” line of an Omnibus plugin that says 0,00 is hidden. Replaces a separate script for the same task (on merserwis.pl: plugins/system/omnibus/assets/scprice.js): that script is taken off the pages, nothing has to be deleted on the server."
PLG_SYSTEM_MERTOOLS_PRICE_REQUEST_DEFAULT="On request"
PLG_SYSTEM_MERTOOLS_PRICE_REQUEST_TEXT_LABEL="Text"
PLG_SYSTEM_MERTOOLS_PRICE_REQUEST_TEXT_DESC="Shown instead of the price. Empty: “On request” in the language of the page."
PLG_SYSTEM_MERTOOLS_PRICE_REQUEST_CHOOSE_DEFAULT="Choose a model from the list"
PLG_SYSTEM_MERTOOLS_PRICE_REQUEST_CHOOSE_LABEL="Text when the models have prices"
PLG_SYSTEM_MERTOOLS_PRICE_REQUEST_CHOOSE_DESC="For a product without a price of its own whose versions/models in a Gridbox option list do have prices: shown until a model is chosen, then the price of that model (or the text above, when that model has no price either). In the lists and sliders too. Empty: “Choose a model from the list” in the language of the page."
PLG_SYSTEM_MERTOOLS_PRICE_REQUEST_SIZE_LABEL="Text size (px)"
PLG_SYSTEM_MERTOOLS_PRICE_REQUEST_SIZE_DESC="The size of the text in pixels — a word is usually longer than a price, so a smaller size keeps it on one line. 0: the size Gridbox gives the prices of that element."
PLG_SYSTEM_MERTOOLS_SHOP_OMNIBUS_LABEL="Omnibus: lowest price before a reduction"
PLG_SYSTEM_MERTOOLS_SHOP_OMNIBUS_DESC="The lowest price of the 30 days before a price reduction, next to the reduced price, as the law asks for it (Omnibus directive; in Poland art. 4 of the act on informing about prices). MerTools keeps a history of the regular and sale prices of every product and version (Gridbox keeps none): after every change sent to Gridbox and once an hour. When a price goes down to a sale price, the lowest price that applied in the 30 days before (an earlier sale price of those days included; a product offered for less than 30 days: since it is offered) is kept for as long as that sale lasts. It is shown on the product page, for the version chosen, and under the sale prices of the lists. At the start, the sales running then take the reference of a separate Omnibus plugin when it belongs to the same sale, else the regular price. That plugin’s lines and script (plugins/system/omnibus/assets/scr_omnibus.js) are taken off the pages; the line looks as the plugin’s stylesheet made it. What the plugin did for category pages: setting “Category pages” (tab Page layout). After switching both on and checking the list below, the plugin can be removed."
PLG_SYSTEM_MERTOOLS_OMNIBUS_TEXT_DEFAULT="Lowest price in the 30 days before the reduction: {price}"
PLG_SYSTEM_MERTOOLS_OMNIBUS_TEXT_LABEL="Text"
PLG_SYSTEM_MERTOOLS_OMNIBUS_TEXT_DESC="The line shown with a reduced price; {price} is the lowest price, in the format of the store (currency as in Gridbox). Empty: “Lowest price in the 30 days before the reduction: {price}” in the language of the page."
PLG_SYSTEM_MERTOOLS_OMNIBUS_LISTS_LABEL="Also in the lists"
PLG_SYSTEM_MERTOOLS_OMNIBUS_LISTS_DESC="The same line, in small letters, under the sale price of a product in the lists and sliders that show prices. The law asks for it wherever a reduced price is shown."
PLG_SYSTEM_MERTOOLS_OMNIBUS_PANEL_LABEL="Price history"
PLG_SYSTEM_MERTOOLS_OMNIBUS_PANEL_DESC="What the history holds and, under the figures, every product and version on sale with the lowest price shown for it and where that price came from — worth a look before the separate Omnibus plugin is removed."

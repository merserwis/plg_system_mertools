; Database: indexes of Gridbox tables (0.0.26)
PLG_SYSTEM_MERTOOLS_FIELDSET_DB="Database"
PLG_SYSTEM_MERTOOLS_DB_INDEXES_LABEL="Indexes of Gridbox tables"
PLG_SYSTEM_MERTOOLS_DB_INDEXES_DESC="Gridbox creates its tables with a primary key only, so every lookup of product data, categories, tags and carts reads the whole table. MerTools creates 8 plain indexes (named idx_mt_…) and keeps them: they are checked after Gridbox or MerTools is installed or updated and once a day, and missing ones are created again. An index Gridbox may add one day on the same column counts too. Indexes do not change any data. On merserwis.pl a query of the search index took 6 s, about 0.3 s with the index."
PLG_SYSTEM_MERTOOLS_DB_INDEXES_PANEL_LABEL="Index state"
PLG_SYSTEM_MERTOOLS_DB_INDEXES_PANEL_DESC="The state of every index now. The button creates the missing ones at once (on large tables this may take a few seconds; the site keeps working meanwhile)."

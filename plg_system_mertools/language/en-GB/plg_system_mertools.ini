; MerTools for Gridbox — plugin settings (en-GB)

PLG_SYSTEM_MERTOOLS_XML_DESCRIPTION="MerTools for Gridbox — a set of fixes and optimisations for Balbooa Gridbox that its own settings cannot do, each one a tool you can turn on or off. The Gridbox core files are never changed, so Gridbox updates install cleanly."

PLG_SYSTEM_MERTOOLS_INTRO_LABEL="MerTools for Gridbox"
PLG_SYSTEM_MERTOOLS_INTRO_DESC="Fixes and optimisations for Balbooa Gridbox that cannot be done from Gridbox's own settings. Each tab below is one tool that can be turned on or off. The Gridbox core files are never changed. Problems: report them on GitHub."

PLG_SYSTEM_MERTOOLS_FIELDSET_URL="Canonical URL"
PLG_SYSTEM_MERTOOLS_URL_NOTE="Gridbox serves a page under any number of slashes in the address — <code>/oferta</code>, <code>//oferta</code> and <code>//////oferta</code> all open the same page with status 200. Search engines then see several addresses for one page (duplicate content). This tool redirects every such address to the one clean address."

PLG_SYSTEM_MERTOOLS_URL_COLLAPSE_LABEL="Collapse duplicate slashes"
PLG_SYSTEM_MERTOOLS_URL_COLLAPSE_DESC="Redirect any address whose path has more than one slash in a row to the address with single slashes (e.g. <code>//////oferta/mierniki</code> &rarr; <code>/oferta/mierniki</code>). Only the path is changed; the query string after <code>?</code> is left as it is, and the address always stays on this site."

PLG_SYSTEM_MERTOOLS_URL_CODE_LABEL="Redirect type"
PLG_SYSTEM_MERTOOLS_URL_CODE_DESC="301 (permanent) tells search engines the clean address is the right one and moves the ranking to it — recommended. 302 (temporary) does not pass the ranking; use it only while testing."
PLG_SYSTEM_MERTOOLS_URL_CODE_301="301 — permanent (recommended)"
PLG_SYSTEM_MERTOOLS_URL_CODE_302="302 — temporary"

PLG_SYSTEM_MERTOOLS_URL_CF_NOTE="<strong>Still opens with duplicate slashes and does not redirect?</strong> Then your site is behind Cloudflare (or another CDN/proxy) that cleans the address <em>before</em> it reaches the server &mdash; it quietly merges the extra slashes itself, so this plugin never sees them and cannot redirect. The redirect then has to be set at Cloudflare, which is the only place that still knows the original address. <details><summary><strong>Set it up in Cloudflare &mdash; step by step</strong></summary><ol><li>Log in to <code>dash.cloudflare.com</code> and choose the domain.</li><li>Open <strong>Rules &rarr; Redirect Rules</strong> and click <strong>Create rule</strong>.</li><li>Rule name: e.g. <em>Collapse duplicate slashes</em>.</li><li>Under <strong>When incoming requests match</strong> switch to <strong>Edit expression</strong> and paste:<br><code>(raw.http.request.uri ne http.request.uri and (http.request.method eq &quot;GET&quot; or http.request.method eq &quot;HEAD&quot;))</code></li><li>Under <strong>Then</strong> set <strong>Type = Dynamic</strong> and the <strong>URL expression</strong>:<br><code>concat(&quot;https://&quot;, http.host, http.request.uri)</code></li><li>Status code <strong>301</strong>; <strong>Preserve query string = off</strong>.</li><li>Click <strong>Deploy</strong>.</li><li>If it still does not redirect, open <strong>Rules &rarr; Settings &rarr; URL Normalization</strong> and turn on <em>Normalize incoming URLs</em>.</li></ol>Test by opening <code>https://your-site/////oferta</code> &mdash; it should return a 301 to the single-slash address. No paid plan is needed: the rule uses no regular expressions. Leave this plugin's tool on as well &mdash; it still handles any request that reaches the server directly.</details>"

; --- Dark mode ---
PLG_SYSTEM_MERTOOLS_FIELDSET_SPEED="Page speed"
PLG_SYSTEM_MERTOOLS_SPEED_KEY_LABEL="PageSpeed Insights API key"
PLG_SYSTEM_MERTOOLS_SPEED_KEY_DESC="A key from Google Cloud Console (APIs &amp; Services → Credentials → Create credentials → API key), best restricted to the PageSpeed Insights API. Without a key Google often refuses to measure because the shared free quota is used up. Only administrators see the key; the measuring runs in their browser."
PLG_SYSTEM_MERTOOLS_SPEED_URLS_LABEL="Pages to measure"
PLG_SYSTEM_MERTOOLS_SPEED_URLS_DESC="One page per line: a path on this site (e.g. <code>/</code>, <code>/oferta/…</code>) or a full address starting with <code>https://</code>, also of another site to compare. At most 10. Each is measured on phone and desktop."
PLG_SYSTEM_MERTOOLS_SPEED_RUNS_LABEL="Tests per page"
PLG_SYSTEM_MERTOOLS_SPEED_RUNS_DESC="The PageSpeed Insights score varies by a few points between tests. With 3 or 5 tests the median is kept, so before and after compare fairly."
PLG_SYSTEM_MERTOOLS_SPEED_TOOLS_NOTE_LABEL="Faster pages"
PLG_SYSTEM_MERTOOLS_SPEED_TOOLS_NOTE_DESC="The tools below change the finished page after Gridbox has made it; the Gridbox files are not changed. Each can be switched off. Measure after a change and the panel shows the difference."
PLG_SYSTEM_MERTOOLS_SPEED_IMAGES_LABEL="Images without waiting or jumping"
PLG_SYSTEM_MERTOOLS_SPEED_IMAGES_DESC="Images are shown without waiting and the page does not jump while they arrive. Every image of this site gets its proportions from the file, so the space it needs is kept before it has loaded (Gridbox gives images a 100×100 size; their size on the page stays as Gridbox sets it). The logo, the header and the first section of the page (up to 4 images) load at once, the largest of them first; images further down are loaded by the browser as the visitor scrolls near them. With Gridbox’s own lazy loading on, the images get their real address at once instead of a placeholder loaded by script; pictures in the menu are still loaded by Gridbox. Tracking pixels and images of other sites are left alone."
PLG_SYSTEM_MERTOOLS_SPEED_SHOW_LABEL="Page shown at once"
PLG_SYSTEM_MERTOOLS_SPEED_SHOW_DESC="With Gridbox's “Deferred Loading” on (Settings → Performance), Gridbox moves the styles to the end of the page and hides the whole page until all its scripts have run. On phones that is a few seconds of empty screen and a low PageSpeed score (FCP, LCP). Here the styles go back into the head and the page is shown at once; the scripts still load at the end. Without “Deferred Loading” nothing changes."
PLG_SYSTEM_MERTOOLS_SPEED_MAINPHOTO_LABEL="Main product photo at once"
PLG_SYSTEM_MERTOOLS_SPEED_MAINPHOTO_DESC="The first picture of the product slideshow is shown at once (Gridbox hides it until its script runs) and the browser fetches it first. It is usually the largest element of a product page, the one Google measures LCP by."
PLG_SYSTEM_MERTOOLS_SPEED_VIDEO_LABEL="YouTube background after the page has loaded"
PLG_SYSTEM_MERTOOLS_SPEED_VIDEO_DESC="A section background video (e.g. on the home page) still starts by itself, but at the first mouse move, scroll or touch, or the given number of seconds after the page has loaded. Until then the section looks as it does now while loading. The page does not wait for the YouTube player (about 1 MB of scripts and several MB of video)."
PLG_SYSTEM_MERTOOLS_SPEED_VIDEO_DELAY_LABEL="Start the video at the latest after (seconds)"
PLG_SYSTEM_MERTOOLS_SPEED_VIDEO_DELAY_DESC="Counted from the page load, if the visitor has not interacted before. 0: right after loading."
PLG_SYSTEM_MERTOOLS_SPEED_VIDEO_PHONE_LABEL="On phones"
PLG_SYSTEM_MERTOOLS_SPEED_VIDEO_PHONE_DESC="What instead of the video on small screens and with the data saver on. Without the video a phone downloads about 1 MB less and the page responds sooner. A picture in place of the video becomes the largest element on the screen, so Google counts LCP from the moment it appears: on merserwis.pl LCP got about 1–2 s worse in the test. Without the video LCP does not change."
PLG_SYSTEM_MERTOOLS_SPEED_VIDEO_PHONE_NONE="No video, the section in its background colour (recommended)"
PLG_SYSTEM_MERTOOLS_SPEED_VIDEO_PHONE_IMAGE="A picture instead of the video"
PLG_SYSTEM_MERTOOLS_SPEED_VIDEO_PHONE_VIDEO="The video as on computers"
PLG_SYSTEM_MERTOOLS_SPEED_VIDEO_PHONE_WIDTH_LABEL="A phone is a screen up to (px)"
PLG_SYSTEM_MERTOOLS_SPEED_VIDEO_PHONE_WIDTH_DESC="The browser window width up to which the phone setting applies. Default 768."
PLG_SYSTEM_MERTOOLS_SPEED_VIDEO_PHONE_COLOR_LABEL="Background colour instead of the video"
PLG_SYSTEM_MERTOOLS_SPEED_VIDEO_PHONE_COLOR_DESC="Under the video Gridbox usually has a light background on which the white text of the section would be unreadable. This colour lies under the section overlay (gradient), as the video did. A dark one suits light text."
PLG_SYSTEM_MERTOOLS_SPEED_VIDEO_PHONE_PIC_LABEL="Picture"
PLG_SYSTEM_MERTOOLS_SPEED_VIDEO_PHONE_PIC_DESC="The section background instead of the video. Empty: a frame of the YouTube video (480×360 thumbnail). A light file is best (WebP or JPG up to about 60 KB)."
PLG_SYSTEM_MERTOOLS_SPEED_SCRIPTS_LABEL="Marketing scripts at the first interaction"
PLG_SYSTEM_MERTOOLS_SPEED_SCRIPTS_DESC="Google Tag Manager, Analytics, Google Ads, the Facebook pixel, Clarity and the like start at the first mouse move, scroll, touch or key press, not while the page loads. The page shows and responds sooner. Note: a visit that leaves without any interaction is not counted in statistics or ads."
PLG_SYSTEM_MERTOOLS_SPEED_SCRIPTS_LIST_LABEL="Delay scripts containing"
PLG_SYSTEM_MERTOOLS_SPEED_SCRIPTS_LIST_DESC="One piece per line: a script whose address or code contains it waits for the first interaction. The order of the scripts is kept."
PLG_SYSTEM_MERTOOLS_SPEED_SCRIPTS_KEEP_LABEL="Never delay scripts containing"
PLG_SYSTEM_MERTOOLS_SPEED_SCRIPTS_KEEP_DESC="E.g. the cookie consent banner, which has to appear at once."
PLG_SYSTEM_MERTOOLS_SPEED_SCRIPTS_TIMEOUT_LABEL="Start at the latest after (seconds)"
PLG_SYSTEM_MERTOOLS_SPEED_SCRIPTS_TIMEOUT_DESC="0: only at the first interaction. Otherwise also that many seconds after the page has loaded, without interaction (statistics then include such visits too, but Google’s test may notice them)."
PLG_SYSTEM_MERTOOLS_SPEED_CACHE_NOTE_LABEL="Page cache"
PLG_SYSTEM_MERTOOLS_SPEED_CACHE_NOTE_DESC="Gridbox builds every page anew on every visit: on merserwis.pl 2–4 s before the browser gets the first byte. A guest gets the same page as any other guest, so the finished page is kept in a file and the next guests get it at once. The form token and the nonce are put in for each visitor. The cache is emptied on every save in Joomla or in the Gridbox editor, on a new order, payment, comment or review, and after the set time."
PLG_SYSTEM_MERTOOLS_SPEED_CACHE_LABEL="Pages from the cache for guests"
PLG_SYSTEM_MERTOOLS_SPEED_CACHE_DESC="Never from the cache: logged-in users, addresses with parameters (search, filters; campaign tags utm_*, gclid, fbclid do not count), visitors with products in the cart, a wishlist, another currency or an order in progress, pages with a checkout, login, wishlist or submission form. A product page with Recently viewed products goes from the cache only to visitors who have not viewed another product. Gridbox hit counters still count. A cached answer has the header X-MerTools-Cache: HIT."
PLG_SYSTEM_MERTOOLS_SPEED_CACHE_DATA_LABEL="Gridbox data from the cache"
PLG_SYSTEM_MERTOOLS_SPEED_CACHE_DATA_DESC="Before showing any page, Gridbox’s script fetches the settings of its elements and its texts from the server: two separate Joomla requests, 0.4–0.5 s each, and the page waits for them before it shows anything. Their addresses carry the time of the last change of the page, so they can safely be kept. Works also without the page cache."
PLG_SYSTEM_MERTOOLS_SPEED_CACHE_TTL_LABEL="Keep at most (minutes)"
PLG_SYSTEM_MERTOOLS_SPEED_CACHE_TTL_DESC="After this time a page is built anew even without any change: a guard against changes MerTools does not learn about (e.g. a price import outside Joomla). 5 to 1440, default 240."
PLG_SYSTEM_MERTOOLS_SPEED_CACHE_EXCLUDE_LABEL="Do not keep pages whose address contains"
PLG_SYSTEM_MERTOOLS_SPEED_CACHE_EXCLUDE_DESC="One part of an address per line, e.g. <code>/checkout</code>. Checkout, login, wishlist and submission pages are left out by themselves."
PLG_SYSTEM_MERTOOLS_SPEED_CACHE_COOKIES_LABEL="No cache for visitors with the cookie"
PLG_SYSTEM_MERTOOLS_SPEED_CACHE_COOKIES_DESC="One name per line, in addition to Gridbox’s cart, wishlist, currency, order and comment author cookies, which are always checked."
PLG_SYSTEM_MERTOOLS_SPEED_CACHE_MAX_LABEL="Pages kept at most"
PLG_SYSTEM_MERTOOLS_SPEED_CACHE_MAX_DESC="Above this number the oldest are removed every hour. A page usually takes 40–80 KB."
PLG_SYSTEM_MERTOOLS_SPEED_WARM_LABEL="Warm up the page cache"
PLG_SYSTEM_MERTOOLS_SPEED_WARM_DESC="Pages of the sitemap that have no kept copy (not kept yet, expired, or emptied by a change) are visited in the background as a guest, so that the first visitor does not wait for them to be built. Once a minute, after the response has been sent to the visitor, and only where the server allows it. The home page and the main pages of the sections come first. Needs the sitemap at /sitemap.xml and the server able to reach its own address (a Cloudflare rule or firewall that blocks the server stops the warm-up: a page that does not answer 200 is left alone for the time a kept page stays valid)."
PLG_SYSTEM_MERTOOLS_SPEED_WARM_BATCH_LABEL="Pages per minute"
PLG_SYSTEM_MERTOOLS_SPEED_WARM_BATCH_DESC="How many pages to warm in one round (once a minute while somebody visits the site). More is faster, but loads the server more right after the cache was emptied."

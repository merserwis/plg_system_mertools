PLG_SYSTEM_MERTOOLS_NOTFOUND_REDIRECT_LABEL="Redirect missing pages"
PLG_SYSTEM_MERTOOLS_NOTFOUND_REDIRECT_DESC="Instead of the 404 error page, the visitor is sent to a chosen page, the home page by default. <strong>Not recommended:</strong> Google counts a missing page sent to the home page as missing anyway (a “soft 404”) and keeps crawling it, and agents and crawlers probing addresses (<code>/.well-known/…</code>) take the home page for what they asked. Off by default since 1.6.2: a missing address gets the error page with a real 404, and the log below shows which addresses deserve a redirect of their own. Redirects set for single addresses in Joomla’s Redirects component, a redirect typed in the log, a moved page and a withdrawn page (above) come first. Only pages are redirected: form posts, AJAX and JSON requests get the normal 404 error."
PLG_SYSTEM_MERTOOLS_NOTFOUND_TARGET_LABEL="Redirect to"
PLG_SYSTEM_MERTOOLS_NOTFOUND_TARGET_DESC="The page the visitor is sent to instead of the error page."
PLG_SYSTEM_MERTOOLS_NOTFOUND_TARGET_HOME="The home page"
PLG_SYSTEM_MERTOOLS_NOTFOUND_TARGET_MENU="A menu item"
PLG_SYSTEM_MERTOOLS_NOTFOUND_TARGET_URL="An address (typed in)"
PLG_SYSTEM_MERTOOLS_NOTFOUND_MENUITEM_LABEL="Menu item"
PLG_SYSTEM_MERTOOLS_NOTFOUND_MENUITEM_DESC="A page from the site menu. If the menu item is deleted, the visitor goes to the home page."
PLG_SYSTEM_MERTOOLS_NOTFOUND_URL_LABEL="Address"
PLG_SYSTEM_MERTOOLS_NOTFOUND_URL_DESC="A path on this site, e.g. <code>/kontakt</code>, or a full address starting with <code>https://</code>."
PLG_SYSTEM_MERTOOLS_NOTFOUND_CODE_LABEL="Kind of redirect"
PLG_SYSTEM_MERTOOLS_NOTFOUND_CODE_DESC="Browsers and search engines remember a permanent redirect (301). A temporary one (302) is checked every time, which fits better when the missing pages are coming back soon."
PLG_SYSTEM_MERTOOLS_NOTFOUND_CODE_301="Permanent (301)"
PLG_SYSTEM_MERTOOLS_NOTFOUND_CODE_302="Temporary (302)"
PLG_SYSTEM_MERTOOLS_NOTFOUND_EXCLUDE_LABEL="No redirect for addresses starting with"
PLG_SYSTEM_MERTOOLS_NOTFOUND_EXCLUDE_DESC="One path beginning per line, e.g. <code>/api/</code>. Such addresses get the normal 404 error and are not logged."
PLG_SYSTEM_MERTOOLS_NOTFOUND_MOVED_LABEL="Follow renamed and moved pages"
PLG_SYSTEM_MERTOOLS_NOTFOUND_MOVED_DESC="A Gridbox address ends with the alias of its page or category (<code>/oferta/mierniki/sonel-mpi-540</code>). When a product or post gets another alias, or goes to another category, its old address answers 404 and the links to it in Google, in e-mails and on other sites lead nowhere — Gridbox redirects nothing. With this on, such an address is sent with a <strong>301</strong> to where the page is now: MerTools keeps the aliases of every Gridbox page and category, notes each one that changes (after a save in Gridbox and once an hour) and, for a missing address, looks for the page or category whose alias — of today or an earlier one — is its last part. Of several, the one in the same app and category wins. Only published pages a guest may see. The alias changes the edit history holds (since MerTools 1.0.3) are taken over at the start. The old aliases are listed under the log below."
PLG_SYSTEM_MERTOOLS_NOTFOUND_LOG_LABEL="Log missing addresses"
PLG_SYSTEM_MERTOOLS_NOTFOUND_LOG_DESC="Every page address that answered 404 is kept with the number of visits, the first and the last one, where the last visitor came from (the referring page) and what MerTools did with it. In the log below each address can get a redirect of its own (a 301), with a suggestion of a page with a similar alias. Only pages are logged (not form posts, AJAX, pictures or files) and not the excluded addresses; no IP address or other data of the visitors."
PLG_SYSTEM_MERTOOLS_NOTFOUND_LOG_DAYS_LABEL="Keep for (days)"
PLG_SYSTEM_MERTOOLS_NOTFOUND_LOG_DAYS_DESC="An address not visited for this many days goes from the log (0 = kept). Addresses with a redirect of their own always stay. The log never holds more than 10 000 addresses."
PLG_SYSTEM_MERTOOLS_NOTFOUND_PANEL_LABEL="Missing addresses"
PLG_SYSTEM_MERTOOLS_NOTFOUND_PANEL_DESC="The log of missing addresses, and the old aliases of renamed pages."

PLG_SYSTEM_MERTOOLS_DARK_PAL_CHARCOAL="Charcoal — neutral grey"
PLG_SYSTEM_MERTOOLS_DARK_PAL_MIDNIGHT="Midnight — deep blue"
PLG_SYSTEM_MERTOOLS_DARK_PAL_WARM="Warm — soft brown, gentle on the eyes"
PLG_SYSTEM_MERTOOLS_DARK_PAL_DIM="Dim — low contrast, the gentlest"
PLG_SYSTEM_MERTOOLS_DARK_PAL_SEPIA="Sepia — dark brown paper with cream text"
PLG_SYSTEM_MERTOOLS_DARK_PAL_CUSTOM="Custom — set the colours below"
PLG_SYSTEM_MERTOOLS_DARK_DEFAULT_LABEL="Default for new visitors"
PLG_SYSTEM_MERTOOLS_DARK_DEFAULT_DESC="What a visitor who has not chosen yet sees. Automatic follows their operating system (light or dark). A remembered choice always wins."
PLG_SYSTEM_MERTOOLS_DARK_DEFAULT_AUTO="Automatic — follow the visitor's system"
PLG_SYSTEM_MERTOOLS_DARK_DEFAULT_LIGHT="Light"
PLG_SYSTEM_MERTOOLS_DARK_DEFAULT_DARK="Dark"
PLG_SYSTEM_MERTOOLS_DARK_ACCENT_SITE_LABEL="Accent as in Gridbox"
PLG_SYSTEM_MERTOOLS_DARK_ACCENT_SITE_DESC="Keep the site's Gridbox accent colour (the brand colour) in dark mode. Turn off to set a different accent for dark mode."
PLG_SYSTEM_MERTOOLS_DARK_ACCENT_LABEL="Dark-mode accent"
PLG_SYSTEM_MERTOOLS_DARK_ACCENT_DESC="The accent colour used in dark mode when the Gridbox accent is not kept."
PLG_SYSTEM_MERTOOLS_DARK_TOGGLE_LABEL="Toggle button in the header"
PLG_SYSTEM_MERTOOLS_DARK_TOGGLE_DESC="Show the light/dark toggle button in the header. If off, the theme still follows the default and the visitor's remembered choice, just without a button."
PLG_SYSTEM_MERTOOLS_DARK_PLACE_LABEL="Button position"
PLG_SYSTEM_MERTOOLS_DARK_PLACE_DESC="Where the button sits. In the menu on wide screens; on phones, where the menu is folded behind the hamburger, the button moves beside the hamburger or floats in the corner of the screen, so it is always visible."
PLG_SYSTEM_MERTOOLS_DARK_PLACE_AUTO="At the end of the menu (automatic)"
PLG_SYSTEM_MERTOOLS_DARK_PLACE_START="At the start of the menu"
PLG_SYSTEM_MERTOOLS_DARK_PLACE_END="At the end of the menu"
PLG_SYSTEM_MERTOOLS_DARK_PLACE_FLOAT="Floating — bottom right corner (always visible)"
PLG_SYSTEM_MERTOOLS_DARK_PLACE_FLOAT_LEFT="Floating — bottom left corner"
PLG_SYSTEM_MERTOOLS_DARK_PLACE_A11Y_ABOVE="Floating — above the accessibility button"
PLG_SYSTEM_MERTOOLS_DARK_PLACE_A11Y_BESIDE="Floating — next to the accessibility button"
PLG_SYSTEM_MERTOOLS_DARK_FLOAT_X_LABEL="Distance from the side"
PLG_SYSTEM_MERTOOLS_DARK_FLOAT_X_DESC="Pixels between the floating button and the left or right edge of the screen."
PLG_SYSTEM_MERTOOLS_DARK_FLOAT_Y_LABEL="Distance from the bottom"
PLG_SYSTEM_MERTOOLS_DARK_FLOAT_Y_DESC="Pixels between the floating button and the bottom edge of the screen."
PLG_SYSTEM_MERTOOLS_DARK_A11Y_LABEL="Accessibility button (advanced)"
PLG_SYSTEM_MERTOOLS_DARK_A11Y_DESC="CSS selector of the site’s accessibility button the toggle is placed above or next to. Default <code>._access-icon</code> (the accessibility panel on the left). If it is not found or not visible, the toggle floats in the bottom left corner."
PLG_SYSTEM_MERTOOLS_DARK_MPLACE_LABEL="Toggle position on phones"
PLG_SYSTEM_MERTOOLS_DARK_MPLACE_DESC="Where the toggle stands on narrow screens (below the width set next). <strong>As on desktop</strong> keeps the position above. <strong>In an element of the page</strong> puts the toggle into the element given by a CSS selector, e.g. the mobile header column."
PLG_SYSTEM_MERTOOLS_DARK_MPLACE_SAME="As on desktop"
PLG_SYSTEM_MERTOOLS_DARK_MPLACE_BURGER="Beside the menu button (hamburger)"
PLG_SYSTEM_MERTOOLS_DARK_MPLACE_SELECTOR="In an element of the page (CSS selector)"
PLG_SYSTEM_MERTOOLS_DARK_MPLACE_HIDDEN="Hidden on phones"
PLG_SYSTEM_MERTOOLS_DARK_MBP_LABEL="Phone width up to (px)"
PLG_SYSTEM_MERTOOLS_DARK_MBP_DESC="Screens up to this width use the position for phones. Default 768 (Gridbox phones and small tablets)."
PLG_SYSTEM_MERTOOLS_DARK_MX_LABEL="Distance from the side on phones (px)"
PLG_SYSTEM_MERTOOLS_DARK_MY_LABEL="Distance from the bottom on phones (px)"
PLG_SYSTEM_MERTOOLS_DARK_MSEL_LABEL="Element for the toggle (CSS selector)"
PLG_SYSTEM_MERTOOLS_DARK_MSEL_DESC="CSS selector of the element the toggle goes into on phones, e.g. <code>header .ba-item-logo</code> or <code>#mobile-bar</code>. The first visible match is used. If none is found, the toggle floats in the bottom right corner."
PLG_SYSTEM_MERTOOLS_DARK_MINS_LABEL="Place in the element"
PLG_SYSTEM_MERTOOLS_DARK_MINS_DESC="Where the toggle goes relative to the element chosen above."
PLG_SYSTEM_MERTOOLS_DARK_MINS_APPEND="Inside, at the end"
PLG_SYSTEM_MERTOOLS_DARK_MINS_PREPEND="Inside, at the start"
PLG_SYSTEM_MERTOOLS_DARK_MINS_BEFORE="Before the element"
PLG_SYSTEM_MERTOOLS_DARK_MINS_AFTER="After the element"
PLG_SYSTEM_MERTOOLS_DARK_SIZE_LABEL="Button size"
PLG_SYSTEM_MERTOOLS_DARK_SIZE_DESC="Width and height of the round toggle button in pixels (24–96, default 44). The icon is about half of it."
PLG_SYSTEM_MERTOOLS_DARK_BORDER_LABEL="Button outline"
PLG_SYSTEM_MERTOOLS_DARK_BORDER_DESC="A thin ring around the toggle button (and around the palette dots)."
PLG_SYSTEM_MERTOOLS_DARK_SHADOW_LABEL="Button shadow"
PLG_SYSTEM_MERTOOLS_DARK_SHADOW_DESC="A soft shadow under the floating toggle button and the palette dots."
PLG_SYSTEM_MERTOOLS_DARK_SELECTOR_LABEL="Header element (advanced)"
PLG_SYSTEM_MERTOOLS_DARK_SELECTOR_DESC="CSS selector of the header the button is placed in. Default <code>header.header</code> (the Gridbox header). If the button does not appear, the theme may use a different header; change this selector. If nothing matches, the button floats in the lower corner."
PLG_SYSTEM_MERTOOLS_DARK_TRANSITION_LABEL="Smooth switch"
PLG_SYSTEM_MERTOOLS_DARK_TRANSITION_DESC="Fade the colours when switching between light and dark instead of changing them instantly."
PLG_SYSTEM_MERTOOLS_DARK_LOGO_LABEL="Logo for dark mode"
PLG_SYSTEM_MERTOOLS_DARK_LOGO_DESC="A version of the logo for the dark background (e.g. with light lettering), shown instead of the site logo in dark mode. Best as SVG or a PNG/WebP with a transparent background, the same proportions as the normal logo. Empty = the normal logo stays."
PLG_SYSTEM_MERTOOLS_DARK_LOGO_SEL_LABEL="Logo element (advanced)"
PLG_SYSTEM_MERTOOLS_DARK_LOGO_SEL_DESC="CSS selector of the logo image(s) to replace. Default <code>header .ba-item-logo img</code> (the Gridbox Logo element in the header). Add more after a comma, e.g. <code>header .ba-item-logo img, footer .ba-item-logo img</code>."
PLG_SYSTEM_MERTOOLS_DARK_ADAPTIVE_LABEL="Adapt the site colours"
PLG_SYSTEM_MERTOOLS_DARK_ADAPTIVE_DESC="Gridbox writes some colours straight into the styles of sections and elements (text, links, headings, header and accordion backgrounds), so the dark palette alone does not reach them and text can become unreadable. With this on, in dark mode light backgrounds are darkened and text that is too dark for its background is lightened just enough to be easy to read, keeping its colour tone. Brand colours that are readable stay as they are; the light theme is not changed."
PLG_SYSTEM_MERTOOLS_DARK_VIVID_LABEL="Bright buttons in dark mode"
PLG_SYSTEM_MERTOOLS_DARK_VIVID_DESC="Buttons in a bright brand colour (e.g. orange “Get the offer”). <em>Outline</em> draws them like the other adapted buttons: the dark background of the palette with a ring in their colour. <em>Softer</em> keeps the colour, slightly toned down. <em>Unchanged</em> leaves them as on the light site. Small badges and large coloured blocks always keep their colour."
PLG_SYSTEM_MERTOOLS_DARK_VIVID_OUTLINE="Outline — dark with a ring in the brand colour"

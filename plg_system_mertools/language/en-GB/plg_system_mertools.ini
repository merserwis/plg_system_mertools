PLG_SYSTEM_MERTOOLS_LOCK_TAKEOVER_DESC="Who may take over a page somebody else is editing (after a confirmation). The person who loses it sees a red bar in the editor and cannot save any more; unsaved changes stay in their editor to be copied."

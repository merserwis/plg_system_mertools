PLG_SYSTEM_MERTOOLS_INTRO_LT_LABEL="“<” in introductions"
PLG_SYSTEM_MERTOOLS_INTRO_LT_DESC="An introduction with “<” that starts no tag (“sensitivity <30 mK”, “RE < 0,5 Ω”) breaks Gridbox's lists on servers with libxml older than 2.9.11: the text is cut at the “<” and the next products fall into this card (the grid or list goes to pieces); the meta description is cut there too. With this on, such a “<” is kept as &lt; — after every save in Gridbox, at the installation of MerTools and once a day — so it is shown as “<” everywhere, also in Gridbox's editor."

PLG_SYSTEM_MERTOOLS_NF_UI_BAD_TARGET="This is not a usable address: type a path of this site (e.g. /kontakt) or a full address starting with https://, other than the missing address itself."
PLG_SYSTEM_MERTOOLS_FIELDSET_LAYOUT="Page layout"
PLG_SYSTEM_MERTOOLS_LAYOUT_CLIP_LABEL="No sideways shift on phones"
PLG_SYSTEM_MERTOOLS_LAYOUT_CLIP_DESC="A Gridbox element that sticks out to the right (a row with a slide-in animation or a motion effect, an off-canvas menu) makes phones lay the page out wider than the screen. Gridbox hides that part, but the hamburger in the header, the accessibility button and floating buttons then end up off-screen. This keeps the page as wide as the screen; nothing visible is cut off."
PLG_SYSTEM_MERTOOLS_LAYOUT_CATEGORIES_LABEL="Category pages: now in Better Categories"
PLG_SYSTEM_MERTOOLS_LAYOUT_CATEGORIES_MOVED="The category descriptions and the click on a whole row of Gridbox’s Categories element are done by the plugin <strong>Better Categories for Gridbox</strong> (version 1.7.0 or newer) since MerTools 1.4.0, with more settings: the place of the description and showing only its beginning with a “Read more” button. Its tabs <em>Category description</em> and <em>Navigation and SEO</em>. When the setting <em>Category pages</em> was on here, Better Categories switches both on at its update."
PLG_SYSTEM_MERTOOLS_FIELDSET_FEED="Blog feeds (RSS / Atom)"
PLG_SYSTEM_MERTOOLS_FEED_ENABLED_LABEL="RSS / Atom feeds of the blogs"
PLG_SYSTEM_MERTOOLS_FEED_ENABLED_DESC="Gridbox has no feeds. With this on, every Gridbox blog has an RSS 2.0 and an Atom 1.0 feed of its newest posts: the address of a blog page with <code>?format=feed&amp;type=rss</code> (or <code>&amp;type=atom</code>), e.g. <code>/blog?format=feed&amp;type=rss</code>. A category page gives the posts of that category and its subcategories, a tag or author page the posts of that tag or author. Only what a guest sees on the site: published, public, already started and not ended posts, not in the trash; on a multilingual site those of the language of the page. Feed readers, newsletters (e.g. RSS-to-email) and browsers find the feeds through links in the head of the blog pages."
PLG_SYSTEM_MERTOOLS_FEED_FORMAT_LABEL="Format"
PLG_SYSTEM_MERTOOLS_FEED_FORMAT_DESC="Which feeds are offered. RSS 2.0 is read by everything; Atom 1.0 is the stricter standard, with the date of the last change of each post. With both, an address without <code>type</code> gives RSS; with one, that one, and the other is not found (404)."
PLG_SYSTEM_MERTOOLS_FEED_FORMAT_BOTH="RSS 2.0 and Atom 1.0"
PLG_SYSTEM_MERTOOLS_FEED_FORMAT_RSS="RSS 2.0 only"
PLG_SYSTEM_MERTOOLS_FEED_FORMAT_ATOM="Atom 1.0 only"
PLG_SYSTEM_MERTOOLS_FEED_APPS_LABEL="Blogs with a feed"
PLG_SYSTEM_MERTOOLS_FEED_APPS_DESC="The Gridbox apps that have a feed. None chosen: every blog (apps of the type blog). Other apps with posts (e.g. a portfolio or the shop) can be chosen too; the others then have none (404)."
PLG_SYSTEM_MERTOOLS_FEED_APPS_HINT="Every blog"
PLG_SYSTEM_MERTOOLS_FEED_LIMIT_LABEL="Posts in a feed"
PLG_SYSTEM_MERTOOLS_FEED_LIMIT_DESC="How many of the newest posts a feed holds (1–100, default 20)."
PLG_SYSTEM_MERTOOLS_FEED_TEXT_LABEL="Text of a post"
PLG_SYSTEM_MERTOOLS_FEED_TEXT_DESC="What a feed says about each post besides its title and link. The introduction (Intro Text of the post settings in Gridbox) is shown as HTML; the meta description (SEO settings of the post) as plain text. When the chosen one is empty, the other is taken."
PLG_SYSTEM_MERTOOLS_FEED_TEXT_INTRO="Introduction (else the meta description)"
PLG_SYSTEM_MERTOOLS_FEED_TEXT_META="Meta description (else the introduction)"
PLG_SYSTEM_MERTOOLS_FEED_TEXT_NONE="Title and link only"
PLG_SYSTEM_MERTOOLS_FEED_IMAGE_LABEL="Intro image"
PLG_SYSTEM_MERTOOLS_FEED_IMAGE_DESC="The intro image of the post above its text, and as the picture of the item (RSS enclosure and media:content, Atom enclosure link), which readers and RSS-to-email newsletters show as a thumbnail."
PLG_SYSTEM_MERTOOLS_FEED_ENCLOSURE_LABEL="Image also as an attachment"
PLG_SYSTEM_MERTOOLS_FEED_ENCLOSURE_DESC="The intro image also as the attachment of the item (RSS enclosure and media:content, Atom enclosure link). Off: the image is shown above the text only — some readers (e.g. Feedbro) show an attachment as one more line under the text (“View enclosure”). On: for services that take the item's picture from the attachment (some RSS-to-email newsletters, podcast-style readers)."
PLG_SYSTEM_MERTOOLS_FEED_MORE_LABEL="Link to the full article"
PLG_SYSTEM_MERTOOLS_FEED_MORE_DESC="A button-like link under the text of each item that opens the post on the site (e.g. “Read the full article →”). It takes the reader's link colour; readers that drop styles show it as a plain link."
PLG_SYSTEM_MERTOOLS_FEED_MORE_TEXT_LABEL="Text of the link"
PLG_SYSTEM_MERTOOLS_FEED_MORE_TEXT_DESC="The text of the link to the full article. Empty: “Read the full article” (in the language of the site)."
PLG_SYSTEM_MERTOOLS_FEED_MORE_DEFAULT="Read the full article"
PLG_SYSTEM_MERTOOLS_FEED_HEAD_LABEL="Links in the page head"
PLG_SYSTEM_MERTOOLS_FEED_HEAD_DESC="<code>&lt;link rel=&quot;alternate&quot;&gt;</code> to the feeds in the head of the pages, by which feed readers, browser extensions and search engines find them. Blog pages and their posts: a blog page links its own feed (a category, tag or author page that one and the feed of the whole blog), a post the feed of its blog. Every page: also the feeds of all the blogs on every page of the site."
PLG_SYSTEM_MERTOOLS_FEED_HEAD_BLOG="Blog pages and their posts"
PLG_SYSTEM_MERTOOLS_FEED_HEAD_ALL="Every page"
PLG_SYSTEM_MERTOOLS_FEED_HEAD_NONE="None"
PLG_SYSTEM_MERTOOLS_FEED_TTL_LABEL="Refresh time (minutes)"
PLG_SYSTEM_MERTOOLS_FEED_TTL_DESC="How long feed readers and caches (a browser, Cloudflare) may keep a feed before asking again, in minutes (0–1440, default 60); also the RSS <code>ttl</code>. A reader that asks again gets “not modified” (304) while nothing changed. 0: asked again every time."
PLG_SYSTEM_MERTOOLS_FEED_PANEL_LABEL="Feed addresses"
PLG_SYSTEM_MERTOOLS_FEED_PANEL_DESC="The blogs that have a feed, with the addresses of their feeds as the site shows them (e.g. <code>/blog?format=feed&amp;type=rss</code>), as saved. Give these to readers and newsletter services, or add one in Google Search Console as a sitemap."
PLG_SYSTEM_MERTOOLS_FEED_UI_BLOG="Blog"
PLG_SYSTEM_MERTOOLS_FEED_UI_ADDRESS="Feed"
PLG_SYSTEM_MERTOOLS_FEED_UI_EMPTY="No blog has a feed: Gridbox has no blog, or none of the apps chosen is one."
PLG_SYSTEM_MERTOOLS_FEED_UI_ERROR="The Gridbox blogs could not be read."
PLG_SYSTEM_MERTOOLS_FEED_UI_HINT="A category, tag or author page has a feed too: its address with ?format=feed&type=rss (or atom). Changes of the settings apply after saving."
PLG_SYSTEM_MERTOOLS_FIELDSET_SHOP="Shop"
PLG_SYSTEM_MERTOOLS_SHOP_OPTION_LINKS_LABEL="Links to a product option"
PLG_SYSTEM_MERTOOLS_SHOP_OPTION_LINKS_DESC="When an option or set of a product is chosen, Gridbox adds the choice to the page address, e.g. <code>?Zestawy+Metrel+MI+3155=…</code>. But such a link opened the product with no option selected whenever the option group name has a space, a dot or a square bracket, which is nearly always. With this on, the link opens the product with that option selected, with its price, SKU and images, also when the option name has a symbol written as HTML code, such as a red dot <code>&amp;#128308;</code>, so a customer can be sent a link to a specific set or model."
PLG_SYSTEM_MERTOOLS_CART_ENABLED_LABEL="Tidy up old carts"
PLG_SYSTEM_MERTOOLS_CART_ENABLED_DESC="Gridbox keeps every cart ever started in the database and never removes one, also the carts of orders placed long ago. MerTools removes the carts nobody can open any more. A cart is reached only through Gridbox’s cookie, valid for 7 days after the last change, so MerTools notes when each cart was last used. Orders and their data are not touched; they keep their own copies of the products."
PLG_SYSTEM_MERTOOLS_CART_MODE_LABEL="Removal"
PLG_SYSTEM_MERTOOLS_CART_MODE_DESC="When old carts are removed. The “Clean now” button below works in every mode."
PLG_SYSTEM_MERTOOLS_CART_MODE_MANUAL="By hand only (button below)"
PLG_SYSTEM_MERTOOLS_CART_MODE_DAILY="Automatically once a day"
PLG_SYSTEM_MERTOOLS_CART_MODE_LIMIT="Automatically when there are more carts than the limit"
PLG_SYSTEM_MERTOOLS_CART_LIMIT_LABEL="Cart limit"
PLG_SYSTEM_MERTOOLS_CART_LIMIT_DESC="When the database holds more carts, MerTools removes the ones that can go (checked every hour)."
PLG_SYSTEM_MERTOOLS_CART_DAYS_LABEL="Carts with products: unused for (days)"
PLG_SYSTEM_MERTOOLS_CART_DAYS_DESC="A cart with products is removed when nobody has used it for this many days. At least 8, because the cart cookie is valid for 7 days. MerTools has to watch the carts for the same number of days before it removes the first one. Empty carts do not wait."
PLG_SYSTEM_MERTOOLS_CART_EMPTY_LABEL="Remove empty carts at once"
PLG_SYSTEM_MERTOOLS_CART_EMPTY_DESC="A cart without products holds nothing. If its owner comes back, Gridbox starts a new cart. Carts used in the last hour and the 100 newest are skipped."
PLG_SYSTEM_MERTOOLS_CART_PANEL_LABEL="Carts in the database"
PLG_SYSTEM_MERTOOLS_CART_PANEL_DESC="“Check” shows what would be removed with the settings on screen, also unsaved. “Clean and optimise” removes it at once, in batches, without locking the shop, then rebuilds the cart tables so the database really gets smaller."
PLG_SYSTEM_MERTOOLS_CART_UNSUPPORTED="This site has no Gridbox shop in a MySQL or MariaDB database."
PLG_SYSTEM_MERTOOLS_CART_UI_CARTS="Carts"
PLG_SYSTEM_MERTOOLS_CART_UI_WITH_PRODUCTS="With products"
PLG_SYSTEM_MERTOOLS_CART_UI_EMPTY="Empty"
PLG_SYSTEM_MERTOOLS_CART_UI_PRODUCTS="Cart items"
PLG_SYSTEM_MERTOOLS_CART_UI_WATCH_SINCE="Watched since"

; 1.6.0: sitemap
PLG_SYSTEM_MERTOOLS_FIELDSET_SITEMAP="Sitemap"
PLG_SYSTEM_MERTOOLS_SITEMAP_ENABLED_LABEL="Sitemap of MerTools"
PLG_SYSTEM_MERTOOLS_SITEMAP_ENABLED_DESC="Gridbox writes one <code>sitemap.xml</code> with every address it knows, the same date for most of them (Gridbox gives a page a new date every time any page is saved in its editor) and the tags that robots.txt blocks. With this on, MerTools answers <code>/sitemap.xml</code> with an index and one sitemap per Gridbox app, holding only the addresses worth indexing, each with the date its content last changed. The maps answer at once at <code>/sitemap-…xml</code>; <code>/sitemap.xml</code> itself only after Gridbox's file is gone (button <em>Take over from Gridbox</em> below), because the server sends that file before Joomla runs. Off: nothing changes."
PLG_SYSTEM_MERTOOLS_SITEMAP_SPLIT_LABEL="Split"
PLG_SYSTEM_MERTOOLS_SITEMAP_SPLIT_DESC="One map per Gridbox app (e.g. <code>sitemap-products-2.xml</code>, <code>sitemap-blog-4.xml</code>) and <code>sitemap-pages.xml</code> for the menu items and single pages, under the index <code>/sitemap.xml</code>: Search Console then shows the indexing of the shop, the blog and the pages apart. Or all addresses in <code>/sitemap.xml</code> itself (up to 50,000)."
PLG_SYSTEM_MERTOOLS_SITEMAP_SPLIT_APP="One map per app, under an index"
PLG_SYSTEM_MERTOOLS_SITEMAP_SPLIT_SINGLE="One file"
PLG_SYSTEM_MERTOOLS_SITEMAP_PART_LIMIT_LABEL="Addresses in one file"
PLG_SYSTEM_MERTOOLS_SITEMAP_PART_LIMIT_DESC="A bigger app is split into parts: <code>sitemap-products-2.xml</code>, <code>sitemap-products-2-p2.xml</code>… (1000–50,000, default 10,000; 50,000 is the limit of the sitemap format)."
PLG_SYSTEM_MERTOOLS_SITEMAP_TYPE_MENU_LABEL="Menu items"
PLG_SYSTEM_MERTOOLS_SITEMAP_TYPE_MENU_DESC="The published public menu items of the site (the home page, Gridbox's pages and apps with a menu item of their own, other components)."
PLG_SYSTEM_MERTOOLS_SITEMAP_TYPE_PAGE_LABEL="Pages, products and posts"
PLG_SYSTEM_MERTOOLS_SITEMAP_TYPE_PAGE_DESC="Gridbox's pages: single pages, products, posts. Only published, public, already started and not ended ones."
PLG_SYSTEM_MERTOOLS_SITEMAP_TYPE_CATEGORY_LABEL="Categories"
PLG_SYSTEM_MERTOOLS_SITEMAP_TYPE_CATEGORY_DESC="The category pages of the Gridbox apps. Their date is the newest date of their pages, subcategories included."
PLG_SYSTEM_MERTOOLS_SITEMAP_TYPE_APP_LABEL="Home pages of the apps"
PLG_SYSTEM_MERTOOLS_SITEMAP_TYPE_APP_DESC="The home page of a Gridbox app that has no menu item (with one, it comes in as a menu item)."
PLG_SYSTEM_MERTOOLS_SITEMAP_TYPE_TAG_LABEL="Tags"
PLG_SYSTEM_MERTOOLS_SITEMAP_TYPE_TAG_DESC="The tag pages of the apps. Off by default: they are lists of posts with a title only, and robots.txt of many sites blocks them."
PLG_SYSTEM_MERTOOLS_SITEMAP_TYPE_AUTHOR_LABEL="Authors"
PLG_SYSTEM_MERTOOLS_SITEMAP_TYPE_AUTHOR_DESC="The author pages of the apps. Off by default, for the same reason as the tags."
PLG_SYSTEM_MERTOOLS_SITEMAP_FLAGS_LABEL="Respect Gridbox's include flags"
PLG_SYSTEM_MERTOOLS_SITEMAP_FLAGS_DESC="An item switched off in Gridbox's own sitemap settings (Settings of the page, the category or the app → SEO → Sitemap) stays out."
PLG_SYSTEM_MERTOOLS_SITEMAP_NOINDEX_LABEL="Skip noindex pages"
PLG_SYSTEM_MERTOOLS_SITEMAP_NOINDEX_DESC="A page that tells robots not to index it does not belong in a sitemap (Search Console reports it as an error). The robots of a page as Gridbox writes it: the menu item that shows it, else the page's own setting, else the Global Configuration. A noindex added by the template or a header cannot be seen here: use the excluded paths for it."
PLG_SYSTEM_MERTOOLS_SITEMAP_ROBOTS_LABEL="Skip addresses blocked by robots.txt"
PLG_SYSTEM_MERTOOLS_SITEMAP_ROBOTS_DESC="An address that the site's robots.txt does not let <code>*</code> or Googlebot crawl stays out (Search Console reports it as an error). Read again whenever robots.txt changes."
PLG_SYSTEM_MERTOOLS_SITEMAP_APPS_LABEL="Excluded apps"
PLG_SYSTEM_MERTOOLS_SITEMAP_APPS_DESC="Gridbox apps whose home page, categories, tags, authors and pages stay out."
PLG_SYSTEM_MERTOOLS_SITEMAP_APPS_HINT="None"
PLG_SYSTEM_MERTOOLS_SITEMAP_PATHS_LABEL="Excluded paths"
PLG_SYSTEM_MERTOOLS_SITEMAP_PATHS_DESC="One per line; the whole path is compared, <code>*</code> stands for any characters, letter case is ignored. E.g. <code>/sandbox</code>, <code>/blog/regulamin/*</code>, <code>/promocje/*2025*</code>."
PLG_SYSTEM_MERTOOLS_SITEMAP_PATHS_HINT="/sandbox"
PLG_SYSTEM_MERTOOLS_SITEMAP_TITLES_LABEL="Excluded titles"
PLG_SYSTEM_MERTOOLS_SITEMAP_TITLES_DESC="One per line: an item whose title contains the text stays out, letter case ignored. E.g. <code>[ZAKOŃCZONE]</code> for promotions that have ended."
PLG_SYSTEM_MERTOOLS_SITEMAP_TITLES_HINT="[ZAKOŃCZONE]"
PLG_SYSTEM_MERTOOLS_SITEMAP_PRICES_LABEL="Count price and stock changes"
PLG_SYSTEM_MERTOOLS_SITEMAP_PRICES_DESC="The date of a page is the moment its content changed (texts, fields, title, address, picture), not the moment it was saved. With this on, a change of a product's price, sale price, stock, variations or options counts too. Off by default: a price import would give every product a new date."
PLG_SYSTEM_MERTOOLS_SITEMAP_UNKNOWN_DATE_LABEL="When the date is unknown"
PLG_SYSTEM_MERTOOLS_SITEMAP_UNKNOWN_DATE_DESC="A page MerTools has not seen change yet, and that has no change in the edit history, has no known date. Without a date (the default) is better than a wrong one: Google ignores dates it finds untrue. The date of publishing is the other choice."
PLG_SYSTEM_MERTOOLS_SITEMAP_UNKNOWN_DATE_OMIT="No date"
PLG_SYSTEM_MERTOOLS_SITEMAP_UNKNOWN_DATE_CREATED="The date of publishing"
PLG_SYSTEM_MERTOOLS_SITEMAP_TTL_LABEL="Refresh time"
PLG_SYSTEM_MERTOOLS_SITEMAP_TTL_DESC="The maps are kept as files and built again after this many minutes (5–1440, default 360), and sooner after a change in Gridbox, the menus, robots.txt or these settings. The request that finds them out of date still gets them at once; the new ones are built after its answer."

PLG_SYSTEM_MERTOOLS_CHK_SRV_OPC_FILES_WANT="Joomla may clear it, or PHP checks the files itself"
PLG_SYSTEM_MERTOOLS_CHK_SRV_OPC_FILES_WHY="After a save of the Global Configuration or an update of an extension, Joomla tells OPcache to forget the old version of the file. When the hosting does not allow it (<code>opcache.restrict_api</code>) and PHP does not check the files itself, the site keeps running the old <code>configuration.php</code> and the old files of the update: a saved setting seems to come back (e.g. Platform Specific Caching) until OPcache is reset in the hosting panel or PHP is restarted."
PLG_SYSTEM_MERTOOLS_CHK_V_OPC_NOT_ON="not used (OPcache off)"
PLG_SYSTEM_MERTOOLS_CHK_V_OPC_FLUSH_OK="Joomla clears it after a save"
PLG_SYSTEM_MERTOOLS_CHK_V_OPC_FLUSH_NEVER="Joomla may not clear it and PHP does not check the files: a change works only after an OPcache reset"
PLG_SYSTEM_MERTOOLS_CHK_V_OPC_FLUSH_FREQ="Joomla may not clear it; PHP checks the files every %d s"

; 1.6.2: withdrawn pages answer 410
PLG_SYSTEM_MERTOOLS_NOTFOUND_GONE_LABEL="Withdrawn pages"
PLG_SYSTEM_MERTOOLS_NOTFOUND_GONE_DESC="A Gridbox address ends with the alias of its page. When everything with that alias is unpublished, in the trash, past its end of publishing or deleted (MerTools keeps the aliases of deleted pages from 1.6.2 on), the page is withdrawn: <strong>410 Gone</strong> tells search engines it is not coming back, so they drop it sooner than after a 404 (the visitor sees the same error page). Or send the visitor to the category the page was in (a 301), when it is still there. Comes after a redirect typed in the log and a moved page; a page only unpublished for a while also gets 410, so publish it again soon or switch this off."
PLG_SYSTEM_MERTOOLS_NOTFOUND_GONE_410="410 Gone"
PLG_SYSTEM_MERTOOLS_NOTFOUND_GONE_CATEGORY="Its category (301), else 410"
PLG_SYSTEM_MERTOOLS_NOTFOUND_GONE_OFF="Like any missing page"
PLG_SYSTEM_MERTOOLS_NOTFOUND_GONE_MESSAGE="This page has been removed"
PLG_SYSTEM_MERTOOLS_NF_UI_R_GONE="Withdrawn page (410)"
PLG_SYSTEM_MERTOOLS_NF_UI_R_CATEGORY="Category of a withdrawn page (301)"

; 1.6.3: product data (JSON-LD)
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_LABEL="Product data for search engines (JSON-LD)"
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_DESC="Gridbox fills the product data that Google reads (schema.org Product) from a template: a product without a price gets <code>\"price\": \"0\"</code> with “in stock”, the default template says the product is <em>used</em> and has an empty description, a brand from a link field becomes <code>index.php?option=com_gridbox…</code>, and a line break or a quotation mark in the introduction breaks the whole block, so Google drops it. With this on, MerTools makes the block of a product page from the product itself, correctly encoded: no offer without a price (price on request; a price range when only the versions have prices), a new product, the introduction (or the meta description) as the description, the brand from the product's <em>Producer</em> field, all the pictures of its gallery, the VAT status of the store's prices (Gridbox → Store → Tax) and mpn (below). Other keys of Gridbox's block (e.g. gtin) are kept; other blocks (FAQ) are not touched."
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_MPN_LABEL="Manufacturer's part number (mpn)"
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_MPN_DESC="The manufacturer's number of the product helps Google match it with the same product elsewhere. From the SKU: the whole SKU, or the part after its last slash when the SKU starts with a code of the shop (<code>SONE/WAPRZPN30</code> → <code>WAPRZPN30</code>)."
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_MPN_NONE="None"
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_MPN_SKU="The SKU"
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_MPN_AFTER_SLASH="The SKU after its last /"

; 1.6.4: availability of the product data
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_AVAIL_FIELD_LABEL="Availability from the field"
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_AVAIL_FIELD_DESC="Gridbox gives every product with an empty stock “in stock”. When a field of the product says how soon it ships (e.g. <em>Delivery time</em>, filled by an import), choose it here: its text decides the availability by the rules below. Not a field with the same text on every product (a legend of the colours): every product would get the same value."
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_AVAIL_FIELD_NONE="None"
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_AVAIL_RULES_LABEL="Rules of availability"
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_AVAIL_RULES_DESC="One per line: <code>text = Value</code>. When the field contains the text (letter case ignored), the product gets the value; the first line that matches wins, so put the longer texts first. Values: <code>InStock</code> (ships now), <code>BackOrder</code> (not in stock, can be ordered, ships later), <code>OutOfStock</code> (cannot be bought), <code>PreOrder</code> (before its release), <code>MadeToOrder</code>, <code>LimitedAvailability</code>. E.g.:<br><code>Brak na magazynie = BackOrder</code><br><code>tygodni = BackOrder</code><br><code>W magazynie = InStock</code>"
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_AVAIL_RULES_HINT="Brak na magazynie = BackOrder"
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_AVAIL_DEFAULT_LABEL="Availability without a rule"
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_AVAIL_DEFAULT_DESC="The availability of a product with a price whose field is empty or matches no rule. Keeping Gridbox's (“in stock” for an empty stock) is right when the goods are mostly in stock; when they are mostly ordered from the producer after a sale, <em>Back order</em> matches what the customer is told. Google may treat data that differ from the page as a mismatch."
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_AVAIL_KEEP="Gridbox's"
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_AVAIL_INSTOCK="In stock (InStock)"
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_AVAIL_BACKORDER="Back order (BackOrder)"
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_AVAIL_OUTOFSTOCK="Out of stock (OutOfStock)"
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_AVAIL_PREORDER="Pre-order (PreOrder)"
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_AVAIL_MADETOORDER="Made to order (MadeToOrder)"
PLG_SYSTEM_MERTOOLS_SHOP_JSONLD_AVAIL_LIMITED="Limited (LimitedAvailability)"

; 1.6.5: article data (JSON-LD)
PLG_SYSTEM_MERTOOLS_BLOG_JSONLD_LABEL="Article data for search engines (JSON-LD)"
PLG_SYSTEM_MERTOOLS_BLOG_JSONLD_DESC="Gridbox writes the publishing date of a post's schema in words (<code>12 czerwiec 2020</code>), which search engines do not read as a date, puts the values in unescaped, and a schema copied by hand into a post can be broken. With this on, MerTools makes the BlogPosting block of every post of a blog app from the post itself, correctly encoded: the dates in ISO 8601 with the time zone (<code>2020-06-12T09:30:00+02:00</code>), the date of the last change of its content (from the dates of the sitemap or the edit history), the post's Gridbox authors or else the organization, the publisher with the <code>@id</code> of the organization of the home page (<code>/#organization</code>), the language and the introduction as the description. Other keys of the post's block are kept; other blocks (FAQ) are not touched. Independent of the feeds above."
PLG_SYSTEM_MERTOOLS_BLOG_JSONLD_ORG_LABEL="Name of the organization"
PLG_SYSTEM_MERTOOLS_BLOG_JSONLD_ORG_DESC="The author (when a post has no Gridbox author) and the publisher. Empty: the site name of the Global Configuration. Best the same name as in the organization block of the home page."
PLG_SYSTEM_MERTOOLS_BLOG_JSONLD_ORG_HINT="The site name"
PLG_SYSTEM_MERTOOLS_BLOG_JSONLD_LOGO_LABEL="Logo of the publisher"
PLG_SYSTEM_MERTOOLS_BLOG_JSONLD_LOGO_DESC="Empty: the logo the post's own block names, if any."

; 1.6.6: pages of the lists
PLG_SYSTEM_MERTOOLS_URL_PAGINATION_LABEL="Pages of the lists (?page=N)"
PLG_SYSTEM_MERTOOLS_URL_PAGINATION_DESC="Gridbox gives every page of a list of products or posts (a category, a blog, a tag: <code>?page=2</code>, <code>?page=3</code>…) the canonical of the first page and the same title and description, so search engines take them for copies of page 1 and the products on them are found only through the sitemap. A page past the last one (<code>?page=999</code>) answers with an empty list and links up to page 1000, and <code>?page=0</code> or <code>?page=abc</code> repeat page 1. With this on: page 2 and further get their own canonical (<code>…?page=2</code>) and “– page 2” in the title and the description; a page whose list is empty answers 404 (noindex); a page number that is not one (0, 1, 01, abc) is redirected (301) to the list without it."
PLG_SYSTEM_MERTOOLS_PAGINATION_TITLE="%1$s – page %2$d"
PLG_SYSTEM_MERTOOLS_URL_SORT_GUARD_LABEL="Guard the sorting of the lists (security)"
PLG_SYSTEM_MERTOOLS_URL_SORT_GUARD_DESC="Gridbox puts the sorting of a list from the address (<code>?sort-by=…</code>) into its database query without checking it, so an address with another value gives an error page and can reach the database. Its editor's task that lists posts (<code>editor.getBlogPosts</code>, also with a sorting) checks no rights. With this on (the default), a sorting other than the ones Gridbox offers (default, price low/high, newest, highest rated, most reviewed, most popular) is taken out of the address with a 301 (other requests: 400), and that task needs the right to edit in Gridbox (403). Comments and reviews sort by their own fixed list and are not touched. Nothing changes for visitors."

; Site hygiene
PLG_SYSTEM_MERTOOLS_FIELDSET_HYGIENE="Site hygiene"
PLG_SYSTEM_MERTOOLS_HYGIENE_NOTE="Small things the audits of a site keep finding: a campaign tag in the address of the page’s preview, a doubled language code, cookies without Secure and SameSite, no real Content-Security-Policy. Each one is a switch; they work on the pages kept by the page cache, too."
PLG_SYSTEM_MERTOOLS_HYGIENE_OG_URL_LABEL="No campaign tags in og:url"
PLG_SYSTEM_MERTOOLS_HYGIENE_OG_URL_DESC="Takes <code>?srsltid=</code>, <code>?utm_*</code>, <code>?gclid=</code>, <code>?fbclid=</code> and the like out of <code>og:url</code> and <code>twitter:url</code>. The page cache serves a page to everybody, so a page kept for a visitor who came from Google Shopping would show that tag in its address to all the others (the canonical address was clean all the time)."
PLG_SYSTEM_MERTOOLS_HYGIENE_LANG_LABEL="Short language code of the page"
PLG_SYSTEM_MERTOOLS_HYGIENE_LANG_DESC="<code>lang=&quot;pl-pl&quot;</code> of the <code>&lt;html&gt;</code> tag becomes <code>lang=&quot;pl&quot;</code> (also <code>de-de</code>, <code>cs-cz</code> and the like: a region that repeats the language). <code>en-gb</code>, <code>pt-br</code> stay as they are. Search engines read both; this only makes the code the usual one."
PLG_SYSTEM_MERTOOLS_HYGIENE_COOKIES_LABEL="Secure and SameSite on the cookies"
PLG_SYSTEM_MERTOOLS_HYGIENE_COOKIES_DESC="Adds <code>Secure</code> (on HTTPS) and <code>SameSite=Lax</code> to every cookie the site sets without them, the session cookie included. Lax is what current browsers assume anyway: the cookie is not sent with a form posted from another site. Turn off if a payment or login service that sends the visitor back with a POST loses the session."
PLG_SYSTEM_MERTOOLS_HYGIENE_XSS_LABEL="Drop the X-XSS-Protection header"
PLG_SYSTEM_MERTOOLS_HYGIENE_XSS_DESC="The header is obsolete (browsers no longer have the filter it switched on) and in old ones it was a weakness of its own. Removed when it is sent by Joomla or PHP (the HTTP Headers plugin). When the web server or a CDN sends it, remove it there."
PLG_SYSTEM_MERTOOLS_HYGIENE_CSP_MODE_LABEL="Content-Security-Policy"
PLG_SYSTEM_MERTOOLS_HYGIENE_CSP_MODE_DESC="Sends the policy below with every page. <strong>Report only</strong> blocks nothing: the browser lists what the policy would have blocked in its console (start with this one). <strong>Enforce</strong> blocks it. A policy of Joomla’s own HTTP Headers plugin stays and is applied together with this one."
PLG_SYSTEM_MERTOOLS_HYGIENE_CSP_OFF="Off"
PLG_SYSTEM_MERTOOLS_HYGIENE_CSP_REPORT="Report only"
PLG_SYSTEM_MERTOOLS_HYGIENE_CSP_ENFORCE="Enforce"
PLG_SYSTEM_MERTOOLS_HYGIENE_CSP_LABEL="Policy"
PLG_SYSTEM_MERTOOLS_HYGIENE_CSP_DESC="Directives separated by semicolons. The default cannot break a page: no plug-ins (<code>object-src</code>), no foreign <code>&lt;base&gt;</code>, insecure <code>http://</code> pictures and scripts are loaded over HTTPS. A stricter policy (<code>script-src</code>) has to name every script source of the site (Google Tag Manager, Meta Pixel, Elfsight…): try it in <em>Report only</em> first."

; Finished items out of lists
PLG_SYSTEM_MERTOOLS_LIST_HIDE_WORDS_LABEL="Leave finished items out of the lists"
PLG_SYSTEM_MERTOOLS_LIST_HIDE_WORDS_DESC="Words that mark an item as finished, one per line, in any letter case (e.g. <code>[ZAKOŃCZONE]</code> in the title of a promotion that is over). A card of a Gridbox list (recent posts, a blog, a category, products) with such a word in its title is taken out of the list. <strong>The page itself stays</strong>: it opens, is in the sitemap and in a search, so a visitor who comes to it from a search engine or from an old mail still finds the conditions. Empty = nothing is taken out."
PLG_SYSTEM_MERTOOLS_LIST_HIDE_WHERE_LABEL="Where the finished items are left out"
PLG_SYSTEM_MERTOOLS_LIST_HIDE_WHERE_DESC="On the home page only: the archive (a page of the promotions, the blog) still lists them. On every page: they are not listed anywhere, and can be found only by the address or a search."
PLG_SYSTEM_MERTOOLS_LIST_HIDE_WHERE_HOME="On the home page only"
PLG_SYSTEM_MERTOOLS_LIST_HIDE_WHERE_ALL="In all lists"

PLG_SYSTEM_MERTOOLS_FIELDSET_SCHEMA="Structured data"
PLG_SYSTEM_MERTOOLS_SCHEMA_NOTE="Data about the company that search engines and AI assistants read: the <b>organization</b> (address, hours, tax numbers, accreditation) and the <b>WebSite</b> with the search box on the home page, the <b>BreadcrumbList</b> of the other pages, the <b>Service</b> of the pages of a service. <b>Nothing is filled in for you</b>: every field is empty, an empty field is left out of the data (what the page already has stays), so fill in only what is true and the same as on the site (the footer, the contact page). Check the result with Google's Rich Results Test or validator.schema.org."
PLG_SYSTEM_MERTOOLS_SCHEMA_ON_LABEL="Structured data of the site"
PLG_SYSTEM_MERTOOLS_SCHEMA_ON_DESC="Switches the whole tab on. Off: nothing on the pages is changed. The page cache is cleared when the settings are saved."
PLG_SYSTEM_MERTOOLS_SCHEMA_SP_BC="Breadcrumbs"
PLG_SYSTEM_MERTOOLS_SCHEMA_BC_LABEL="BreadcrumbList on every page but the home page"
PLG_SYSTEM_MERTOOLS_SCHEMA_BC_DESC="The list of the page in JSON-LD: the home page first, absolute addresses, <b>the page itself last</b> (the breadcrumbs of Gridbox leave it out). Taken from the breadcrumbs Gridbox writes in the page, else from a BreadcrumbList the page already has, else from Joomla's path of the page; the page's own list is replaced. The visible breadcrumbs are not touched."
PLG_SYSTEM_MERTOOLS_SCHEMA_HOME_LABEL="Name of the home page in the list"
PLG_SYSTEM_MERTOOLS_SCHEMA_HOME_DESC="Empty: the title of the home menu item."
PLG_SYSTEM_MERTOOLS_SCHEMA_SP_WEB="WebSite (home page)"
PLG_SYSTEM_MERTOOLS_SCHEMA_WEB_LABEL="WebSite on the home page"
PLG_SYSTEM_MERTOOLS_SCHEMA_WEB_DESC="The WebSite block (name, language, the organization as its publisher) with the search box. It goes into the same block as the organization when that is on."
PLG_SYSTEM_MERTOOLS_SCHEMA_SITE_NAME_LABEL="Name of the website"
PLG_SYSTEM_MERTOOLS_SCHEMA_SITE_NAME_DESC="Empty: the name of the organization, else the site name of the Global Configuration."
PLG_SYSTEM_MERTOOLS_SCHEMA_SEARCH_LABEL="Address of the search"
PLG_SYSTEM_MERTOOLS_SCHEMA_SEARCH_DESC="With <code>{search_term_string}</code> where the phrase goes, e.g. <code>/szukaj?query={search_term_string}</code>. Empty: no search box in the data."
PLG_SYSTEM_MERTOOLS_SCHEMA_SP_ORG="Organization"
PLG_SYSTEM_MERTOOLS_SCHEMA_ORG_LABEL="Organization of the home page"
PLG_SYSTEM_MERTOOLS_SCHEMA_ORG_DESC="One organization block with the <code>@id</code> <code>/#organization</code> (the one the blog posts and the products point to), made from the fields below. What the block the home page already has says and the fields do not stays in it (address, coordinates, contact points…). The other pages only point to it."
PLG_SYSTEM_MERTOOLS_SCHEMA_ORG_PAGES_LABEL="Pages with the full organization too"
PLG_SYSTEM_MERTOOLS_SCHEMA_ORG_PAGES_DESC="One address per line, e.g. <code>firma/kontakt</code>. The organization block of such a page (the contact page often has its own, with other phone numbers and no logo) is replaced by the same, full one, so the data do not differ between pages."
PLG_SYSTEM_MERTOOLS_SCHEMA_TYPE_LABEL="Type"
PLG_SYSTEM_MERTOOLS_SCHEMA_TYPE_DESC="<i>LocalBusiness</i> for a firm with a place customers visit or that serves an area, <i>ProfessionalService</i> for a service firm, <i>Store</i> for a shop, <i>Organization</i> when it has no place."
PLG_SYSTEM_MERTOOLS_SCHEMA_NAME_LABEL="Name"
PLG_SYSTEM_MERTOOLS_SCHEMA_NAME_DESC="Empty: the name set for the blog posts (tab Blog feeds), else what the home page's block has."
PLG_SYSTEM_MERTOOLS_SCHEMA_LEGAL_LABEL="Legal name"
PLG_SYSTEM_MERTOOLS_SCHEMA_LEGAL_DESC="As in the register, e.g. <code>Firma Sp. z o.o. Sp. k.</code>."
PLG_SYSTEM_MERTOOLS_SCHEMA_DESCRIPTION_LABEL="Description"
PLG_SYSTEM_MERTOOLS_SCHEMA_DESCRIPTION_DESC="One or two sentences about what the company does."
PLG_SYSTEM_MERTOOLS_SCHEMA_LOGO_LABEL="Logo"
PLG_SYSTEM_MERTOOLS_SCHEMA_LOGO_DESC="Empty: the logo of the publisher of the blog posts, else the one the home page's block has. Check that the address opens (the logo of the old block gave a 403)."
PLG_SYSTEM_MERTOOLS_SCHEMA_IMAGE_LABEL="Picture of the firm"
PLG_SYSTEM_MERTOOLS_SCHEMA_IMAGE_DESC="A photo of the building or the shop (Google shows it for local firms)."
PLG_SYSTEM_MERTOOLS_SCHEMA_PHONE_LABEL="Main phone"
PLG_SYSTEM_MERTOOLS_SCHEMA_PHONE_DESC="In the international form, e.g. <code>+48 22 000 00 00</code>. More numbers: Contact points below."
PLG_SYSTEM_MERTOOLS_SCHEMA_EMAIL_LABEL="E-mail"
PLG_SYSTEM_MERTOOLS_SCHEMA_EMAIL_DESC="The public address of the firm."
PLG_SYSTEM_MERTOOLS_SCHEMA_MAP_LABEL="Map"
PLG_SYSTEM_MERTOOLS_SCHEMA_MAP_DESC="The address of the firm's place on a map (Google Maps link)."
PLG_SYSTEM_MERTOOLS_SCHEMA_VAT_LABEL="NIP (VAT number)"
PLG_SYSTEM_MERTOOLS_SCHEMA_VAT_DESC="As in the footer, e.g. <code>PL0000000000</code>."
PLG_SYSTEM_MERTOOLS_SCHEMA_KRS_LABEL="KRS number"
PLG_SYSTEM_MERTOOLS_SCHEMA_KRS_DESC="As in the footer; written as an identifier of the kind KRS."
PLG_SYSTEM_MERTOOLS_SCHEMA_FOUNDED_LABEL="Founded"
PLG_SYSTEM_MERTOOLS_SCHEMA_FOUNDED_DESC="A year or a date: <code>1990</code> or <code>1990-05-17</code>. Another form is left out."
PLG_SYSTEM_MERTOOLS_SCHEMA_STREET_LABEL="Street and number"
PLG_SYSTEM_MERTOOLS_SCHEMA_STREET_DESC="Street and number"
PLG_SYSTEM_MERTOOLS_SCHEMA_POSTAL_LABEL="Postal code"
PLG_SYSTEM_MERTOOLS_SCHEMA_POSTAL_DESC="One code, the same as on the contact page, the invoice and Google."
PLG_SYSTEM_MERTOOLS_SCHEMA_CITY_LABEL="City"
PLG_SYSTEM_MERTOOLS_SCHEMA_CITY_DESC="City"
PLG_SYSTEM_MERTOOLS_SCHEMA_REGION_LABEL="Voivodeship / region"
PLG_SYSTEM_MERTOOLS_SCHEMA_REGION_DESC="Voivodeship / region"
PLG_SYSTEM_MERTOOLS_SCHEMA_COUNTRY_LABEL="Country code"
PLG_SYSTEM_MERTOOLS_SCHEMA_COUNTRY_DESC="Two letters; empty: <code>PL</code> when an address is given."
PLG_SYSTEM_MERTOOLS_SCHEMA_LAT_LABEL="Latitude"
PLG_SYSTEM_MERTOOLS_SCHEMA_LAT_DESC="Decimal degrees, e.g. <code>52.2297</code>. Both coordinates are needed."
PLG_SYSTEM_MERTOOLS_SCHEMA_LNG_LABEL="Longitude"
PLG_SYSTEM_MERTOOLS_SCHEMA_LNG_DESC="e.g. <code>21.0122</code>"
PLG_SYSTEM_MERTOOLS_SCHEMA_HOURS_LABEL="Opening hours"
PLG_SYSTEM_MERTOOLS_SCHEMA_HOURS_DESC="One line each: days and hours, e.g. <code>Mo-Fr 08:00-16:00</code>. Days: Mo Tu We Th Fr Sa Su or Pn Wt Śr Cz Pt So Nd; a range (<code>Mo-Fr</code>) or a list (<code>Mo,We</code>). If the lab or the service has other hours than the shop, write only those of the place the address is of."
PLG_SYSTEM_MERTOOLS_SCHEMA_CONTACTS_LABEL="Contact points"
PLG_SYSTEM_MERTOOLS_SCHEMA_CONTACTS_DESC="One per line: <code>phone | kind | languages | e-mail</code>, e.g. <code>+48 22 000 00 00 | customer service | pl,en | biuro@firma.pl</code>. Give each number its own kind (<code>sales</code>, <code>technical support</code>, <code>customer service</code>), so two numbers are not both “technical support”. Only the phone is required."
PLG_SYSTEM_MERTOOLS_SCHEMA_CREDENTIALS_LABEL="Accreditations and certificates"
PLG_SYSTEM_MERTOOLS_SCHEMA_CREDENTIALS_DESC="One per line: <code>name | issued by | address of the issuer</code>. Write only what is true and that the body confirms (the scope and the label of the standard, the date), e.g. <code>Accreditation no. AP 000 (ISO/IEC 17025) | Polish Centre for Accreditation | https://www.pca.gov.pl/</code>. When it is renewed, change the date here and on the pages."
PLG_SYSTEM_MERTOOLS_SCHEMA_MEMBERS_LABEL="Member of"
PLG_SYSTEM_MERTOOLS_SCHEMA_MEMBERS_DESC="One per line: <code>name | address</code> (the address is optional), e.g. an association."
PLG_SYSTEM_MERTOOLS_SCHEMA_KNOWS_LABEL="Areas of competence"
PLG_SYSTEM_MERTOOLS_SCHEMA_KNOWS_DESC="One per line, in the words of your customers."
PLG_SYSTEM_MERTOOLS_SCHEMA_SAMEAS_LABEL="Profiles of the firm"
PLG_SYSTEM_MERTOOLS_SCHEMA_SAMEAS_DESC="One address per line: Facebook, LinkedIn, YouTube, Wikidata… Only complete addresses (https://…) are written."
PLG_SYSTEM_MERTOOLS_SCHEMA_SP_SRV="Services"
PLG_SYSTEM_MERTOOLS_SCHEMA_SERVICES_LABEL="Pages of a service"
PLG_SYSTEM_MERTOOLS_SCHEMA_SERVICES_DESC="One page per line: <code>address | name | type of the service | description</code>, e.g. <code>wzorcowanie-miernikow | Calibration of meters | Calibration of measuring instruments | Accredited calibration with a certificate.</code> Only the address is required: an empty name is the heading of the page, an empty description its meta description. The page gets a Service block with the organization as provider. No price is written."
PLG_SYSTEM_MERTOOLS_SCHEMA_HUB_LABEL="Main page of the services"
PLG_SYSTEM_MERTOOLS_SCHEMA_HUB_DESC="The address of the page that lists the others (one of the lines above): its Service block gets the list of the other services as an offer catalog."
PLG_SYSTEM_MERTOOLS_SCHEMA_CATALOG_LABEL="Name of the catalog"
PLG_SYSTEM_MERTOOLS_SCHEMA_CATALOG_DESC="Empty: the name of the main page."
PLG_SYSTEM_MERTOOLS_SCHEMA_STYPE_LABEL="Type of the service by default"
PLG_SYSTEM_MERTOOLS_SCHEMA_STYPE_DESC="For a line with no type."
PLG_SYSTEM_MERTOOLS_SCHEMA_AREA_LABEL="Area served"
PLG_SYSTEM_MERTOOLS_SCHEMA_AREA_DESC="A country, e.g. <code>Polska</code>. Empty: not written."
PLG_SYSTEM_MERTOOLS_SCHEMA_AUDIENCE_LABEL="Audience"
PLG_SYSTEM_MERTOOLS_SCHEMA_AUDIENCE_DESC="e.g. <code>Firmy, laboratoria, służby utrzymania ruchu</code>. Empty: not written."

; Apps against deletion
PLG_SYSTEM_MERTOOLS_FIELDSET_APPS="Apps protection"
PLG_SYSTEM_MERTOOLS_APPS_NOTE="Gridbox deletes an app — a shop, a blog — with one click on the X of its card on the Gridbox dashboard and one “Delete” in its question: the app, every product or post in it, its categories, fields, product data, tags, comments and reviews, past the trash and for good. MerTools locks every app against it (the X shows a lock), and writes a copy of an app before each deletion that is allowed and once a day. A copy can be restored here: it brings back what is missing and changes nothing that exists."
PLG_SYSTEM_MERTOOLS_APPS_PROTECT_LABEL="Lock the apps against deletion"
PLG_SYSTEM_MERTOOLS_APPS_PROTECT_DESC="Gridbox refuses to delete an app that is not chosen below, wherever the deletion comes from (the X of a card, the trash icon in a folder of apps, Delete app in the toolbar, a request sent by hand). Off: apps are deleted as in Gridbox itself."
PLG_SYSTEM_MERTOOLS_APPS_UNLOCKED_LABEL="Apps that may be deleted"
PLG_SYSTEM_MERTOOLS_APPS_UNLOCKED_DESC="To delete an app: choose it here, save, delete it in Gridbox (a copy is written first), then take it off this list. Every other app stays locked, apps added later too."
PLG_SYSTEM_MERTOOLS_APPS_UNLOCKED_HINT="None: every app is locked"
PLG_SYSTEM_MERTOOLS_APPS_BACKUP_DELETE_LABEL="Copy before a deletion"
PLG_SYSTEM_MERTOOLS_APPS_BACKUP_DELETE_DESC="Before Gridbox deletes an app, a copy of everything it deletes with it is written (listed below as “Before deletion”)."
PLG_SYSTEM_MERTOOLS_APPS_BACKUP_REQUIRED_LABEL="No copy, no deletion"
PLG_SYSTEM_MERTOOLS_APPS_BACKUP_REQUIRED_DESC="When the copy cannot be written (the folder cannot be written, the disk is full), the app is not deleted and Gridbox shows why."
PLG_SYSTEM_MERTOOLS_APPS_BACKUP_AUTO_LABEL="Regular copies"
PLG_SYSTEM_MERTOOLS_APPS_BACKUP_AUTO_DESC="A copy of each app once a day or once a week, made after a visit to the site (the visitor does not wait for it where the server allows it). An app that has not changed since its last copy gets no new one. Protects against what the lock does not: products deleted one by one from the trash, an import gone wrong."
PLG_SYSTEM_MERTOOLS_APPS_BACKUP_AUTO_DAILY="Daily"
PLG_SYSTEM_MERTOOLS_APPS_BACKUP_AUTO_WEEKLY="Weekly"
PLG_SYSTEM_MERTOOLS_APPS_BACKUP_AUTO_OFF="Off"
PLG_SYSTEM_MERTOOLS_APPS_BACKUP_KEEP_LABEL="Regular copies kept per app"
PLG_SYSTEM_MERTOOLS_APPS_BACKUP_KEEP_DESC="Older regular copies are deleted. Copies made before a deletion or by hand are kept until deleted here."
PLG_SYSTEM_MERTOOLS_APPS_BACKUP_PATH_LABEL="Folder of the copies"
PLG_SYSTEM_MERTOOLS_APPS_BACKUP_PATH_DESC="Relative to the site root, or an absolute path (best outside the web root, if the server allows it). Empty: administrator/backups/mertools, which MerTools closes to the web (.htaccess, web.config). Copies of the old folder are not moved."
PLG_SYSTEM_MERTOOLS_APPS_PANEL_LABEL="Copies of the apps"
PLG_SYSTEM_MERTOOLS_APPS_PANEL_DESC="Each copy holds the rows of the app in Gridbox's tables and the files Gridbox deletes with it (styles of the pages, files of the fields, attachments of comments and reviews), as a gzip file of JSON lines. Restore brings back the app when it is gone, and the categories, fields, tags and products or posts that are missing, each with its product data, fields, tags, comments and reviews; nothing that exists is changed or overwritten. Smart Search: index the site again after a restore."
PLG_SYSTEM_MERTOOLS_APPS_REFUSED="Not deleted: the app “%s” is protected by MerTools. To delete it, choose it under “Apps that may be deleted” (System → Plugins → MerTools for Gridbox, tab “Apps protection”)."
PLG_SYSTEM_MERTOOLS_APPS_BACKUP_FAILED="Not deleted: MerTools could not write the copy of the app “%1$s” (%2$s)."
PLG_SYSTEM_MERTOOLS_APPS_JS_REFUSED="The app “%s” is protected against deletion by MerTools. To delete it, choose it under “Apps that may be deleted” in MerTools (tab “Apps protection”); a copy is written first."

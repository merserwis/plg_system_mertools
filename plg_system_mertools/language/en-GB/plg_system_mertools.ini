PLG_SYSTEM_MERTOOLS_DBIDX_UI_OK_OTHER="present (index %s)"
PLG_SYSTEM_MERTOOLS_DBIDX_UI_MISSING="missing"
PLG_SYSTEM_MERTOOLS_DBIDX_UI_NO_TABLE="no table (this part of Gridbox is not used)"
PLG_SYSTEM_MERTOOLS_DBIDX_UI_FIX="Check and create missing"
PLG_SYSTEM_MERTOOLS_DBIDX_UI_FIXED="Indexes created: %d."
PLG_SYSTEM_MERTOOLS_DBIDX_UI_NOTHING="All indexes are in place."

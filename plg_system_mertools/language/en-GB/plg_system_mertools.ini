; 1.0.5: edit lock
PLG_SYSTEM_MERTOOLS_FIELDSET_LOCK="Edit lock"
PLG_SYSTEM_MERTOOLS_LOCK_NOTE="One person at a time in the Gridbox editor of an article, product or page. Gridbox has no lock of its own, so two people could edit the same page and the later save would overwrite the other one's work. Whoever opens the editor first holds the page; the others see who edits it and since when, and the page is marked with 🔒 in the Gridbox lists. The open editor confirms the lock every 30 s; it is free again when the editor is closed, 2 minutes after the editor stopped answering (a closed laptop) or after the idle time below. A save from an editor that no longer holds the lock (it was taken over) is refused, so nothing is overwritten."
PLG_SYSTEM_MERTOOLS_LOCK_ENABLED_LABEL="Lock pages being edited"
PLG_SYSTEM_MERTOOLS_LOCK_ENABLED_DESC="Off: anybody may open a page that somebody else is editing, as in Gridbox itself."

PLG_SYSTEM_MERTOOLS="System - MerTools for Gridbox"
PLG_SYSTEM_MERTOOLS_XML_DESCRIPTION="MerTools for Gridbox — fixes and optimisations for Balbooa Gridbox that its own settings cannot do (e.g. redirect duplicate-slash addresses to one clean address for SEO). The Gridbox core files are never changed."
PLG_SYSTEM_MERTOOLS_INSTALL_CATEGORIES_MOVED="MerTools for Gridbox 1.4.0: the setting Category pages (category descriptions, the rows of Gridbox’s Categories element) is now in Better Categories for Gridbox. Install or update Better Categories to 1.7.0: it switches both on by itself. Until then the category pages show the text “Category Description” where the description was."

; strony narzędzi
COM_MERTOOLS_PAGE_CACHE="Pamięć stron"
COM_MERTOOLS_PAGE_CACHE_DESC="Gotowe strony dla gości wysyłane od razu, bez budowania ich od nowa przez Gridbox, i podgrzewanie tej pamięci w tle."
COM_MERTOOLS_PAGE_IMAGES="Obrazy"
COM_MERTOOLS_PAGE_IMAGES_DESC="Obrazki, które nie przesuwają strony przy wczytywaniu, i ich lżejsze kopie WebP w rozmiarze ekranu."
COM_MERTOOLS_PAGE_MEASURE="Pomiary szybkości"
COM_MERTOOLS_PAGE_MEASURE_DESC="Pomiary PageSpeed Insights wybranych stron, zapisywane, żeby było widać, co dała każda zmiana."
COM_MERTOOLS_PAGE_CHECKS="Diagnostyka"
COM_MERTOOLS_PAGE_CHECKS_DESC="Zalecane ustawienia Gridboxa, Joomli i serwera: co jest ustawione teraz, co powinno być i gdzie to zmienić."
COM_MERTOOLS_PAGE_SITEMAP="Mapa witryny"
COM_MERTOOLS_PAGE_SITEMAP_DESC="Mapa witryny XML stron Gridboxa i menu Joomli, z prawdziwymi datami zmian, budowana od nowa po każdej edycji."
COM_MERTOOLS_PAGE_NOTFOUND="Strony 404"
COM_MERTOOLS_PAGE_NOTFOUND_DESC="Dziennik brakujących adresów, przekierowania stron o zmienionym adresie i odpowiedź 410 dla stron wycofanych."
COM_MERTOOLS_PAGE_OMNIBUS="Omnibus"
COM_MERTOOLS_PAGE_OMNIBUS_DESC="Najniższa cena z 30 dni przed obniżką przy produktach w promocji (dyrektywa Omnibus) i historia cen, której Gridbox nie prowadzi."
COM_MERTOOLS_PAGE_CARTS="Koszyki"
COM_MERTOOLS_PAGE_CARTS_DESC="Usuwanie starych koszyków sklepu Gridbox, do których nikt już nie wróci. Zamówienia zostają."
COM_MERTOOLS_PAGE_HISTORY="Historia edycji"
COM_MERTOOLS_PAGE_HISTORY_DESC="Kto i kiedy zmienił stronę, wpis lub produkt w Gridboxie i co dokładnie się zmieniło."
COM_MERTOOLS_PAGE_APPS="Aplikacje Gridboxa"
COM_MERTOOLS_PAGE_APPS_DESC="Ochrona aplikacji Gridboxa (blog, sklep) przed przypadkowym usunięciem i ich kopie zapasowe."
COM_MERTOOLS_PAGE_DATABASE="Baza danych"
COM_MERTOOLS_PAGE_DATABASE_DESC="Indeksy, które przyspieszają zapytania Gridboxa, i naprawa wstępów ze znakiem „<”."
COM_MERTOOLS_PAGE_CONFIG="Konfiguracja"
COM_MERTOOLS_PAGE_CONFIG_DESC="Ustawienia, które wybiera się raz. Każda zakładka to jedno narzędzie; to, czego nie potrzebujesz, zostaw wyłączone."

; zakładki konfiguracji jako kafelki

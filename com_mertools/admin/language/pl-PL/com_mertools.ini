COM_MERTOOLS_CFG_URL_DESC="Jeden czysty adres strony, ochrona sortowania list i strony list ?page=N."
COM_MERTOOLS_CFG_HYGIENE="Higiena strony"
COM_MERTOOLS_CFG_HYGIENE_DESC="og:url bez znaczników kampanii, bezpieczne ciasteczka, krótki kod języka i opcjonalny Content-Security-Policy."
COM_MERTOOLS_CFG_SCHEMA="Dane strukturalne"
COM_MERTOOLS_CFG_SCHEMA_DESC="Organizacja, WebSite i okruszki w JSON-LD dla wyszukiwarek. Dane firmy wpisujesz raz."
COM_MERTOOLS_CFG_BLOG="Blog"
COM_MERTOOLS_CFG_BLOG_DESC="Kanały RSS / Atom blogów Gridboxa i dane artykułów (BlogPosting) dla wyszukiwarek."
COM_MERTOOLS_CFG_SHOP="Sklep"
COM_MERTOOLS_CFG_SHOP_DESC="Linki do opcji produktu, cena na zapytanie i dane produktu (JSON-LD) dla wyszukiwarek."
COM_MERTOOLS_CFG_SPEED="Pierwszy widok"
COM_MERTOOLS_CFG_SPEED_DESC="Strona widoczna od razu: ikony, główne zdjęcie, filmy, okienka i skrypty marketingowe nie wstrzymują wczytywania."
COM_MERTOOLS_CFG_LAYOUT="Układ strony"
COM_MERTOOLS_CFG_LAYOUT_DESC="Slidery postów w kilku rzędach, bez przesuwania strony w bok na telefonach, zakończone pozycje poza listami."
COM_MERTOOLS_CFG_TABS="Zakładki"
COM_MERTOOLS_CFG_TABS_DESC="Zakładki Gridboxa na telefonach jako sekcje rozwijane i linki do konkretnej zakładki."
COM_MERTOOLS_CFG_TEL="Numery telefonów"
COM_MERTOOLS_CFG_TEL_DESC="Numery telefonów w treści jako linki „kliknij, aby zadzwonić”."
COM_MERTOOLS_CFG_DARK="Tryb ciemny"
COM_MERTOOLS_CFG_DARK_DESC="Ciemny wygląd strony dla odwiedzających, z przełącznikiem i paletami kolorów."
COM_MERTOOLS_CFG_LISTS="Listy w panelu"
COM_MERTOOLS_CFG_LISTS_DESC="Wybór kolumn i szybka edycja w listach Gridboxa, przeciąganie plików do menedżera mediów."
COM_MERTOOLS_CFG_LOCK="Blokada edycji"
COM_MERTOOLS_CFG_LOCK_DESC="Strona otwarta w edytorze Gridboxa przez jedną osobę jest zablokowana dla innych."
COM_MERTOOLS_CFG_EDITOR="Zapisywanie w edytorze"
COM_MERTOOLS_CFG_EDITOR_DESC="Ostrzeżenie przed zamknięciem edytora Gridboxa z niezapisanymi zmianami i automatyczny zapis co kilka minut."


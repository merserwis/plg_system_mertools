; szybka konfiguracja
COM_MERTOOLS_SETUP_INTRO="Najważniejsze narzędzia w jednym miejscu. Przy każdym jest zaznaczone, czy jest zalecane dla większości stron, a przycisk niżej włącza wszystkie zalecane (opcjonalnych nie rusza). Zapisywane są tylko przełączniki, które zmienisz. Szczegóły każdego narzędzia znajdziesz potem na jego stronie."
COM_MERTOOLS_SETUP_RECOMMENDED_ALL="Włącz zalecane"
COM_MERTOOLS_SETUP_RECOMMENDED_ON="Zalecane"
COM_MERTOOLS_SETUP_RECOMMENDED_OFF="Opcjonalne"
COM_MERTOOLS_SETUP_SAVED="Szybka konfiguracja zapisana. Zmienione ustawienia: %d."
COM_MERTOOLS_SETUP_SAVED_0="Szybka konfiguracja zapisana, bez zmian w ustawieniach."
COM_MERTOOLS_SETUP_SAVED_1="Szybka konfiguracja zapisana. Zmienione ustawienia: 1."
COM_MERTOOLS_SETUP_URL_COLLAPSE_SLASHES_LABEL="Jeden adres strony"
COM_MERTOOLS_SETUP_URL_COLLAPSE_SLASHES_DESC="Adresy z powielonymi ukośnikami (//strona) są przekierowywane na jeden czysty adres, więc wyszukiwarki nie widzą duplikatów."
COM_MERTOOLS_SETUP_URL_SORT_GUARD_LABEL="Ochrona sortowania list"
COM_MERTOOLS_SETUP_URL_SORT_GUARD_DESC="Sortowanie list, którego Gridbox nie oferuje, jest usuwane z adresu. Chroni starsze wersje Gridboxa (bezpieczeństwo)."
COM_MERTOOLS_SETUP_QS_HYGIENE_LABEL="Higiena strony"
COM_MERTOOLS_SETUP_QS_HYGIENE_DESC="og:url bez znaczników kampanii (utm_…), ciasteczka z Secure i SameSite i bez przestarzałego nagłówka X-XSS-Protection."
COM_MERTOOLS_SETUP_SPEED_CACHE_LABEL="Pamięć stron dla gości"
COM_MERTOOLS_SETUP_SPEED_CACHE_DESC="Gotowe strony wysyłane gościom od razu, zwykle kilka razy szybciej, z podgrzewaniem w tle. Po włączeniu sprawdź jako gość (okno prywatne), czy koszyk, formularze i treści zmieniające się na stronie działają."
COM_MERTOOLS_SETUP_QS_FIRSTVIEW_LABEL="Szybszy pierwszy widok"
COM_MERTOOLS_SETUP_QS_FIRSTVIEW_DESC="Strona widoczna od razu: style ikon, okienka (popupy) i filmy YouTube w tle nie wstrzymują wczytywania."
COM_MERTOOLS_SETUP_QS_IMAGES_LABEL="Lżejsze obrazki"
COM_MERTOOLS_SETUP_QS_IMAGES_DESC="Obrazki, przy których strona nie skacze, i ich kopie WebP w rozmiarze ekranu, robione w tle."
COM_MERTOOLS_SETUP_SITEMAP_ENABLED_LABEL="Mapa witryny"
COM_MERTOOLS_SETUP_SITEMAP_ENABLED_DESC="Mapa XML wszystkich stron z prawdziwymi datami zmian. Jeśli Gridbox ma już swoją mapę, w panelu mapy porównasz obie i przejmiesz adres /sitemap.xml."
COM_MERTOOLS_SETUP_QS_NOTFOUND_LABEL="Dziennik 404 i przeniesione strony"
COM_MERTOOLS_SETUP_QS_NOTFOUND_DESC="Brakujące adresy są zapisywane do przejrzenia, a strony, którym zmieniono adres w Gridboxie, przekierowane na nowy adres (301)."
COM_MERTOOLS_SETUP_HISTORY_ENABLED_LABEL="Historia edycji"
COM_MERTOOLS_SETUP_HISTORY_ENABLED_DESC="Zapis zmian stron, wpisów i produktów Gridboxa: kto, kiedy i co zmienił."
COM_MERTOOLS_SETUP_LOCK_ENABLED_LABEL="Blokada edycji"
COM_MERTOOLS_SETUP_LOCK_ENABLED_DESC="Strona otwarta w edytorze przez jedną osobę jest zablokowana dla innych, więc nikt nie nadpisze cudzej pracy."
COM_MERTOOLS_SETUP_QS_APPS_LABEL="Ochrona aplikacji"
COM_MERTOOLS_SETUP_QS_APPS_DESC="Aplikacji Gridboxa (blog, sklep) nie da się usunąć przez przypadek, a przed usunięciem powstaje kopia zapasowa."
COM_MERTOOLS_SETUP_DB_INDEXES_LABEL="Indeksy bazy Gridboxa"
COM_MERTOOLS_SETUP_DB_INDEXES_DESC="Indeksy tabel Gridboxa, których Gridbox sam nie zakłada: listy, filtry i koszyk działają szybciej przy wielu stronach i produktach."
COM_MERTOOLS_SETUP_SHOP_JSONLD_LABEL="Dane produktów dla wyszukiwarek"
COM_MERTOOLS_SETUP_SHOP_JSONLD_DESC="Poprawne dane produktu (cena, dostępność, marka) w JSON-LD, bez ceny 0 przy produktach bez ceny."
COM_MERTOOLS_SETUP_SHOP_OMNIBUS_LABEL="Omnibus"
COM_MERTOOLS_SETUP_SHOP_OMNIBUS_DESC="Najniższa cena z 30 dni przed obniżką przy produktach w promocji. W UE wymagana, gdy pokazujesz obniżki."
COM_MERTOOLS_SETUP_CART_ENABLED_LABEL="Porządkowanie koszyków"
COM_MERTOOLS_SETUP_CART_ENABLED_DESC="Stare koszyki, do których nikt już nie wróci, są usuwane z bazy. Zamówienia zostają."

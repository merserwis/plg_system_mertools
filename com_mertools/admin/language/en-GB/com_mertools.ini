; quick setup
COM_MERTOOLS_SETUP_INTRO="The main tools in one place. Each one shows whether it is recommended for most sites, and the button below turns on all the recommended ones (the optional ones stay as they are). Only the switches you change are saved. The details of each tool are on its own page afterwards."

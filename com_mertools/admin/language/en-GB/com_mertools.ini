COM_MERTOOLS_SETUP_URL_COLLAPSE_SLASHES_LABEL="One address per page"
COM_MERTOOLS_SETUP_URL_COLLAPSE_SLASHES_DESC="Addresses with duplicate slashes (//page) are redirected to the one clean address, so search engines see no duplicates."
COM_MERTOOLS_SETUP_URL_SORT_GUARD_LABEL="Protect the sorting of the lists"
COM_MERTOOLS_SETUP_URL_SORT_GUARD_DESC="A sorting of the lists that Gridbox does not offer is taken out of the address. Protects older versions of Gridbox (security)."
COM_MERTOOLS_SETUP_QS_HYGIENE_LABEL="Site hygiene"
COM_MERTOOLS_SETUP_QS_HYGIENE_DESC="og:url without campaign tags (utm_…), cookies with Secure and SameSite, and no outdated X-XSS-Protection header."
COM_MERTOOLS_SETUP_SPEED_CACHE_LABEL="Page cache for guests"
COM_MERTOOLS_SETUP_SPEED_CACHE_DESC="Finished pages sent to guests at once, usually several times faster, with a warm-up in the background. Once on, check as a guest (private window) that the cart, the forms and any content that changes on the page work."
COM_MERTOOLS_SETUP_QS_FIRSTVIEW_LABEL="Faster first view"
COM_MERTOOLS_SETUP_QS_FIRSTVIEW_DESC="The page shows at once: icon styles, popups and background YouTube videos do not hold it up."
COM_MERTOOLS_SETUP_QS_IMAGES_LABEL="Lighter images"
COM_MERTOOLS_SETUP_QS_IMAGES_DESC="Images that do not make the page jump, and their WebP copies in the size of the screen, made in the background."
COM_MERTOOLS_SETUP_SITEMAP_ENABLED_LABEL="Sitemap"
COM_MERTOOLS_SETUP_SITEMAP_ENABLED_DESC="An XML sitemap of all the pages with the real dates of their changes. If Gridbox has its own sitemap, the sitemap panel compares the two and takes over /sitemap.xml."
COM_MERTOOLS_SETUP_QS_NOTFOUND_LABEL="404 log and moved pages"
COM_MERTOOLS_SETUP_QS_NOTFOUND_DESC="Missing addresses are noted for you to look at, and the pages whose address was changed in Gridbox are redirected to the new one (301)."
COM_MERTOOLS_SETUP_HISTORY_ENABLED_LABEL="Edit history"
COM_MERTOOLS_SETUP_HISTORY_ENABLED_DESC="A record of the changes of Gridbox pages, posts and products: who changed what, and when."
COM_MERTOOLS_SETUP_LOCK_ENABLED_LABEL="Edit lock"
COM_MERTOOLS_SETUP_LOCK_ENABLED_DESC="A page open in the editor by one person is locked for the others, so nobody overwrites somebody else's work."
COM_MERTOOLS_SETUP_QS_APPS_LABEL="Protect the apps"
COM_MERTOOLS_SETUP_QS_APPS_DESC="The Gridbox apps (blog, store) cannot be deleted by mistake, and a backup is made before one is deleted."
COM_MERTOOLS_SETUP_DB_INDEXES_LABEL="Indexes of the Gridbox tables"
COM_MERTOOLS_SETUP_DB_INDEXES_DESC="Indexes Gridbox does not create itself: lists, filters and the cart work faster with many pages and products."
COM_MERTOOLS_SETUP_SHOP_JSONLD_LABEL="Product data for search engines"
COM_MERTOOLS_SETUP_SHOP_JSONLD_DESC="Correct product data (price, availability, brand) as JSON-LD, without a price of 0 for the products without a price."
COM_MERTOOLS_SETUP_SHOP_OMNIBUS_LABEL="Omnibus"
COM_MERTOOLS_SETUP_SHOP_OMNIBUS_DESC="The lowest price of the 30 days before a reduction next to the products on sale. Required in the EU when you show reductions."
COM_MERTOOLS_SETUP_CART_ENABLED_LABEL="Tidy the carts"
COM_MERTOOLS_SETUP_CART_ENABLED_DESC="Old carts that nobody will open again are deleted from the database. Orders stay."
